<template component="v2-activity">
  <section class="content-section animate-fade-in">
    <div class="mb-6 flex items-center gap-3">
      <lucide-icon icon="list-ordered" size="28" class="text-brand dark:text-dark-accent"></lucide-icon>
      <h2 class="text-xl font-bold text-gray-900 tracking-tight dark:text-dark-text">Authentication history</h2>
    </div>

    <!-- Filters -->
    <div class="flex flex-col sm:flex-row gap-3 mb-6">
      <div class="relative flex-1">
        <select
          class="w-full appearance-none bg-white border border-gray-300 text-gray-700 text-sm rounded-lg focus:ring-brand focus:border-brand block p-2.5 pr-10 shadow-sm outline-none dark:bg-dark-surface dark:border-dark-border dark:text-dark-text-soft dark:placeholder:text-dark-placeholder"
          ref="app"
          on-change="filter()"
        >
          <option value="">All apps</option>
          <template for="name of apps"><option attr-value="name">{{ name }}</option></template>
        </select>
        <div
          class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-500 dark:text-dark-muted"
        >
          <lucide-icon icon="chevron-down" size="16"></lucide-icon>
        </div>
      </div>
      <div class="relative flex-1">
        <select
          class="w-full appearance-none bg-white border border-gray-300 text-gray-700 text-sm rounded-lg focus:ring-brand focus:border-brand block p-2.5 pr-10 shadow-sm outline-none dark:bg-dark-surface dark:border-dark-border dark:text-dark-text-soft dark:placeholder:text-dark-placeholder"
          ref="event"
          on-change="filter()"
        >
          <option value="">All events</option>
          <template for="name of events"><option attr-value="name">{{ name }}</option></template>
        </select>
        <div
          class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-500 dark:text-dark-muted"
        >
          <lucide-icon icon="chevron-down" size="16"></lucide-icon>
        </div>
      </div>
      <button
        class="bg-brand hover:bg-brand-hover text-white px-6 py-2.5 rounded-lg text-sm font-semibold transition-colors shadow-sm shrink-0 dark:bg-dark-brand"
        on-click="filter()"
      >
        Filter
      </button>
    </div>

    <!-- Log List -->
    <div class="border border-gray-100 rounded-xl overflow-hidden shadow-list-soft dark:border-dark-border">
      <ul class="divide-y divide-gray-100 dark:divide-dark-border">
        <template if="loading">
          <li class="p-8 text-center text-gray-500 dark:text-dark-muted" role="status">
            Loading authentication history…
          </li>
        </template>
        <template if="!loading &amp;&amp; error">
          <li class="p-8 text-center text-red-600 dark:text-dark-danger" role="alert">{{ error }}</li>
        </template>
        <template if="!loading &amp;&amp; !error &amp;&amp; audit.length === 0">
          <li class="p-8 text-center text-gray-500 dark:text-dark-muted">No authentication activity found.</li>
        </template>
        <template for="entry of audit">
          <li
            class="p-4 hover:bg-gray-50/80 transition-colors flex flex-col sm:flex-row sm:items-center justify-between gap-2 dark:hover:bg-dark-hover"
          >
            <div>
              <div class="font-bold text-gray-900 text-sm mb-0.5 dark:text-dark-text">{{ entry.app }}</div>
              <div class="text-xs text-gray-500 font-mono dark:text-dark-muted">
                {{ entry.event }}<template if="entry.redirectUri"> · {{ entry.redirectUri }}</template>
              </div>
            </div>
            <div class="flex flex-col sm:items-end gap-0.5">
              <span
                class="text-xs font-bold"
                bind-class="{ 'activity-result-success': entry.result === 'success', 'activity-result-failure': entry.result !== 'success' }"
                >{{ entry.result }}</span
              >
              <span class="text-xs text-gray-400 font-mono dark:text-dark-muted"
                >{{ formatDate(entry.timestamp) }}</span
              >
            </div>
          </li>
        </template>
      </ul>
    </div>

    <!-- Pagination -->
    <div class="mt-5 flex items-center justify-between border-t border-gray-100 pt-4 dark:border-dark-border">
      <button
        class="rounded-xl border border-gray-200 px-3 py-2 text-sm font-semibold disabled:border-transparent disabled:bg-gray-100 disabled:text-gray-400 dark:border-dark-border"
        on-click="previous()"
        bind-disabled.bool="offset === 0 || loading"
      >
        Previous
      </button>
      <span class="text-sm text-gray-500 dark:text-dark-muted">{{ Math.floor(offset / 20) + 1 }} / {{ pages }}</span>
      <button
        class="rounded-xl border border-gray-200 px-3 py-2 text-sm font-semibold disabled:border-transparent disabled:bg-gray-100 disabled:text-gray-400 dark:border-dark-border"
        on-click="next()"
        bind-disabled.bool="loading || offset + 20 >= total"
      >
        Next
      </button>
    </div>
  </section>

  <script setup>
    import { ref, templateRef } from '@li3/web';
    import { getAuditEvents, getAuditOptions } from '/ui/dashboard.mjs';

    export default function () {
      const audit = ref([]);
      const apps = ref([]);
      const events = ref([]);
      const total = ref(0);
      const offset = ref(0);
      const pages = ref(1);
      const app = templateRef('app');
      const event = templateRef('event');
      const loading = ref(false);
      const error = ref('');
      let requestId = 0;

      const load = async (nextOffset = 0) => {
        const id = ++requestId;
        loading.value = true;
        error.value = '';
        try {
          const result = await getAuditEvents({
            app: app.value?.value || '',
            event: event.value?.value || '',
            offset: nextOffset,
          });
          if (id !== requestId) return;
          audit.value = Array.isArray(result.items) ? result.items : [];
          total.value = Number(result.total) || 0;
          offset.value = Number(result.offset) || 0;
          pages.value = Math.max(1, Math.ceil(total.value / 20));
        } catch (cause) {
          if (id === requestId) {
            audit.value = [];
            total.value = 0;
            offset.value = 0;
            pages.value = 1;
            error.value = cause instanceof Error ? cause.message : 'Could not load authentication history.';
          }
        } finally {
          if (id === requestId) loading.value = false;
        }
      };

      const filter = () => load(0);
      const previous = () => load(Math.max(0, offset.value - 20));
      const next = () => load(offset.value + 20);

      const formatDate = (dateStr) => {
        try {
          return new Date(dateStr).toISOString().replace('T', ' ').slice(0, 19);
        } catch {
          return dateStr;
        }
      };

      getAuditOptions()
        .then((value) => {
          apps.value = Array.isArray(value.apps) ? value.apps : [];
          events.value = Array.isArray(value.events) ? value.events : [];
        })
        .catch((cause) => {
          error.value = cause instanceof Error ? cause.message : 'Could not load audit filters.';
        });
      load();

      return {
        audit,
        apps,
        events,
        total,
        offset,
        pages,
        loading,
        error,
        app,
        event,
        filter,
        previous,
        next,
        formatDate,
      };
    }
  </script>
</template>
