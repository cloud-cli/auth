<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#eef2ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1511" media="(prefers-color-scheme: dark)" />
    <script>
      const savedTheme = localStorage.getItem('auth-theme');
      const systemTheme = window.matchMedia('(prefers-color-scheme: dark)');
      const initialTheme =
        savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : systemTheme.matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = initialTheme;
      document.documentElement.classList.toggle('dark', initialTheme === 'dark');
      systemTheme.addEventListener('change', (event) => {
        const savedPreference = localStorage.getItem('auth-theme');
        if (savedPreference !== 'dark' && savedPreference !== 'light') {
          document.documentElement.dataset.theme = event.matches ? 'dark' : 'light';
          document.documentElement.classList.toggle('dark', event.matches);
        }
      });
    </script>
    <link rel="manifest" href="/ui/manifest.webmanifest" />
    <title>Flow Auth - Identity & Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'app-bg': '#eef2ec',
              brand: '#263d32',
              'brand-hover': '#13271f',
              accent: '#3b714b',
              'accent-hover': '#2f563b',
              'text-main': '#263d32',
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
            },
          },
        },
      };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script type="importmap">
      { "imports": { "@li3/": "https://cdn.li3.dev/@li3/" } }
    </script>
    <style>
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
    <link rel="component" href="/ui/v2-layout.html" />
    <link rel="component" href="/ui/v2-security.html" />
    <link rel="component" href="/ui/v2-properties.html" />
    <link rel="component" href="/ui/v2-applications.html" />
    <link rel="component" href="/ui/v2-users.html" />
    <link rel="component" href="/ui/v2-keys.html" />
    <link rel="component" href="/ui/v2-activity.html" />
    <link rel="component" href="/ui/v2-profile.html" />
    <link rel="component" href="/ui/v2-copy-value.html" />
    <script type="module" src="/ui/app.mjs"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/ui/sw.js', { scope: '/' }).catch(() => {});
      }
    </script>
  </head>
  <body
    data-page="v2"
    class="h-screen w-screen flex overflow-hidden bg-app-bg font-sans text-text-main dark:bg-[#0e1511] dark:text-[#e8efe9] dark:scheme-dark"
  >
    <template app>
      <v2-layout class="block h-full w-full"></v2-layout>
      <script setup src="/ui/app.mjs"></script>
    </template>
  </body>
</html>
