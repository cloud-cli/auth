<template component="v2-callback-editor"
  ><div class="mt-5 rounded-xl bg-brand/5 p-3 text-sm dark:bg-[#c8e6a8]/[0.06]">
    <strong>Callback URLs</strong>
    <template for="uri of app.redirectUris"
      ><div class="mt-2 flex items-center gap-2 rounded-lg bg-white px-3 py-2 dark:bg-[#17211b]">
        <span class="min-w-0 flex-1 break-all text-slate-600 dark:text-[#aab7ad]">{{ uri }}</span
        ><template if="admin"
          ><button class="text-red-600 dark:text-[#ffb8ae]" type="button" on-click="removeCallback(uri)">
            Remove
          </button></template
        >
      </div></template
    >
    <template if="admin"
      ><form class="mt-6 flex gap-2 border-t border-brand/10 pt-3" on-submit.prevent="addCallback()">
        <input
          class="min-w-0 flex-1 rounded-lg border border-slate-200 bg-white px-3 py-2 dark:border-[#2d3a31] dark:bg-[#17211b] dark:text-[#edf3ee] dark:placeholder:text-[#87948a]"
          bind-value="callbackInput"
          on-input="setCallbackInput($event.target.value)"
          placeholder="https://app.example/callback"
          required
        /><button class="rounded-lg border border-brand px-3 py-2 font-semibold text-brand dark:text-[#c8e6a8]">
          Add
        </button>
      </form>
      <p class="mt-2 text-xs text-red-600 dark:text-[#ffb8ae]">{{ callbackError }}</p></template
    >
  </div>
  <script setup>
    import { defineProp, hook, ref } from '@li3/web';
    import { updateOidcCallbacks } from '/ui/dashboard.mjs';
    export default function () {
      const app = defineProp('app'),
        admin = defineProp('admin', { default: false }),
        callbackError = ref('');
      const [callbackInput, setCallbackInput] = hook('');
      const updateCallbacks = async (callbacks) => {
        try {
          app.value.redirectUris = (await updateOidcCallbacks(app.value.id, callbacks)).redirectUris;
          callbackError.value = '';
        } catch (error) {
          callbackError.value = error.message || 'Could not save callback URLs.';
        }
      };
      const addCallback = async () => {
        const callback = callbackInput.value.trim();
        if (!validCallback(callback, app.value.isPublic)) {
          return (callbackError.value = 'Use HTTPS, a loopback HTTP URL, or a custom scheme for a public app.');
        }
        await updateCallbacks([...app.value.redirectUris, callback]);
        if (!callbackError.value) setCallbackInput('');
      };
      const removeCallback = (callback) =>
        updateCallbacks(app.value.redirectUris.filter((value) => value !== callback));
      const validCallback = (callback, publicClient) => {
        try {
          const url = new URL(callback);
          return (
            url.protocol === 'https:' ||
            (url.protocol === 'http:' && ['localhost', '127.0.0.1', '[::1]'].includes(url.hostname)) ||
            (publicClient && /^[a-z][a-z0-9+.-]*\.[a-z0-9+.-]+:$/i.test(url.protocol))
          );
        } catch {
          return false;
        }
      };
      return { app, admin, callbackError, callbackInput, setCallbackInput, addCallback, removeCallback, validCallback };
    }
  </script></template
>

<template component="v2-logout-redirect-editor"
  ><div class="mt-4 rounded-xl bg-brand/5 p-3 text-sm dark:bg-[#c8e6a8]/[0.06]">
    <strong>Post-logout return URLs</strong>
    <template for="uri of app.postLogoutRedirectUris || []"
      ><div class="mt-2 flex items-center gap-2 rounded-lg bg-white px-3 py-2 dark:bg-[#17211b]">
        <span class="min-w-0 flex-1 break-all text-slate-600 dark:text-[#aab7ad]">{{ uri }}</span
        ><template if="admin"
          ><button class="text-red-600 dark:text-[#ffb8ae]" type="button" on-click="removeRedirect(uri)">
            Remove
          </button></template
        >
      </div></template
    >
    <template if="admin"
      ><form class="mt-4 flex gap-2 border-t border-brand/10 pt-3" on-submit.prevent="addRedirect()">
        <input
          class="min-w-0 flex-1 rounded-lg border border-slate-200 bg-white px-3 py-2 dark:border-[#2d3a31] dark:bg-[#17211b] dark:text-[#edf3ee] dark:placeholder:text-[#87948a]"
          bind-value="redirectInput"
          on-input="setRedirectInput($event.target.value)"
          placeholder="https://app.example/signed-out"
          required
        /><button class="rounded-lg border border-brand px-3 py-2 font-semibold text-brand dark:text-[#c8e6a8]">
          Add
        </button>
      </form>
      <p class="mt-2 text-xs text-red-600 dark:text-[#ffb8ae]">{{ redirectError }}</p></template
    >
  </div>
  <script setup>
    import { defineProp, hook, ref } from '@li3/web';
    import { updateOidcLogoutRedirects } from '/ui/dashboard.mjs';
    export default function () {
      const app = defineProp('app'),
        admin = defineProp('admin', { default: false }),
        redirectError = ref('');
      const [redirectInput, setRedirectInput] = hook('');
      const values = () => app.value.postLogoutRedirectUris || [];
      const save = async (uris) => {
        try {
          app.value.postLogoutRedirectUris = (
            await updateOidcLogoutRedirects(app.value.id, uris)
          ).postLogoutRedirectUris;
          redirectError.value = '';
        } catch (error) {
          redirectError.value = error.message || 'Could not save post-logout URLs.';
        }
      };
      const addRedirect = async () => {
        const uri = redirectInput.value.trim();
        if (!validCallback(uri, app.value.isPublic)) {
          return (redirectError.value = 'Use HTTPS, a loopback HTTP URL, or a custom scheme for a public app.');
        }
        await save([...new Set([...values(), uri])]);
        if (!redirectError.value) setRedirectInput('');
      };
      const removeRedirect = (uri) => save(values().filter((value) => value !== uri));
      const validCallback = (value, publicClient) => {
        try {
          const url = new URL(value);
          return (
            url.protocol === 'https:' ||
            (url.protocol === 'http:' && ['localhost', '127.0.0.1', '[::1]'].includes(url.hostname)) ||
            (publicClient && /^[a-z][a-z0-9+.-]*\.[a-z0-9+.-]+:$/i.test(url.protocol))
          );
        } catch {
          return false;
        }
      };
      return { app, admin, redirectError, redirectInput, setRedirectInput, addRedirect, removeRedirect };
    }
  </script></template
>

<template component="v2-scope-editor"
  ><div>
    <h3 class="font-bold">Scopes</h3>
    <div class="mt-1 flex flex-wrap gap-1">
      <template for="scope of app.scopes"
        ><template if="admin"
          ><button
            class="inline-flex items-center gap-1 rounded-full bg-brand/10 px-2 py-1 text-xs text-brand dark:bg-[#c8e6a8]/10 dark:text-[#c8e6a8]"
            type="button"
            on-click="removeScope(scope)"
          >
            <span>{{ scope }}</span><span aria-hidden="true">x</span>
          </button></template
        ><template if="!admin"
          ><span class="rounded-full bg-brand/10 px-2 py-1 text-xs text-brand dark:bg-[#c8e6a8]/10 dark:text-[#c8e6a8]"
            >{{ scope }}</span
          ></template
        ></template
      >
    </div>
    <template if="admin"
      ><div class="mt-2 flex gap-2">
        <input
          class="min-w-0 flex-1 rounded-lg border border-slate-200 px-3 py-2 text-sm dark:border-[#2d3a31] dark:bg-[#17211b] dark:text-[#edf3ee] dark:placeholder:text-[#87948a]"
          placeholder="new:scope"
          bind-value="scopeInput"
          on-input="setScopeInput($event.target.value)"
        />
        <button
          class="rounded-lg bg-brand px-3 py-2 text-sm font-semibold text-white dark:bg-[#376d46]"
          type="button"
          on-click="addScope($event)"
        >
          Add
        </button>
      </div></template
    >
  </div>
  <script setup>
    import { defineProp, hook } from '@li3/web';
    import { addOidcScopes, updateOidcScopes } from '/ui/dashboard.mjs';
    export default function () {
      const app = defineProp('app'),
        admin = defineProp('admin', { default: false }),
        [scopeInput, setScopeInput] = hook('');
      const addScope = async (event) => {
        const scope = scopeInput.value.trim();
        if (!scope) return;
        const result = await addOidcScopes(app.value.id, [scope]);
        app.value.scopes = result.scopes;
        setScopeInput('');
      };
      const removeScope = async (scope) => {
        if (!confirm(`Remove ${scope}? Existing tokens will lose this scope.`)) return;
        const result = await updateOidcScopes(
          app.value.id,
          app.value.scopes.filter((value) => value !== scope),
        );
        app.value.scopes = result.scopes;
      };
      return { app, admin, scopeInput, setScopeInput, addScope, removeScope };
    }
  </script></template
>

<template component="v2-token-editor"
  ><div>
    <h3 class="font-bold">Tokens</h3>
    <div class="mt-2 grid gap-2 rounded-lg bg-brand/5 p-2 dark:bg-[#c8e6a8]/[0.06]">
      <input
        class="rounded-lg border border-slate-200 px-3 py-2 text-sm dark:border-[#2d3a31] dark:bg-[#17211b] dark:text-[#edf3ee] dark:placeholder:text-[#87948a]"
        bind-value="tokenLabel"
        on-input="setTokenLabel($event.target.value)"
        placeholder="Token label"
        required
      />
      <div class="grid gap-1">
        <template for="scope of app.scopes"
          ><label
            class="flex items-center gap-2 rounded-lg border border-brand/20 bg-white px-2 py-1 text-xs text-brand dark:border-[#c8e6a8]/25 dark:bg-[#17211b] dark:text-[#c8e6a8]"
          >
            <input
              class="mr-1 accent-brand dark:bg-[#17211b] dark:text-[#edf3ee] dark:placeholder:text-[#87948a]"
              type="checkbox"
              attr-checked.bool="tokenScopes.includes(scope)"
              on-change="toggleTokenScope(scope)"
            />{{ scope }}
          </label></template
        >
      </div>
      <p class="text-xs text-red-600 dark:text-[#ffb8ae]">{{ tokenError }}</p>
      <div class="flex justify-end">
        <button
          class="rounded-lg bg-brand px-4 py-2 text-sm font-semibold text-white transition-colors hover:bg-brand-hover dark:bg-[#376d46]"
          type="button"
          on-click="createToken()"
        >
          Generate token
        </button>
      </div>
    </div>
    <template if="createdToken"
      ><v2-copy-value-box
        bind-token="createdToken"
        message="Copy this downstream API token now. It is only shown once."
      ></v2-copy-value-box
    ></template>
    <p class="mt-2 text-sm text-slate-500 dark:text-[#aab7ad]" hidden="false" bind-hidden.bool="app.tokens.length > 0">
      No tokens yet.
    </p>
    <div class="mt-2 grid gap-2">
      <template for="token of app.tokens"
        ><article class="rounded-lg border border-slate-100 p-2 text-sm dark:border-[#2d3a31]">
          <strong>{{ token.label }}</strong>
          <p class="text-slate-600 dark:text-[#aab7ad]">Created {{ token.createdAt }}</p>
          <p class="break-words text-slate-600 dark:text-[#aab7ad]">Scopes: {{ token.scopes.join(', ') }}</p>
          <template if="token.revokedAt"
            ><p
              class="mt-2 inline-flex rounded-full bg-red-50 px-2 py-1 text-xs font-semibold text-red-700 dark:bg-red-950 dark:text-[#ffb8ae]"
            >
              Revoked {{ token.revokedAt }}
            </p></template
          >
          <template if="!token.revokedAt"
            ><p
              class="mt-2 inline-flex rounded-full bg-emerald-50 px-2 py-1 text-xs font-semibold text-emerald-700 dark:bg-emerald-950 dark:text-[#c5e8c5]"
            >
              Active
            </p></template
          >
          <template if="!token.revokedAt">
            <div class="mt-2 flex flex-wrap items-start gap-2">
              <details class="min-w-0 flex-1 rounded-md border border-slate-200 p-2 dark:border-[#2d3a31]">
                <summary
                  class="cursor-pointer text-xs font-semibold text-slate-700 dark:text-[#edf3ee]"
                  on-click="startEditScopes(token)"
                >
                  Edit scopes
                </summary>
                <div class="mt-2 grid gap-2">
                  <p class="text-xs font-semibold text-slate-600 dark:text-[#aab7ad]">Token scopes</p>
                  <template for="scope of app.scopes"
                    ><label class="flex items-center gap-2 text-xs"
                      ><input
                        type="checkbox"
                        attr-checked.bool="editScopes.includes(scope)"
                        on-change="toggleEditScope(scope)"
                      />{{ scope }}</label
                    ></template
                  >
                  <p class="text-xs text-red-600 dark:text-[#ffb8ae]">{{ editError }}</p>
                  <div class="flex gap-2">
                    <button
                      class="rounded-md bg-brand px-3 py-1.5 text-xs font-semibold text-white dark:bg-[#376d46]"
                      type="button"
                      on-click="saveScopes(token, $event)"
                    >
                      Save scopes
                    </button>
                    <button
                      class="rounded-md border border-slate-300 px-3 py-1.5 text-xs font-semibold dark:border-[#526157]"
                      type="button"
                      on-click="cancelEditScopes($event)"
                    >
                      Cancel
                    </button>
                  </div>
                </div>
              </details>
              <button
                class="rounded-md border border-red-300 bg-red-50 px-3 py-1.5 text-xs font-semibold text-red-700 hover:bg-red-100 dark:border-red-900 dark:bg-red-950 dark:text-[#ffb8ae]"
                type="button"
                on-click="revokeToken(token)"
              >
                Revoke token
              </button>
            </div>
          </template>
        </article></template
      >
    </div>
  </div>
  <script setup>
    import { defineProp, hook, ref } from '@li3/web';
    import { createApiToken, getApiTokens, revokeApiToken, updateApiTokenScopes } from '/ui/dashboard.mjs';
    export default function () {
      const app = defineProp('app'),
        createdToken = ref(''),
        tokenScopes = ref([]),
        tokenError = ref(''),
        editScopes = ref([]),
        editError = ref(''),
        [tokenLabel, setTokenLabel] = hook('');
      const load = async () => {
        if (!app.value?.id) return;
        app.value.tokens = await getApiTokens(app.value.id);
        app.value.tokensLoaded = true;
      };
      const toggleTokenScope = (scope) => {
        tokenScopes.value = tokenScopes.value.includes(scope)
          ? tokenScopes.value.filter((value) => value !== scope)
          : [...tokenScopes.value, scope];
      };
      const startEditScopes = (token) => {
        editScopes.value = [...token.scopes];
        editError.value = '';
      };
      const toggleEditScope = (scope) => {
        editScopes.value = editScopes.value.includes(scope)
          ? editScopes.value.filter((value) => value !== scope)
          : [...editScopes.value, scope];
      };
      const cancelEditScopes = (event) => {
        event?.currentTarget?.closest('details')?.removeAttribute('open');
        editScopes.value = [];
        editError.value = '';
      };
      const saveScopes = async (token, event) => {
        if (!editScopes.value.length) {
          editError.value = 'Choose at least one scope.';
          return;
        }
        try {
          await updateApiTokenScopes(app.value.id, token.tokenId, editScopes.value);
          cancelEditScopes(event);
          await load();
        } catch (error) {
          editError.value = error.message || 'Could not update token scopes.';
        }
      };
      const createToken = async () => {
        if (!tokenScopes.value.length) {
          tokenError.value = 'Choose at least one scope.';
          return;
        }
        try {
          const result = await createApiToken(app.value.id, tokenLabel.value, tokenScopes.value);
          setTokenLabel('');
          tokenScopes.value = [];
          tokenError.value = '';
          createdToken.value = result.token;
          await load();
        } catch (error) {
          tokenError.value = error.message || 'Could not create token.';
        }
      };
      const revokeToken = async (token) => {
        if (confirm('Revoke this token?')) {
          await revokeApiToken(app.value.id, token.tokenId);
          await load();
        }
      };
      return {
        app,
        createdToken,
        tokenScopes,
        tokenError,
        editScopes,
        editError,
        tokenLabel,
        setTokenLabel,
        toggleTokenScope,
        startEditScopes,
        toggleEditScope,
        cancelEditScopes,
        saveScopes,
        createToken,
        revokeToken,
      };
    }
  </script></template
>
