<template component="v2-app-editor"
  ><div class="mt-3 grid gap-3 rounded-xl bg-brand/5 p-3 text-sm dark:bg-[#c8e6a8]/[0.06]">
    <template if="admin"
      ><form class="flex flex-wrap items-center gap-2" on-submit.prevent="saveName()">
        <label class="sr-only" attr-for="'app-name-' + app.id">Application name</label>
        <input
          class="min-w-0 flex-1 rounded-lg border border-slate-200 bg-white px-3 py-2 dark:border-[#2d3a31] dark:bg-[#17211b] dark:text-[#edf3ee]"
          attr-id="'app-name-' + app.id"
          bind-value="nameInput"
          on-input="setNameInput($event.target.value)"
          maxlength="80"
          required
        />
        <button class="rounded-lg border border-brand px-3 py-2 font-semibold text-brand dark:text-[#c8e6a8]">
          Save name
        </button>
      </form></template
    >
    <div class="flex flex-wrap items-center gap-2">
      <strong>Immutable client ID</strong>
      <code class="min-w-0 flex-1 break-all font-mono text-xs">{{ app.id }}</code>
      <button
        class="rounded-lg border border-slate-200 px-3 py-1.5 text-xs font-semibold dark:border-[#2d3a31]"
        type="button"
        on-click="copyClientId()"
      >
        Copy
      </button>
    </div>
  </div>
  <template if="admin || (app.redirectUris && app.redirectUris.length > 0)">
    <v2-callback-editor bind-app="app" bind-admin="admin"></v2-callback-editor>
  </template>
  <template if="admin || (app.postLogoutRedirectUris && app.postLogoutRedirectUris.length > 0)">
    <v2-logout-redirect-editor bind-app="app" bind-admin="admin"></v2-logout-redirect-editor>
  </template>
  <div class="mt-3 grid gap-4">
    <v2-scope-editor bind-app="app" bind-admin="admin"></v2-scope-editor>
  </div>
  <script setup>
    import { defineProp, hook } from '@li3/web';
    import { updateOidcClientName } from '/ui/dashboard.mjs';
    export default function () {
      const app = defineProp('app'),
        admin = defineProp('admin', { default: false }),
        [nameInput, setNameInput] = hook(app.value?.name || '');
      const saveName = async () => {
        try {
          const result = await updateOidcClientName(app.value.id, nameInput.value);
          app.value.name = result.name;
        } catch (error) {
          alert(error.message || 'Could not save application name.');
        }
      };
      const copyClientId = async () => {
        try {
          await navigator.clipboard.writeText(app.value.id);
        } catch {
          alert('Could not copy client ID. Select and copy it instead.');
        }
      };
      return { app, admin, nameInput, setNameInput, saveName, copyClientId };
    }
  </script></template
>

<template component="v2-callback-editor"
  ><div class="mt-5 rounded-xl bg-brand/5 p-3 text-sm dark:bg-[#c8e6a8]/[0.06]">
    <strong>Callback URLs</strong>
    <template for="uri of app.redirectUris"
      ><div class="mt-2 flex items-center gap-2 rounded-lg bg-white px-3 py-2 dark:bg-[#17211b]">
        <span class="min-w-0 flex-1 break-all text-slate-600 dark:text-[#aab7ad]">{{ uri }}</span
        ><template if="admin"
          ><button class="text-red-600 dark:text-[#ffb8ae]" type="button" on-click="removeCallback(uri)">
            Remove
          </button></template
        >
      </div></template
    >
    <template if="admin"
      ><form class="mt-6 flex gap-2 border-t border-brand/10 pt-3" on-submit.prevent="addCallback()">
        <input
          class="min-w-0 flex-1 rounded-lg border border-slate-200 bg-white px-3 py-2 dark:border-[#2d3a31] dark:bg-[#17211b] dark:text-[#edf3ee] dark:placeholder:text-[#87948a]"
          bind-value="callbackInput"
          on-input="setCallbackInput($event.target.value)"
          placeholder="https://app.example/callback"
          required
        /><button class="rounded-lg border border-brand px-3 py-2 font-semibold text-brand dark:text-[#c8e6a8]">
          Add
        </button>
      </form>
      <p class="mt-2 text-xs text-red-600 dark:text-[#ffb8ae]">{{ callbackError }}</p></template
    >
  </div>
  <script setup>
    import { defineProp, hook, ref } from '@li3/web';
    import { updateOidcCallbacks } from '/ui/dashboard.mjs';
    export default function () {
      const app = defineProp('app'),
        admin = defineProp('admin', { default: false }),
        callbackError = ref('');
      const [callbackInput, setCallbackInput] = hook('');
      const updateCallbacks = async (callbacks) => {
        try {
          app.value.redirectUris = (await updateOidcCallbacks(app.value.id, callbacks)).redirectUris;
          callbackError.value = '';
        } catch (error) {
          callbackError.value = error.message || 'Could not save callback URLs.';
        }
      };
      const addCallback = async () => {
        const callback = callbackInput.value.trim();
        if (!validCallback(callback, app.value.isPublic)) {
          return (callbackError.value = 'Use HTTPS, a loopback HTTP URL, or a custom scheme for a public app.');
        }
        await updateCallbacks([...app.value.redirectUris, callback]);
        if (!callbackError.value) setCallbackInput('');
      };
      const removeCallback = (callback) =>
        updateCallbacks(app.value.redirectUris.filter((value) => value !== callback));
      const validCallback = (callback, publicClient) => {
        try {
          const url = new URL(callback);
          return (
            url.protocol === 'https:' ||
            (url.protocol === 'http:' && ['localhost', '127.0.0.1', '[::1]'].includes(url.hostname)) ||
            (publicClient && /^[a-z][a-z0-9+.-]*\.[a-z0-9+.-]+:$/i.test(url.protocol))
          );
        } catch {
          return false;
        }
      };
      return { app, admin, callbackError, callbackInput, setCallbackInput, addCallback, removeCallback, validCallback };
    }
  </script></template
>

<template component="v2-logout-redirect-editor"
  ><div class="mt-4 rounded-xl bg-brand/5 p-3 text-sm dark:bg-[#c8e6a8]/[0.06]">
    <strong>Post-logout return URLs</strong>
    <template for="uri of app.postLogoutRedirectUris || []"
      ><div class="mt-2 flex items-center gap-2 rounded-lg bg-white px-3 py-2 dark:bg-[#17211b]">
        <span class="min-w-0 flex-1 break-all text-slate-600 dark:text-[#aab7ad]">{{ uri }}</span
        ><template if="admin"
          ><button class="text-red-600 dark:text-[#ffb8ae]" type="button" on-click="removeRedirect(uri)">
            Remove
          </button></template
        >
      </div></template
    >
    <template if="admin"
      ><form class="mt-4 flex gap-2 border-t border-brand/10 pt-3" on-submit.prevent="addRedirect()">
        <input
          class="min-w-0 flex-1 rounded-lg border border-slate-200 bg-white px-3 py-2 dark:border-[#2d3a31] dark:bg-[#17211b] dark:text-[#edf3ee] dark:placeholder:text-[#87948a]"
          bind-value="redirectInput"
          on-input="setRedirectInput($event.target.value)"
          placeholder="https://app.example/signed-out"
          required
        /><button class="rounded-lg border border-brand px-3 py-2 font-semibold text-brand dark:text-[#c8e6a8]">
          Add
        </button>
      </form>
      <p class="mt-2 text-xs text-red-600 dark:text-[#ffb8ae]">{{ redirectError }}</p></template
    >
  </div>
  <script setup>
    import { defineProp, hook, ref } from '@li3/web';
    import { updateOidcLogoutRedirects } from '/ui/dashboard.mjs';
    export default function () {
      const app = defineProp('app'),
        admin = defineProp('admin', { default: false }),
        redirectError = ref('');
      const [redirectInput, setRedirectInput] = hook('');
      const values = () => app.value.postLogoutRedirectUris || [];
      const save = async (uris) => {
        try {
          app.value.postLogoutRedirectUris = (
            await updateOidcLogoutRedirects(app.value.id, uris)
          ).postLogoutRedirectUris;
          redirectError.value = '';
        } catch (error) {
          redirectError.value = error.message || 'Could not save post-logout URLs.';
        }
      };
      const addRedirect = async () => {
        const uri = redirectInput.value.trim();
        if (!validCallback(uri, app.value.isPublic)) {
          return (redirectError.value = 'Use HTTPS, a loopback HTTP URL, or a custom scheme for a public app.');
        }
        await save([...new Set([...values(), uri])]);
        if (!redirectError.value) setRedirectInput('');
      };
      const removeRedirect = (uri) => save(values().filter((value) => value !== uri));
      const validCallback = (value, publicClient) => {
        try {
          const url = new URL(value);
          return (
            url.protocol === 'https:' ||
            (url.protocol === 'http:' && ['localhost', '127.0.0.1', '[::1]'].includes(url.hostname)) ||
            (publicClient && /^[a-z][a-z0-9+.-]*\.[a-z0-9+.-]+:$/i.test(url.protocol))
          );
        } catch {
          return false;
        }
      };
      return { app, admin, redirectError, redirectInput, setRedirectInput, addRedirect, removeRedirect };
    }
  </script></template
>

<template component="v2-scope-editor"
  ><div>
    <h3 class="font-bold">Scopes</h3>
    <div class="mt-1 flex flex-wrap gap-1">
      <template for="scope of app.scopes"
        ><template if="admin"
          ><button
            class="inline-flex items-center gap-1 rounded-full bg-brand/10 px-2 py-1 text-xs text-brand dark:bg-[#c8e6a8]/10 dark:text-[#c8e6a8]"
            type="button"
            on-click="removeScope(scope)"
          >
            <span>{{ scope }}</span><span aria-hidden="true">x</span>
          </button></template
        ><template if="!admin"
          ><span class="rounded-full bg-brand/10 px-2 py-1 text-xs text-brand dark:bg-[#c8e6a8]/10 dark:text-[#c8e6a8]"
            >{{ scope }}</span
          ></template
        ></template
      >
    </div>
    <template if="admin"
      ><div class="mt-2 flex gap-2">
        <input
          class="min-w-0 flex-1 rounded-lg border border-slate-200 px-3 py-2 text-sm dark:border-[#2d3a31] dark:bg-[#17211b] dark:text-[#edf3ee] dark:placeholder:text-[#87948a]"
          placeholder="new:scope"
          bind-value="scopeInput"
          on-input="setScopeInput($event.target.value)"
        />
        <button
          class="rounded-lg bg-brand px-3 py-2 text-sm font-semibold text-white dark:bg-[#376d46]"
          type="button"
          on-click="addScope($event)"
        >
          Add
        </button>
      </div></template
    >
  </div>
  <script setup>
    import { defineProp, hook } from '@li3/web';
    import { addOidcScopes, updateOidcScopes } from '/ui/dashboard.mjs';
    export default function () {
      const app = defineProp('app'),
        admin = defineProp('admin', { default: false }),
        [scopeInput, setScopeInput] = hook('');
      const addScope = async (event) => {
        const scope = scopeInput.value.trim();
        if (!scope) return;
        const result = await addOidcScopes(app.value.id, [scope]);
        app.value.scopes = result.scopes;
        setScopeInput('');
      };
      const removeScope = async (scope) => {
        if (!confirm(`Remove ${scope}? Existing tokens will lose this scope.`)) return;
        const result = await updateOidcScopes(
          app.value.id,
          app.value.scopes.filter((value) => value !== scope),
        );
        app.value.scopes = result.scopes;
      };
      return { app, admin, scopeInput, setScopeInput, addScope, removeScope };
    }
  </script></template
>
