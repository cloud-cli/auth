<template component="signing-key-manager"><section class="mt-5 rounded-3xl border border-amber-200 bg-amber-50 p-6"><h3 class="flex items-center gap-2 text-lg font-extrabold text-amber-950"><lucide-icon icon="key-round" size="19"></lucide-icon>Signing keys</h3><p class="mt-1 text-sm text-amber-900">Rotate signing keys without changing OIDC clients.</p><div class="mt-4 grid gap-2"><template for="key of keys"><div class="flex items-center justify-between rounded-xl bg-white/70 px-3 py-2 text-sm"><span class="font-mono">{{ key.kid }}</span><span>{{ key.status }}</span></div></template></div><button class="mt-4 rounded-xl bg-amber-900 px-4 py-2 font-bold text-white" on-click="rotate()">Rotate signing key</button></section><script setup>import { ref } from '@li3/web';import { getSigningKeys,rotateSigningKey } from '@apphor/dashboard.mjs';export default function(){const keys=ref([]);const load=async()=>keys.value=await getSigningKeys();const rotate=async()=>{if(confirm('Rotate the JWT signing key?')){await rotateSigningKey();await load()}};load();return{keys,rotate}}</script></template>
