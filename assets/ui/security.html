<template component="dashboard-security"><section class="mt-5 rounded-3xl bg-white p-6 shadow-xl shadow-violet/5"><div class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between"><div><h2 class="flex items-center gap-2 text-xl font-extrabold"><lucide-icon icon="key-round" size="20" icon-classes="text-violet"></lucide-icon>Passkeys</h2><p class="mt-1 text-slate-500">Add a passkey to sign in without Google.</p></div><button class="flex items-center justify-center gap-2 rounded-xl bg-violet px-4 py-2 font-bold text-white" on-click="addPasskey()"><lucide-icon icon="plus" size="17"></lucide-icon>Add passkey</button></div><div class="mt-5 divide-y divide-slate-100"><template for="key of passkeys"><article class="flex items-center justify-between gap-4 py-4"><div><strong>{{ key.label }}</strong><span class="mt-1 block text-sm text-slate-500">Last used {{ key.lastUsedAt || 'never' }}</span></div><button class="grid h-10 w-10 place-items-center rounded-xl text-rose-600 hover:bg-rose-50" on-click="revoke(key.credentialId)"><lucide-icon icon="trash" size="18"></lucide-icon><span class="sr-only">Revoke passkey</span></button></article></template></div><a class="mt-4 inline-flex items-center gap-2 font-semibold text-violet" href="/pwa/"><lucide-icon icon="scan-line" size="18"></lucide-icon>Install Auth QR app</a><div class="mt-8 border-t border-slate-100 pt-6"><div class="flex items-center justify-between gap-4"><div><h2 class="flex items-center gap-2 text-xl font-extrabold"><lucide-icon icon="life-buoy" size="20" icon-classes="text-violet"></lucide-icon>Recovery codes</h2><p class="mt-1 text-slate-500">Generate ten offline backup codes. New codes replace the old set.</p></div><button class="rounded-xl border border-violet px-4 py-2 font-bold text-violet" on-click="recoveryCodes()">Generate</button></div><pre class="mt-5 whitespace-pre-wrap font-bold text-violet">{{ codes }}</pre></div></section><script setup>import { ref } from '@li3/web';import { generateRecoveryCodes, getPasskeys, registerPasskey, revokePasskey } from '/dashboard.mjs';export default function(){const passkeys=ref([]),codes=ref('');const load=async()=>passkeys.value=(await getPasskeys()).filter((key)=>!key.revokedAt);const addPasskey=async()=>{const label=prompt('Name this passkey','My device');if(label){await registerPasskey(label);await load()}};const revoke=async(id)=>{if(confirm('Revoke this passkey?')){await revokePasskey(id);await load()}};const recoveryCodes=async()=>{if(confirm('This invalidates any existing recovery codes. Continue?'))codes.value=(await generateRecoveryCodes()).join('\n')};load();return{passkeys,codes,addPasskey,revoke,recoveryCodes}}</script></template>
