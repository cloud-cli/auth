<template component="dashboard-security"
  ><section class="mt-3 rounded-2xl bg-white p-4 shadow-md shadow-violet/5 sm:p-5">
    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
      <div class="min-w-0">
        <h2 class="flex items-center gap-2 text-lg font-extrabold sm:text-xl">
          <lucide-icon icon="key-round" size="19" icon-classes="text-violet"></lucide-icon>Passkeys
        </h2>
        <p class="mt-0.5 text-sm text-slate-500">Add a passkey to sign in without Google.</p>
      </div>
      <button
        class="inline-flex min-h-11 w-full items-center justify-center gap-2 rounded-xl bg-violet px-4 py-2 text-sm font-bold text-white sm:w-auto"
        on-click="addPasskey()"
      >
        <lucide-icon icon="plus" size="17"></lucide-icon>Add passkey
      </button>
    </div>
    <div class="mt-3 divide-y divide-slate-100">
      <template for="key of passkeys"
        ><article class="flex items-center justify-between gap-3 py-3">
          <div class="min-w-0">
            <strong class="text-sm font-semibold">{{ key.label }}</strong
            ><span class="mt-0.5 block text-xs text-slate-500">Last used {{ key.lastUsedAt || 'never' }}</span>
          </div>
          <button
            class="grid h-11 w-11 shrink-0 place-items-center rounded-xl text-rose-600 hover:bg-rose-50"
            on-click="revoke(key.credentialId)"
          >
            <lucide-icon icon="trash" size="18"></lucide-icon><span class="sr-only">Revoke passkey</span>
          </button>
        </article></template
      >
    </div>
    <a class="mt-3 inline-flex min-h-10 items-center gap-2 text-sm font-semibold text-violet" href="/pwa/"
      ><lucide-icon icon="scan-line" size="17"></lucide-icon>Open phone approval app</a
    >
    <div class="mt-5 border-t border-slate-100 pt-4">
      <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
        <div class="min-w-0">
          <h2 class="flex items-center gap-2 text-lg font-extrabold sm:text-xl">
            <lucide-icon icon="life-buoy" size="19" icon-classes="text-violet"></lucide-icon>Recovery codes
          </h2>
          <p class="mt-0.5 text-sm text-slate-500">Generate ten offline backup codes. New codes replace the old set.</p>
        </div>
        <button
          class="min-h-10 w-full rounded-xl border border-violet px-4 py-2 text-sm font-bold text-violet sm:w-auto"
          on-click="recoveryCodes()"
        >
          Generate
        </button>
      </div>
      <pre class="mt-3 whitespace-pre-wrap break-words text-sm font-bold text-violet">{{ codes }}</pre>
    </div>
  </section>
  <script setup>
    import { ref } from '@li3/web';
    import { generateRecoveryCodes, getPasskeys, registerPasskey, revokePasskey } from '/dashboard.mjs';
    export default function () {
      const passkeys = ref([]),
        codes = ref('');
      const load = async () => (passkeys.value = (await getPasskeys()).filter((key) => !key.revokedAt));
      const addPasskey = async () => {
        const label = prompt('Name this passkey', 'My device');
        if (label) {
          await registerPasskey(label);
          await load();
        }
      };
      const revoke = async (id) => {
        if (confirm('Revoke this passkey?')) {
          await revokePasskey(id);
          await load();
        }
      };
      const recoveryCodes = async () => {
        if (confirm('This invalidates any existing recovery codes. Continue?'))
          codes.value = (await generateRecoveryCodes()).join('\n');
      };
      load();
      return { passkeys, codes, addPasskey, revoke, recoveryCodes };
    }
  </script></template
>
