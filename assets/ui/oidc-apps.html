<template component="dashboard-oidc"
  ><section class="rounded-b-lg bg-white p-4 shadow-md shadow-violet/5 sm:p-5">
    <template if="admin">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <h2 class="text-xl font-extrabold tracking-heading">Applications</h2>
        <button class="rounded-xl bg-violet px-3 py-2 text-sm font-bold text-white sm:px-4" on-click="toggleForm()">
          Add app
        </button>
      </div>
      <p class="mt-2 text-sm text-slate-500">
        Confidential clients are server-side apps that can keep a client secret. Public/native clients run on phones or
        desktops and use PKCE without a secret.
      </p>
      <app-form bind-admin="admin" bind-form-open="formOpen" on-created="load()"></app-form>
      <div class="mt-3 grid gap-2">
        <template for="app of apps"
          ><article class="app-card-open relative rounded-xl border border-transparent p-3">
            <details>
              <summary class="cursor-pointer pr-20 text-sm font-bold">
                {{ app.name === app.id ? app.name : app.name + ' · ' + app.id }}
                <lucide-icon
                  attr-icon="app.isPublic ? 'smartphone' : 'monitor'"
                  size="16"
                  class="ml-1 inline-block align-text-bottom text-slate-500"
                  aria-hidden="true"
                  attr-title="app.isPublic ? 'Native app (PKCE)' : 'Browser/server app (client secret)'"
                ></lucide-icon>
                <span class="sr-only"
                  >{{ app.isPublic ? 'Native app (PKCE)' : 'Browser/server app (client secret)' }}</span
                >
              </summary>
              <div class="mt-3 flex flex-wrap items-center gap-2">
                <button
                  class="rounded-lg border border-slate-200 p-2 text-slate-500 transition hover:border-rose-200 hover:bg-rose-50 hover:text-rose-600"
                  type="button"
                  aria-label="Delete app"
                  title="Delete app"
                  on-click="deleteApp(app.id)"
                >
                  <lucide-icon icon="trash" size="16"></lucide-icon>
                </button>
                <template if="!app.isPublic"
                  ><button
                    class="rounded-lg border border-slate-200 p-2 text-slate-500 transition hover:border-violet/30 hover:bg-violet/5 hover:text-violet"
                    type="button"
                    aria-label="Regenerate secret"
                    title="Regenerate secret"
                    on-click="regenAppSecret(app.id)"
                  >
                    <lucide-icon icon="key-round" size="16"></lucide-icon></button
                ></template>
              </div>
              <app-editor bind-app="app" bind-admin="admin"></app-editor>
            </details>
            <template if="app.secret">
              <copy-value-box
                bind-token="app.secret"
                message="Copy this OIDC client secret now. It is only shown once."
              ></copy-value-box>
            </template>
          </article>
        </template>
      </div>
    </template>
  </section>
  <link rel="component" href="/ui/lucide-icon.html" />
  <script setup>
    import { ref } from '@li3/web';
    import { getOidcClients, getProfile, removeOidcClient, regenerateOidcClientSecret } from '/ui/dashboard.mjs';
    export default function () {
      const apps = ref([]),
        admin = ref(false),
        formOpen = ref(false);
      const load = async () =>
        (apps.value = (await getOidcClients()).map((app) => ({
          ...app,
          secret: '',
        })));
      const toggleForm = () => (formOpen.value = !formOpen.value);
      load();
      getProfile()
        .then((profile) => (admin.value = profile.role === 'admin'))
        .catch(() => {});
      const deleteApp = async (id) => {
        if (!confirm('Remove this OIDC application? This cannot be undone.')) return;
        try {
          await removeOidcClient(id);
          await load();
        } catch (error) {
          alert('Could not remove app: ' + error.message);
        }
      };
      const regenAppSecret = async (id) => {
        if (!confirm('Regenerate this OIDC client secret? The current secret will stop working.')) return;
        try {
          const result = await regenerateOidcClientSecret(id);
          const app = apps.value.find((item) => item.id === id);
          if (app) app.secret = result.secret;
        } catch (error) {
          alert('Could not regenerate secret: ' + error.message);
        }
      };
      return {
        apps,
        admin,
        formOpen,
        load,
        toggleForm,
        deleteApp,
        regenAppSecret,
      };
    }
  </script></template
>

<template component="app-form"
  ><template if="admin && formOpen"
    ><form class="mt-3 grid gap-3 rounded-xl bg-violet/5 p-3 sm:grid-cols-2" on-submit.prevent="createApp()">
      <input
        class="rounded-lg border border-slate-200 px-3 py-2"
        placeholder="Application name"
        bind-value="newName"
        on-input="setNewName($event.target.value)"
        maxlength="80"
        required
      />
      <label class="flex items-center gap-2 text-sm sm:col-span-2">
        <input type="checkbox" bind-checked="isPublic" on-change="setIsPublic($event.target.checked)" />
        Public/native app (mobile or desktop; no client secret)
      </label>
      <div class="grid gap-2 sm:col-span-2">
        <strong class="text-sm">Callback URLs</strong>
        <template for="uri of newCallbacks"
          ><div class="flex items-center gap-2 rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm">
            <span class="min-w-0 flex-1 break-all">{{ uri }}</span>
            <button class="text-rose-600" type="button" on-click="removeNewCallback(uri)">Remove</button>
          </div></template
        >
        <div class="flex gap-2">
          <input
            class="min-w-0 flex-1 rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm"
            placeholder="https://app.example/callback"
            bind-value="newCallbackInput"
            on-input="setNewCallbackInput($event.target.value)"
          /><button
            class="rounded-lg border border-violet px-3 py-2 text-sm font-semibold text-violet"
            type="button"
            on-click="addNewCallback()"
          >
            Add
          </button>
        </div>
      </div>
      <div class="grid gap-2 sm:col-span-2">
        <strong class="text-sm">Post-logout return URLs (optional)</strong>
        <template for="uri of newLogoutRedirects"
          ><div class="flex items-center gap-2 rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm">
            <span class="min-w-0 flex-1 break-all">{{ uri }}</span>
            <button class="text-rose-600" type="button" on-click="removeNewLogoutRedirect(uri)">Remove</button>
          </div></template
        >
        <div class="flex gap-2">
          <input
            class="min-w-0 flex-1 rounded-lg border border-slate-200 bg-white px-3 py-2"
            placeholder="https://app.example/signed-out"
            bind-value="newLogoutRedirectInput"
            on-input="setNewLogoutRedirectInput($event.target.value)"
          /><button
            class="rounded-lg border border-violet px-3 py-2 text-sm font-semibold text-violet"
            type="button"
            on-click="addNewLogoutRedirect()"
          >
            Add
          </button>
        </div>
      </div>
      <div class="grid gap-2 sm:col-span-2">
        <strong class="text-sm">Scopes</strong>
        <div class="flex flex-wrap gap-1">
          <template for="scope of newScopes"
            ><button
              class="rounded-full bg-violet/10 px-2 py-1 text-xs text-violet"
              type="button"
              on-click="removeNewScope(scope)"
            >
              {{ scope }} <span aria-hidden="true">x</span>
            </button></template
          >
        </div>
        <div class="flex gap-2">
          <input
            class="min-w-0 flex-1 rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm"
            placeholder="new:scope"
            bind-value="newScopeInput"
            on-input="setNewScopeInput($event.target.value)"
          /><button
            class="rounded-lg border border-violet px-3 py-2 text-sm font-semibold text-violet"
            type="button"
            on-click="addNewScope()"
          >
            Add
          </button>
        </div>
      </div>
      <p class="text-sm text-rose-600 sm:col-span-2">{{ formError }}</p>
      <button class="rounded-lg bg-violet px-4 py-2 font-bold text-white sm:col-span-2">Create app</button>
    </form></template
  ><template if="createdSecret"
    ><copy-value-box
      bind-token="createdSecret"
      message="Copy this new client secret now. It is only shown once."
    ></copy-value-box
  ></template>
  <script setup>
    import { defineEvent, defineProp, hook, ref } from '@li3/web';
    import { createOidcClient } from '/ui/dashboard.mjs';

    export default function () {
      const admin = defineProp('admin', { default: false }),
        formOpen = defineProp('formOpen', { default: false }),
        formError = ref(''),
        createdSecret = ref(''),
        newCallbacks = ref([]),
        newLogoutRedirects = ref([]),
        newScopes = ref([]),
        [newName, setNewName] = hook(''),
        [newCallbackInput, setNewCallbackInput] = hook(''),
        [newLogoutRedirectInput, setNewLogoutRedirectInput] = hook(''),
        [newScopeInput, setNewScopeInput] = hook(''),
        [isPublic, setIsPublic] = hook(false);
      const onCreated = defineEvent('created');
      const createApp = async () => {
        formError.value = newCallbacks.value.length ? '' : 'Add at least one secure callback URL.';
        if (formError.value) return;
        try {
          const result = await createOidcClient(
            newName.value.trim(),
            newCallbacks.value,
            newScopes.value,
            isPublic.value,
            newLogoutRedirects.value,
          );
          createdSecret.value = result.secret || '';
          formOpen.value = false;
          newCallbacks.value = [];
          newLogoutRedirects.value = [];
          newScopes.value = [];
          setIsPublic(false);
          setNewLogoutRedirectInput('');
          onCreated();
        } catch (error) {
          formError.value = error.message;
        }
      };
      const addNewCallback = () => {
        const callback = newCallbackInput.value.trim();
        if (!validCallback(callback, isPublic.value)) {
          return (formError.value = 'Use HTTPS, a loopback HTTP URL, or a custom scheme for a public app.');
        }
        newCallbacks.value = [...new Set([...newCallbacks.value, callback])];
        setNewCallbackInput('');
        formError.value = '';
      };
      const removeNewCallback = (callback) =>
        (newCallbacks.value = newCallbacks.value.filter((value) => value !== callback));
      const addNewLogoutRedirect = () => {
        const uri = newLogoutRedirectInput.value.trim();
        if (!validCallback(uri, isPublic.value)) {
          return (formError.value = 'Use HTTPS, a loopback HTTP URL, or a custom scheme for a public app.');
        }
        newLogoutRedirects.value = [...new Set([...newLogoutRedirects.value, uri])];
        setNewLogoutRedirectInput('');
        formError.value = '';
      };
      const removeNewLogoutRedirect = (uri) =>
        (newLogoutRedirects.value = newLogoutRedirects.value.filter((value) => value !== uri));
      const validCallback = (callback, publicClient) => {
        try {
          const url = new URL(callback);
          return (
            url.protocol === 'https:' ||
            (url.protocol === 'http:' && ['localhost', '127.0.0.1', '[::1]'].includes(url.hostname)) ||
            (publicClient && /^[a-z][a-z0-9+.-]*\.[a-z0-9+.-]+:$/i.test(url.protocol))
          );
        } catch {
          return false;
        }
      };
      const addNewScope = () => {
        const scope = newScopeInput.value.trim();
        if (!/^[a-zA-Z0-9:._-]{1,80}$/.test(scope)) return;
        newScopes.value = [...new Set([...newScopes.value, scope])];
        setNewScopeInput('');
      };
      const removeNewScope = (scope) => (newScopes.value = newScopes.value.filter((value) => value !== scope));
      return {
        admin,
        formOpen,
        formError,
        createdSecret,
        newName,
        setNewName,
        newCallbacks,
        newLogoutRedirects,
        newScopes,
        newCallbackInput,
        setNewCallbackInput,
        newLogoutRedirectInput,
        setNewLogoutRedirectInput,
        newScopeInput,
        setNewScopeInput,
        isPublic,
        setIsPublic,
        createApp,
        addNewCallback,
        removeNewCallback,
        addNewLogoutRedirect,
        removeNewLogoutRedirect,
        validCallback,
        addNewScope,
        removeNewScope,
      };
    }
  </script></template
>

<template component="app-editor"
  ><callback-editor bind-app="app" bind-admin="admin"></callback-editor>
  <logout-redirect-editor bind-app="app" bind-admin="admin"></logout-redirect-editor>
  <div class="mt-3 grid gap-4">
    <scope-editor bind-app="app" bind-admin="admin"></scope-editor>
  </div>
  <script setup>
    import { defineProp } from '@li3/web';
    export default function () {
      const app = defineProp('app'),
        admin = defineProp('admin', { default: false });
      return { app, admin };
    }
  </script></template
>

<template component="callback-editor"
  ><div class="mt-5 rounded-xl bg-violet/5 p-3 text-sm">
    <strong>Callback URLs</strong>
    <template for="uri of app.redirectUris"
      ><div class="mt-2 flex items-center gap-2 rounded-lg bg-white px-3 py-2">
        <span class="min-w-0 flex-1 break-all text-slate-600">{{ uri }}</span
        ><template if="admin"
          ><button class="text-rose-600" type="button" on-click="removeCallback(uri)">Remove</button></template
        >
      </div></template
    >
    <template if="admin"
      ><form class="mt-6 flex gap-2 border-t border-violet/10 pt-3" on-submit.prevent="addCallback()">
        <input
          class="min-w-0 flex-1 rounded-lg border border-slate-200 bg-white px-3 py-2"
          bind-value="callbackInput"
          on-input="setCallbackInput($event.target.value)"
          placeholder="https://app.example/callback"
          required
        /><button class="rounded-lg border border-violet px-3 py-2 font-semibold text-violet">Add</button>
      </form>
      <p class="mt-2 text-xs text-rose-600">{{ callbackError }}</p></template
    >
  </div>
  <script setup>
    import { defineProp, hook, ref } from '@li3/web';
    import { updateOidcCallbacks } from '/ui/dashboard.mjs';
    export default function () {
      const app = defineProp('app'),
        admin = defineProp('admin', { default: false }),
        callbackError = ref('');
      const [callbackInput, setCallbackInput] = hook('');
      const updateCallbacks = async (callbacks) => {
        try {
          app.value.redirectUris = (await updateOidcCallbacks(app.value.id, callbacks)).redirectUris;
          callbackError.value = '';
        } catch (error) {
          callbackError.value = error.message || 'Could not save callback URLs.';
        }
      };
      const addCallback = async () => {
        const callback = callbackInput.value.trim();
        if (!validCallback(callback, app.value.isPublic)) {
          return (callbackError.value = 'Use HTTPS, a loopback HTTP URL, or a custom scheme for a public app.');
        }
        await updateCallbacks([...app.value.redirectUris, callback]);
        if (!callbackError.value) setCallbackInput('');
      };
      const removeCallback = (callback) =>
        updateCallbacks(app.value.redirectUris.filter((value) => value !== callback));
      const validCallback = (callback, publicClient) => {
        try {
          const url = new URL(callback);
          return (
            url.protocol === 'https:' ||
            (url.protocol === 'http:' && ['localhost', '127.0.0.1', '[::1]'].includes(url.hostname)) ||
            (publicClient && /^[a-z][a-z0-9+.-]*\.[a-z0-9+.-]+:$/i.test(url.protocol))
          );
        } catch {
          return false;
        }
      };
      return { app, admin, callbackError, callbackInput, setCallbackInput, addCallback, removeCallback, validCallback };
    }
  </script></template
>

<template component="logout-redirect-editor"
  ><div class="mt-4 rounded-xl bg-violet/5 p-3 text-sm">
    <strong>Post-logout return URLs</strong>
    <template for="uri of app.postLogoutRedirectUris || []"
      ><div class="mt-2 flex items-center gap-2 rounded-lg bg-white px-3 py-2">
        <span class="min-w-0 flex-1 break-all text-slate-600">{{ uri }}</span
        ><template if="admin"
          ><button class="text-rose-600" type="button" on-click="removeRedirect(uri)">Remove</button></template
        >
      </div></template
    >
    <template if="admin"
      ><form class="mt-4 flex gap-2 border-t border-violet/10 pt-3" on-submit.prevent="addRedirect()">
        <input
          class="min-w-0 flex-1 rounded-lg border border-slate-200 bg-white px-3 py-2"
          bind-value="redirectInput"
          on-input="setRedirectInput($event.target.value)"
          placeholder="https://app.example/signed-out"
          required
        /><button class="rounded-lg border border-violet px-3 py-2 font-semibold text-violet">Add</button>
      </form>
      <p class="mt-2 text-xs text-rose-600">{{ redirectError }}</p></template
    >
  </div>
  <script setup>
    import { defineProp, hook, ref } from '@li3/web';
    import { updateOidcLogoutRedirects } from '/ui/dashboard.mjs';
    export default function () {
      const app = defineProp('app'),
        admin = defineProp('admin', { default: false }),
        redirectError = ref('');
      const [redirectInput, setRedirectInput] = hook('');
      const values = () => app.value.postLogoutRedirectUris || [];
      const save = async (uris) => {
        try {
          app.value.postLogoutRedirectUris = (
            await updateOidcLogoutRedirects(app.value.id, uris)
          ).postLogoutRedirectUris;
          redirectError.value = '';
        } catch (error) {
          redirectError.value = error.message || 'Could not save post-logout URLs.';
        }
      };
      const addRedirect = async () => {
        const uri = redirectInput.value.trim();
        if (!validCallback(uri, app.value.isPublic)) {
          return (redirectError.value = 'Use HTTPS, a loopback HTTP URL, or a custom scheme for a public app.');
        }
        await save([...new Set([...values(), uri])]);
        if (!redirectError.value) setRedirectInput('');
      };
      const removeRedirect = (uri) => save(values().filter((value) => value !== uri));
      const validCallback = (value, publicClient) => {
        try {
          const url = new URL(value);
          return (
            url.protocol === 'https:' ||
            (url.protocol === 'http:' && ['localhost', '127.0.0.1', '[::1]'].includes(url.hostname)) ||
            (publicClient && /^[a-z][a-z0-9+.-]*\.[a-z0-9+.-]+:$/i.test(url.protocol))
          );
        } catch {
          return false;
        }
      };
      return { app, admin, redirectError, redirectInput, setRedirectInput, addRedirect, removeRedirect };
    }
  </script></template
>

<template component="scope-editor"
  ><div>
    <h3 class="font-bold">Scopes</h3>
    <div class="mt-1 flex flex-wrap gap-1">
      <template for="scope of app.scopes"
        ><template if="admin"
          ><button
            class="inline-flex items-center gap-1 rounded-full bg-violet/10 px-2 py-1 text-xs text-violet"
            type="button"
            on-click="removeScope(scope)"
          >
            <span>{{ scope }}</span><span aria-hidden="true">x</span>
          </button></template
        ><template if="!admin"
          ><span class="rounded-full bg-violet/10 px-2 py-1 text-xs text-violet">{{ scope }}</span></template
        ></template
      >
    </div>
    <template if="admin"
      ><div class="mt-2 flex gap-2">
        <input
          class="min-w-0 flex-1 rounded-lg border border-slate-200 px-3 py-2 text-sm"
          placeholder="new:scope"
          bind-value="scopeInput"
          on-input="setScopeInput($event.target.value)"
        />
        <button
          class="rounded-lg bg-violet px-3 py-2 text-sm font-semibold text-white"
          type="button"
          on-click="addScope($event)"
        >
          Add
        </button>
      </div></template
    >
  </div>
  <script setup>
    import { defineProp, hook } from '@li3/web';
    import { addOidcScopes, updateOidcScopes } from '/ui/dashboard.mjs';
    export default function () {
      const app = defineProp('app'),
        admin = defineProp('admin', { default: false }),
        [scopeInput, setScopeInput] = hook('');
      const addScope = async (event) => {
        const scope = scopeInput.value.trim();
        if (!scope) return;
        const result = await addOidcScopes(app.value.id, [scope]);
        app.value.scopes = result.scopes;
        setScopeInput('');
      };
      const removeScope = async (scope) => {
        if (!confirm(`Remove ${scope}? Existing tokens will lose this scope.`)) return;
        const result = await updateOidcScopes(
          app.value.id,
          app.value.scopes.filter((value) => value !== scope),
        );
        app.value.scopes = result.scopes;
      };
      return { app, admin, scopeInput, setScopeInput, addScope, removeScope };
    }
  </script></template
>
