<template component="dashboard-oidc">
  <section class="mt-5 rounded-3xl bg-white p-6 shadow-xl shadow-violet/5">
    <div class="flex items-center justify-between gap-4">
      <h2 class="text-xl font-extrabold tracking-[-.03em]">Applications</h2>
      <template if="admin"><button class="rounded-xl bg-violet px-4 py-2 font-bold text-white" on-click="toggleForm()">Add app</button></template>
    </div>
    <template if="formOpen">
      <form class="mt-5 grid gap-3 rounded-2xl bg-violet/5 p-4" on-submit.prevent="createApp()">
        <input ref="newId" class="rounded-xl border border-slate-200 px-3 py-2" placeholder="App ID, e.g. registry.snippets.run" on-input="fieldChanged()" required />
        <textarea ref="newCallback" class="min-h-20 rounded-xl border border-slate-200 px-3 py-2" placeholder="One HTTPS callback URL per line" on-input="fieldChanged()" required></textarea>
        <label class="text-sm font-semibold text-slate-600">Scopes</label>
        <div class="grid grid-cols-2 gap-2 sm:grid-cols-4">
          <label><input type="checkbox" value="openid" on-change="toggleScope($event)" /> openid</label>
          <label><input type="checkbox" value="profile" on-change="toggleScope($event)" /> profile</label>
          <label><input type="checkbox" value="email" on-change="toggleScope($event)" /> email</label>
          <label><input type="checkbox" value="read" on-change="toggleScope($event)" /> read</label>
        </div>
        <input ref="customScope" class="rounded-xl border border-slate-200 px-3 py-2" placeholder="Additional scope" on-input="fieldChanged()" />
        <p class="text-sm text-rose-600">{{ formError }}</p>
        <div class="flex gap-2"><button class="rounded-xl bg-violet px-4 py-2 font-bold text-white" type="submit">Create app</button><button class="rounded-xl border border-slate-200 px-4 py-2 font-semibold" type="button" on-click="toggleForm()">Cancel</button></div>
      </form>
    </template>
    <template if="createdSecret"><div class="mt-4 rounded-2xl border border-emerald-300 bg-emerald-50 p-4 font-mono text-sm font-semibold text-emerald-900">{{ createdSecret }}<span class="mt-2 block font-sans font-normal">Copy this secret now; it will not be shown again.</span></div></template>
    <p class="mt-3 text-slate-500">Expand an app to manage scopes and API tokens.</p>
    <div class="mt-5 grid gap-3"><template for="app of apps"><details class="rounded-2xl border border-slate-200 p-4" on-toggle="open(app, $event)"><summary class="cursor-pointer font-bold">{{ app.id }}</summary><div class="mt-4 grid gap-5"><section><h3 class="font-bold">Scopes</h3><ul class="mt-2 grid gap-1 text-sm text-slate-600"><template for="scope of app.scopes"><li>{{ scope }}</li></template></ul><template if="admin"><div class="mt-3 flex gap-2"><input ref="scopeInput" class="min-w-0 flex-1 rounded-xl border border-slate-200 px-3 py-2" placeholder="new:scope" on-input="fieldChanged()" /><button class="rounded-xl bg-violet px-3 py-2 font-semibold text-white" on-click="addScope(app)">Add scope</button></div></template></section><section><div class="flex items-center justify-between"><h3 class="font-bold">Tokens</h3><button class="rounded-xl border border-violet px-3 py-2 text-sm font-semibold text-violet" on-click="showTokenForm(app)">Add token</button></div><template if="selected === app.id"><form class="mt-3 grid gap-2 rounded-xl bg-violet/5 p-3" on-submit.prevent="createToken(app)"><input ref="tokenLabel" class="rounded-xl border border-slate-200 px-3 py-2" placeholder="Token label" on-input="fieldChanged()" required /><input ref="tokenScopes" class="rounded-xl border border-slate-200 px-3 py-2" placeholder="Scopes, space separated" on-input="fieldChanged()" required /><button class="rounded-xl bg-violet px-3 py-2 font-semibold text-white">Generate</button></form><template for="token of tokens"><article class="mt-3 rounded-xl border border-slate-100 p-3"><div class="flex items-start justify-between gap-3"><div><strong>{{ token.label }}</strong><p class="text-sm text-slate-500">Created {{ token.createdAt }}</p><p class="text-sm text-slate-500">Scopes: {{ token.scopes.join(', ') }}</p></div><button class="text-sm font-semibold text-rose-600" on-click="revokeToken(app, token)">Revoke</button></div></article></template></template></section></div></details></template></div>
  </section>
  <script setup>
    import { ref, templateRef } from '@li3/web';
    import { addOidcScopes, createApiToken, createOidcClient, getApiTokens, getTokenApps, revokeApiToken } from '@apphor/dashboard.mjs';
    export default function () {
      const apps = ref([]), selected = ref(''), tokens = ref([]), admin = ref(false), formOpen = ref(false), formError = ref(''), createdSecret = ref('');
      const newId = templateRef('newId'), newCallback = templateRef('newCallback'), customScope = templateRef('customScope'), scopeInput = templateRef('scopeInput'), tokenLabel = templateRef('tokenLabel'), tokenScopes = templateRef('tokenScopes'), checkedScopes = ref([]);
      const load = async () => apps.value = await getTokenApps();
      const open = async (app, event) => { if (event.target.open) { selected.value = app.id; tokens.value = await getApiTokens(app.id); } };
      const toggleForm = () => { formOpen.value = !formOpen.value; formError.value = ''; };
      const fieldChanged = () => {};
      const toggleScope = (event) => { const value = event.target.value; checkedScopes.value = event.target.checked ? [...checkedScopes.value, value] : checkedScopes.value.filter((scope) => scope !== value); };
      const createApp = async () => { const id = newId.value.value.trim(), callbacks = newCallback.value.value.split('\n').map((value) => value.trim()).filter(Boolean), custom = customScope.value.value.trim(); formError.value = !/^[a-zA-Z0-9._-]{1,80}$/.test(id) ? 'Use a valid app ID.' : callbacks.some((value) => !value.startsWith('https://')) ? 'Callbacks must use HTTPS.' : !checkedScopes.value.length && !custom ? 'Select or enter at least one scope.' : ''; if (formError.value) return; try { const result = await createOidcClient(id, callbacks, [...checkedScopes.value, ...(custom ? [custom] : [])]); createdSecret.value = `Secret for ${result.id}: ${result.secret}`; formOpen.value = false; await load(); } catch (error) { formError.value = error.message; } };
      const addScope = async (app) => { const value = scopeInput.value?.value.trim(); if (!value) return; const result = await addOidcScopes(app.id, [value]); app.scopes = result.scopes; scopeInput.value.value = ''; };
      const showTokenForm = (app) => selected.value = app.id;
      const createToken = async (app) => { await createApiToken(app.id, tokenLabel.value.value.trim(), tokenScopes.value.value.split(/\s+/).filter(Boolean)); tokenLabel.value.value = ''; tokenScopes.value.value = ''; tokens.value = await getApiTokens(app.id); };
      const revokeToken = async (app, token) => { if (confirm('Revoke this token?')) { await revokeApiToken(app.id, token.label); tokens.value = await getApiTokens(app.id); } };
      load(); fetch('/oidc/access', { credentials: 'include' }).then((response) => response.ok ? response.json() : null).then((value) => admin.value = Boolean(value?.admin));
      return { apps, selected, tokens, admin, formOpen, formError, createdSecret, newId, newCallback, customScope, scopeInput, tokenLabel, tokenScopes, open, toggleForm, fieldChanged, toggleScope, createApp, addScope, showTokenForm, createToken, revokeToken };
    }
  </script>
</template>
