<template component="dashboard-oidc"><section class="mt-5 rounded-3xl bg-white p-6 shadow-xl shadow-violet/5"><h2 class="text-xl font-extrabold tracking-[-.03em]">Applications</h2><p class="mt-1 text-slate-500">Expand an app to manage its scopes and API tokens.</p><div class="mt-5 grid gap-3"><template for="app of apps"><details class="rounded-2xl border border-slate-200 p-4" on-toggle="open(app,$event)"><summary class="cursor-pointer font-bold">{{ app.id }}</summary><div class="mt-4 grid gap-5"><section><h3 class="font-bold">Scopes</h3><ul class="mt-2 grid gap-1 text-sm text-slate-600"><template for="scope of app.scopes"><li>{{ scope }}</li></template></ul><template if="admin"><div class="mt-3 flex gap-2"><input ref="scopeInput" class="min-w-0 flex-1 rounded-xl border border-slate-200 px-3 py-2" placeholder="new:scope"><button class="rounded-xl bg-violet px-3 py-2 font-semibold text-white" on-click="addScope(app)">Add scope</button></div></template></section><section><div class="flex items-center justify-between"><h3 class="font-bold">Tokens</h3><button class="rounded-xl border border-violet px-3 py-2 text-sm font-semibold text-violet" on-click="showTokenForm(app)">Add token</button></div><template if="selected === app.id"><form class="mt-3 grid gap-2 rounded-xl bg-violet/5 p-3" on-submit.prevent="createToken(app)"><input ref="tokenLabel" class="rounded-xl border border-slate-200 px-3 py-2" placeholder="Token label" required><input ref="tokenScopes" class="rounded-xl border border-slate-200 px-3 py-2" placeholder="Scopes, space separated" required><button class="rounded-xl bg-violet px-3 py-2 font-semibold text-white">Generate</button></form><template for="token of tokens"><article class="mt-3 rounded-xl border border-slate-100 p-3"><div class="flex items-start justify-between gap-3"><div><strong>{{ token.label }}</strong><p class="text-sm text-slate-500">Created {{ token.createdAt }}</p><p class="text-sm text-slate-500">Scopes: {{ token.scopes.join(', ') }}</p></div><button class="text-sm font-semibold text-rose-600" on-click="revokeToken(app,token)">Revoke</button></div></article></template></template></section></div></details></template></div></section><script setup>import { ref,templateRef } from '@li3/web';import { createApiToken,getApiTokens,getTokenApps,addOidcScopes,revokeApiToken } from '@apphor/dashboard.mjs';export default function(){const apps=ref([]),selected=ref(''),tokens=ref([]),admin=ref(false),scopeInput=templateRef('scopeInput'),tokenLabel=templateRef('tokenLabel'),tokenScopes=templateRef('tokenScopes');const open=async(app,event)=>{if(event.target.open){selected.value=app.id;tokens.value=await getApiTokens(app.id)}};const addScope=async(app)=>{const value=scopeInput.value?.value.trim();if(!value)return;const result=await addOidcScopes(app.id,[value]);app.scopes=result.scopes;scopeInput.value.value=''};const showTokenForm=(app)=>{selected.value=app.id};const createToken=async(app)=>{await createApiToken(app.id,tokenLabel.value.value.trim(),tokenScopes.value.value.split(/\s+/).filter(Boolean));tokenLabel.value.value='';tokenScopes.value.value='';tokens.value=await getApiTokens(app.id)};const revokeToken=async(app,token)=>{if(confirm('Revoke this token?')){await revokeApiToken(app.id,token.label);tokens.value=await getApiTokens(app.id)}};getTokenApps().then((value)=>apps.value=value);fetch('/oidc/access',{credentials:'include'}).then((response)=>response.ok?response.json():null).then((value)=>admin.value=Boolean(value?.admin));return{apps,selected,tokens,admin,scopeInput,tokenLabel,tokenScopes,open,addScope,showTokenForm,createToken,revokeToken}}</script></template>
