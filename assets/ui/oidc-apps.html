<template component="dashboard-oidc"><section class="mt-5 rounded-3xl bg-white p-6 shadow-xl shadow-violet/5"><h2 class="text-xl font-extrabold tracking-[-.03em]">OIDC applications</h2><p class="mt-1 text-slate-500">Register trusted applications. Secrets are shown once.</p><form class="mt-5 grid gap-3 rounded-2xl bg-violet/5 p-4" on-submit.prevent="add()"><input ref="id" class="rounded-xl border border-slate-200 px-3 py-2" placeholder="Client ID, e.g. registry" required><textarea ref="uris" class="min-h-24 rounded-xl border border-slate-200 px-3 py-2" placeholder="One exact HTTPS callback URL per line" required></textarea><button class="rounded-xl bg-violet px-4 py-3 font-bold text-white" type="submit">Register application</button></form><div class="mt-4 flex items-center gap-3 rounded-2xl border border-emerald-300 bg-emerald-50 p-4 text-sm font-semibold text-emerald-900"><lucide-icon icon="key-round" size="18"></lucide-icon><code class="min-w-0 flex-1 break-all">{{ secret }}</code><button class="grid h-10 w-10 shrink-0 place-items-center rounded-xl text-emerald-800 hover:bg-emerald-100" on-click="copy()"><lucide-icon icon="copy" size="18"></lucide-icon><span class="sr-only">Copy client secret</span></button></div><div class="mt-5 divide-y divide-slate-100"><template for="client of clients"><article class="flex items-start justify-between gap-4 py-4"><div><strong>{{ client.id }}</strong><template for="uri of client.redirectUris"><span class="mt-1 block break-all text-sm text-slate-500">{{ uri }}</span></template></div><button class="font-semibold text-rose-600" on-click="remove(client.id)">Remove</button></article></template></div></section><script setup>import { ref,templateRef } from '@li3/web';import { createOidcClient,getOidcClients,removeOidcClient } from '/dashboard.mjs';export default function(){const clients=ref([]),secret=ref(''),id=templateRef('id'),uris=templateRef('uris');const load=async()=>clients.value=await getOidcClients();const add=async()=>{const result=await createOidcClient(id.value.value.trim(),uris.value.value.split('\n').map((value)=>value.trim()).filter(Boolean));secret.value=`Secret for ${result.id} (copy now): ${result.secret}`;id.value.value='';uris.value.value='';await load()};const copy=()=>navigator.clipboard.writeText(secret.value.replace(/^.*?: /,''));const remove=async(value)=>{if(confirm('Remove this OIDC client? Existing sessions will stop working.')){await removeOidcClient(value);await load()}};load();return{clients,secret,id,uris,add,copy,remove}}</script></template>
