<template component="dashboard-oidc"><section class="mt-5 rounded-3xl bg-white p-6 shadow-xl shadow-violet/5"><h2 class="text-xl font-extrabold tracking-[-.03em]">Applications</h2><p class="mt-1 text-slate-500">Select an app to manage scopes and API tokens.</p><select ref="app" class="mt-5 w-full rounded-xl border border-slate-200 px-3 py-2" on-change="select()"><option value="">Choose an app</option><template for="item of apps"><option attr-value="item.id">{{ item.id }}</option></template></select><template if="selected"><nav class="mt-4 flex gap-1 rounded-xl bg-violet/5 p-1"><button class="flex-1 rounded-lg px-3 py-2 text-sm font-semibold" class-active="tab === 'overview'" on-click="tab.value='overview'">Overview</button><button class="flex-1 rounded-lg px-3 py-2 text-sm font-semibold" class-active="tab === 'scopes'" on-click="tab.value='scopes'">Scopes</button><button class="flex-1 rounded-lg px-3 py-2 text-sm font-semibold" class-active="tab === 'tokens'" on-click="tab.value='tokens'">Tokens</button></nav><section class="mt-5" if="tab === 'overview'"><h3 class="font-bold">{{ selected }}</h3><p class="mt-2 text-sm text-slate-500">Scopes: {{ scopes.join(', ') }}</p></section><section class="mt-5" if="tab === 'scopes'"><h3 class="font-bold">Allowed scopes</h3><p class="mt-2 text-sm text-slate-500">Existing scopes cannot be removed.</p><p class="mt-2">{{ scopes.join(', ') }}</p><template if="admin"><div class="mt-4 flex gap-2"><input ref="newScope" class="min-w-0 flex-1 rounded-xl border border-slate-200 px-3 py-2" placeholder="new:scope"><button class="rounded-xl bg-violet px-3 py-2 font-semibold text-white" on-click="addScope()">Add</button></div></template></section><section class="mt-5" if="tab === 'tokens'"><form class="grid gap-3 rounded-2xl bg-violet/5 p-4" on-submit.prevent="createToken()"><input ref="label" class="rounded-xl border border-slate-200 px-3 py-2" placeholder="Token label" required><input ref="tokenScopes" class="rounded-xl border border-slate-200 px-3 py-2" placeholder="Scopes, space separated" required><button class="rounded-xl bg-violet px-4 py-3 font-bold text-white">Generate token</button></form><template if="created"><div class="mt-4 break-all rounded-2xl border border-emerald-300 bg-emerald-50 p-4 font-mono text-sm font-semibold text-emerald-900">{{ created }}<span class="mt-2 block font-sans font-normal">Copy this token now. It will not be shown again.</span></div></template><div class="mt-5 divide-y divide-slate-100"><template for="token of tokens"><article class="flex items-start justify-between gap-4 py-4"><div><strong>{{ token.label }}</strong><p class="text-sm text-slate-500">{{ token.scopes.join(', ') }} · expires {{ token.expiresAt }}</p></div><span class="text-sm text-slate-400">{{ token.revokedAt ? 'revoked' : 'active' }}</span></article></template></div></section></template><script setup>import { ref,templateRef } from '@li3/web';import { addOidcScopes,createApiToken,getApiTokens,getTokenApps } from '/dashboard.mjs';export default function(){const apps=ref([]),selected=ref(''),scopes=ref([]),tokens=ref([]),tab=ref('overview'),created=ref(''),admin=ref(false),app=templateRef('app'),newScope=templateRef('newScope'),label=templateRef('label'),tokenScopes=templateRef('tokenScopes');const select=async()=>{selected.value=app.value.value;const item=apps.value.find((value)=>value.id===selected.value);scopes.value=item?.scopes||[];tokens.value=selected.value?await getApiTokens(selected.value):[]};const addScope=async()=>{const value=newScope.value.value.trim();if(!value)return;const result=await addOidcScopes(selected.value,[value]);scopes.value=result.scopes;newScope.value.value=''};const createToken=async()=>{const result=await createApiToken(selected.value,label.value.value.trim(),tokenScopes.value.value.split(/\s+/).filter(Boolean));created.value=result.token;label.value.value='';tokenScopes.value.value='';tokens.value=await getApiTokens(selected.value)};getTokenApps().then((value)=>apps.value=value);fetch('/oidc/access',{credentials:'include'}).then((response)=>response.ok?response.json():null).then((value)=>admin.value=Boolean(value?.admin));return{apps,selected,scopes,tokens,tab,created,admin,app,newScope,label,tokenScopes,select,addScope,createToken}}</script></template>
