<template component="dashboard-oidc"
  ><section class="mt-3 rounded-2xl bg-white p-3 shadow-xl shadow-violet/5 sm:p-4">
    <div class="flex flex-wrap items-center justify-between gap-2">
      <h2 class="text-xl font-extrabold tracking-[-.03em]">Applications</h2>
      <template if="admin"
        ><button class="rounded-xl bg-violet px-3 py-2 text-sm font-bold text-white sm:px-4" on-click="toggleForm()">
          Add app
        </button></template
      >
    </div>
    <template if="formOpen"
      ><form class="mt-3 grid gap-3 rounded-xl bg-violet/5 p-3 sm:grid-cols-2" on-submit.prevent="createApp()">
        <input
          class="rounded-lg border border-slate-200 px-3 py-2"
          placeholder="App ID"
          bind-value="newId"
          on-input="setNewId($event.target.value)"
          required
        />
        <div class="grid gap-2 sm:col-span-2">
          <strong class="text-sm">Callback URLs</strong>
          <template for="uri of newCallbacks"
            ><div class="flex items-center gap-2 rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm">
              <span class="min-w-0 flex-1 break-all">{{ uri }}</span>
              <button class="text-rose-600" type="button" on-click="removeNewCallback(uri)">Remove</button>
            </div></template
          >
          <div class="flex gap-2">
            <input
              class="min-w-0 flex-1 rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm"
              placeholder="https://app.example/callback"
              bind-value="newCallbackInput"
              on-input="setNewCallbackInput($event.target.value)"
            /><button
              class="rounded-lg border border-violet px-3 py-2 text-sm font-semibold text-violet"
              type="button"
              on-click="addNewCallback()"
            >
              Add
            </button>
          </div>
        </div>
        <div class="grid gap-2 sm:col-span-2">
          <strong class="text-sm">Scopes</strong>
          <div class="flex flex-wrap gap-1">
            <template for="scope of newScopes"
              ><button
                class="rounded-full bg-violet/10 px-2 py-1 text-xs text-violet"
                type="button"
                on-click="removeNewScope(scope)"
              >
                {{ scope }} <span aria-hidden="true">x</span>
              </button></template
            >
          </div>
          <div class="flex gap-2">
            <input
              class="min-w-0 flex-1 rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm"
              placeholder="new:scope"
              bind-value="newScopeInput"
              on-input="setNewScopeInput($event.target.value)"
            /><button
              class="rounded-lg border border-violet px-3 py-2 text-sm font-semibold text-violet"
              type="button"
              on-click="addNewScope()"
            >
              Add
            </button>
          </div>
        </div>
        <p class="text-sm text-rose-600 sm:col-span-2">{{ formError }}</p>
        <button class="rounded-lg bg-violet px-4 py-2 font-bold text-white sm:col-span-2">Create app</button>
      </form></template
    ><template if="createdSecret"
      ><div class="mt-3 rounded-2xl border border-emerald-300 bg-emerald-50 p-3 text-emerald-900">
        <div class="break-all font-mono text-sm font-semibold">{{ createdSecret }}</div>
        <button
          class="mt-2 text-sm font-semibold text-emerald-800 underline"
          type="button"
          on-click="copyCreatedSecret()"
        >
          Copy secret
        </button>
      </div></template
    >
    <div class="mt-3 grid gap-2">
      <template for="app of apps"
        ><details class="rounded-xl border border-slate-200 p-3" on-toggle="open(app,$event)">
          <summary class="cursor-pointer text-sm font-bold">{{ app.id }}</summary>
          <div class="mt-2 rounded-xl bg-violet/5 p-3 text-sm">
            <strong>Callback URLs</strong>
            <template for="uri of app.redirectUris"
              ><div class="mt-2 flex items-center gap-2 rounded-lg bg-white px-3 py-2">
                <span class="min-w-0 flex-1 break-all text-slate-600">{{ uri }}</span>
                <template if="admin"
                  ><button class="text-rose-600" type="button" on-click="removeCallback(app,uri)">
                    Remove
                  </button></template
                >
              </div></template
            ><template if="admin"
              ><form class="mt-3 flex gap-2 border-t border-violet/10 pt-3" on-submit.prevent="addCallback(app,$event)">
                <input
                  class="min-w-0 flex-1 rounded-lg border border-slate-200 bg-white px-3 py-2"
                  name="callback"
                  placeholder="https://app.example/callback"
                  required
                /><button class="rounded-lg border border-violet px-3 py-2 font-semibold text-violet">Add</button>
              </form>
              <p class="mt-2 text-xs text-rose-600">{{ callbackError }}</p></template
            >
          </div>
          <div class="mt-3 grid gap-4 lg:grid-cols-2">
            <div>
              <h3 class="font-bold">Scopes</h3>
              <div class="mt-1 flex flex-wrap gap-1">
                <template for="scope of app.scopes"
                  ><span class="rounded-full bg-violet/10 px-2 py-1 text-xs text-violet">{{ scope }}</span></template
                >
              </div>
              <template if="admin"
                ><div class="mt-2 flex gap-2">
                  <input
                    class="min-w-0 flex-1 rounded-lg border border-slate-200 px-3 py-2 text-sm"
                    placeholder="new:scope"
                  />
                  <button
                    class="rounded-lg bg-violet px-3 py-2 text-sm font-semibold text-white"
                    type="button"
                    on-click="addScope(app,$event)"
                  >
                    Add
                  </button>
                </div></template
              >
            </div>
            <div>
              <div class="flex items-center justify-between gap-2">
                <h3 class="font-bold">Tokens</h3>
                <button
                  class="rounded-lg border border-violet px-2.5 py-1 text-xs font-semibold text-violet"
                  type="button"
                  on-click="showTokenForm(app)"
                >
                  Add token
                </button>
              </div>
              <template if="selected === app.id"
                ><form class="mt-2 grid gap-2 rounded-lg bg-violet/5 p-2" on-submit.prevent="createToken(app)">
                  <input
                    class="rounded-lg border border-slate-200 px-3 py-2 text-sm"
                    bind-value="tokenLabel"
                    on-input="setTokenLabel($event.target.value)"
                    placeholder="Token label"
                    required
                  /><input
                    class="rounded-lg border border-slate-200 px-3 py-2 text-sm"
                    bind-value="tokenScopes"
                    on-input="setTokenScopes($event.target.value)"
                    placeholder="Scopes"
                    required
                  /><button class="rounded-lg bg-violet px-3 py-2 text-sm font-semibold text-white">Generate</button>
                </form>
                <template for="token of tokens"
                  ><article class="mt-2 rounded-lg border border-slate-100 p-2 text-sm">
                    <strong>{{ token.label }}</strong>
                    <p class="text-slate-600">Created {{ token.createdAt }}</p>
                    <p class="break-words text-slate-600">Scopes: {{ token.scopes.join(', ') }}</p>
                    <button class="mt-1 text-rose-600" type="button" on-click="revokeToken(app,token)">Revoke</button>
                  </article></template
                ></template
              >
            </div>
          </div>
        </details></template
      >
    </div>
  </section>
  <script setup>
    import { hook, ref } from '@li3/web';
    import {
      addOidcScopes,
      createApiToken,
      createOidcClient,
      getApiTokens,
      getProfile,
      getTokenApps,
      revokeApiToken,
      updateOidcCallbacks,
    } from '/dashboard.mjs';
    export default function () {
      const apps = ref([]),
        selected = ref(''),
        tokens = ref([]),
        admin = ref(false),
        formOpen = ref(false),
        formError = ref(''),
        createdSecret = ref(''),
        [newId, setNewId] = hook(''),
        newCallbacks = ref([]),
        newScopes = ref([]),
        [newCallbackInput, setNewCallbackInput] = hook(''),
        [newScopeInput, setNewScopeInput] = hook(''),
        [tokenLabel, setTokenLabel] = hook(''),
        [tokenScopes, setTokenScopes] = hook(''),
        callbackError = ref('');
      const load = async () => (apps.value = await getTokenApps());
      const open = async (app, event) => {
        if (event.target.open) {
          selected.value = app.id;
          tokens.value = await getApiTokens(app.id);
        }
      };
      const toggleForm = () => (formOpen.value = !formOpen.value);
      const createApp = async () => {
        formError.value = newCallbacks.value.length ? '' : 'Add at least one HTTPS callback URL.';
        if (formError.value) return;
        try {
          const result = await createOidcClient(newId.value.trim(), newCallbacks.value, newScopes.value);
          createdSecret.value = `Secret for ${result.id}: ${result.secret}`;
          formOpen.value = false;
          newCallbacks.value = [];
          newScopes.value = [];
          await load();
        } catch (error) {
          formError.value = error.message;
        }
      };
      const addNewCallback = () => {
        const callback = newCallbackInput.value.trim();
        if (!callback.startsWith('https://')) return (formError.value = 'Callbacks must use HTTPS.');
        newCallbacks.value = [...new Set([...newCallbacks.value, callback])];
        setNewCallbackInput('');
        formError.value = '';
      };
      const removeNewCallback = (callback) => {
        newCallbacks.value = newCallbacks.value.filter((value) => value !== callback);
      };
      const addNewScope = () => {
        const scope = newScopeInput.value.trim();
        if (!/^[a-zA-Z0-9:._-]{1,80}$/.test(scope)) return;
        newScopes.value = [...new Set([...newScopes.value, scope])];
        setNewScopeInput('');
      };
      const removeNewScope = (scope) => {
        newScopes.value = newScopes.value.filter((value) => value !== scope);
      };
      const updateCallbacks = async (app, callbacks) => {
        try {
          const result = await updateOidcCallbacks(app.id, callbacks);
          app.redirectUris = result.redirectUris;
          callbackError.value = '';
        } catch (error) {
          callbackError.value = error.message || 'Could not save callback URLs.';
        }
      };
      const addCallback = async (app, event) => {
        const callback = event.currentTarget.elements.callback.value.trim();
        if (!callback.startsWith('https://')) return (callbackError.value = 'Callbacks must use HTTPS.');
        await updateCallbacks(app, [...app.redirectUris, callback]);
        if (!callbackError.value) event.currentTarget.reset();
      };
      const removeCallback = async (app, callback) => {
        await updateCallbacks(
          app,
          app.redirectUris.filter((value) => value !== callback),
        );
      };
      const addScope = async (app, event) => {
        const scope = event.currentTarget.previousElementSibling.value.trim();
        if (!scope) return;
        const result = await addOidcScopes(app.id, [scope]);
        app.scopes = result.scopes;
        event.currentTarget.previousElementSibling.value = '';
      };
      const copyCreatedSecret = () => navigator.clipboard.writeText(createdSecret.value.replace(/^.*?: /, ''));
      const showTokenForm = (app) => (selected.value = app.id);
      const createToken = async (app) => {
        await createApiToken(app.id, tokenLabel.value, tokenScopes.value.split(/[\s,]+/).filter(Boolean));
        setTokenLabel('');
        setTokenScopes('');
        tokens.value = await getApiTokens(app.id);
      };
      const revokeToken = async (app, token) => {
        if (confirm('Revoke this token?')) {
          await revokeApiToken(app.id, token.label);
          tokens.value = await getApiTokens(app.id);
        }
      };
      load();
      getProfile()
        .then((profile) => (admin.value = profile.role === 'admin'))
        .catch(() => {});
      return {
        apps,
        selected,
        tokens,
        admin,
        formOpen,
        formError,
        createdSecret,
        newId,
        setNewId,
        newCallbacks,
        newScopes,
        newCallbackInput,
        setNewCallbackInput,
        newScopeInput,
        setNewScopeInput,
        tokenLabel,
        setTokenLabel,
        tokenScopes,
        setTokenScopes,
        callbackError,
        open,
        toggleForm,
        createApp,
        addNewCallback,
        removeNewCallback,
        addNewScope,
        removeNewScope,
        addCallback,
        removeCallback,
        addScope,
        copyCreatedSecret,
        showTokenForm,
        createToken,
        revokeToken,
      };
    }
  </script></template
>
