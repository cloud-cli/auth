<template component="dashboard-oidc"
  ><section class="mt-3 rounded-2xl bg-white p-4 shadow-xl shadow-violet/5">
    <div class="flex items-center justify-between gap-4">
      <h2 class="text-xl font-extrabold tracking-[-.03em]">Applications</h2>
      <template if="admin"
        ><button class="rounded-xl bg-violet px-4 py-2 font-bold text-white" on-click="toggleForm()">
          Add app
        </button></template
      >
    </div>
    <template if="formOpen"
      ><form class="mt-3 grid gap-2 rounded-2xl bg-violet/5 p-3" on-submit.prevent="createApp()">
        <input
          class="rounded-xl border border-slate-200 px-3 py-2"
          placeholder="App ID"
          bind-value="newId"
          on-input="setNewId($event.target.value)"
          required
        /><textarea
          class="min-h-20 rounded-xl border border-slate-200 px-3 py-2"
          placeholder="One HTTPS callback URL per line"
          bind-value="newCallback"
          on-input="setNewCallback($event.target.value)"
          required
        ></textarea
        ><input
          class="rounded-xl border border-slate-200 px-3 py-2"
          placeholder="API scopes, one per line or separated by spaces"
          bind-value="newApiScopes"
          on-input="setNewApiScopes($event.target.value)"
        />
        <p class="text-sm text-rose-600">{{ formError }}</p>
        <button class="rounded-xl bg-violet px-4 py-2 font-bold text-white">Create app</button>
      </form></template
    ><template if="createdSecret"
      ><div
        class="mt-3 break-all rounded-2xl border border-emerald-300 bg-emerald-50 p-3 font-mono text-sm font-semibold text-emerald-900"
      >
        {{ createdSecret }}
      </div></template
    >
    <div class="mt-3 grid gap-2">
      <template for="app of apps"
        ><details class="rounded-xl border border-slate-200 p-3" on-toggle="open(app,$event)">
          <summary class="cursor-pointer font-bold">{{ app.id }}</summary>
          <div class="mt-2 rounded-xl bg-violet/5 p-3 text-sm">
            <strong>Callback URLs</strong
            ><template for="uri of app.redirectUris"
              ><span class="mt-1 block break-all text-slate-600">{{ uri }}</span></template
            ><template if="admin"
              ><button
                class="mt-2 rounded-lg border border-violet px-3 py-1 font-semibold text-violet"
                on-click="beginEdit(app)"
              >
                Edit callbacks
              </button></template
            >
          </div>
          <div class="mt-3">
            <h3 class="font-bold">Scopes</h3>
            <div class="flex flex-wrap gap-1">
              <template for="scope of app.scopes"
                ><span class="rounded-full bg-violet/10 px-2 py-1 text-sm text-violet">{{ scope }}</span></template
              >
            </div>
            <template if="admin"
              ><div class="mt-2 flex gap-2">
                <input
                  class="min-w-0 flex-1 rounded-xl border border-slate-200 px-3 py-2"
                  bind-value="scopeInput"
                  on-input="setScopeInput($event.target.value)"
                  placeholder="new:scope"
                /><button
                  class="rounded-xl bg-violet px-3 py-2 text-sm font-semibold text-white"
                  on-click="addScope(app)"
                >
                  Add
                </button>
              </div></template
            >
          </div>
          <div class="mt-4">
            <div class="flex items-center justify-between">
              <h3 class="font-bold">Tokens</h3>
              <button
                class="rounded-xl border border-violet px-3 py-2 text-sm font-semibold text-violet"
                on-click="showTokenForm(app)"
              >
                Add token
              </button>
            </div>
            <template if="selected === app.id"
              ><form class="mt-2 grid gap-2 bg-violet/5 p-3" on-submit.prevent="createToken(app)">
                <input
                  class="rounded-xl border border-slate-200 px-3 py-2"
                  bind-value="tokenLabel"
                  on-input="setTokenLabel($event.target.value)"
                  placeholder="Token label"
                  required
                /><input
                  class="rounded-xl border border-slate-200 px-3 py-2"
                  bind-value="tokenScopes"
                  on-input="setTokenScopes($event.target.value)"
                  placeholder="Scopes"
                  required
                /><button class="rounded-xl bg-violet px-3 py-2 font-semibold text-white">Generate</button>
              </form>
              <template for="token of tokens"
                ><article class="mt-2 rounded-xl border border-slate-100 p-3 text-sm">
                  <strong>{{ token.label }}</strong>
                  <p>Created {{ token.createdAt }}</p>
                  <p>Scopes: {{ token.scopes.join(', ') }}</p>
                  <button class="text-rose-600" on-click="revokeToken(app,token)">Revoke</button>
                </article></template
              ></template
            >
          </div>
        </details></template
      >
    </div>
  </section>
  <script setup>
    import { hook, ref } from '@li3/web';
    import {
      addOidcScopes,
      createApiToken,
      createOidcClient,
      getApiTokens,
      getTokenApps,
      revokeApiToken,
      updateOidcCallbacks,
    } from '/dashboard.mjs';
    export default function () {
      const apps = ref([]),
        selected = ref(''),
        tokens = ref([]),
        admin = ref(false),
        formOpen = ref(false),
        formError = ref(''),
        createdSecret = ref(''),
        [newId, setNewId] = hook(''),
        [newCallback, setNewCallback] = hook(''),
        [newApiScopes, setNewApiScopes] = hook(''),
        [scopeInput, setScopeInput] = hook(''),
        [tokenLabel, setTokenLabel] = hook(''),
        [tokenScopes, setTokenScopes] = hook(''),
        [editingApp, setEditingApp] = hook(null),
        [editingCallbackText, setEditingCallbackText] = hook('');
      const load = async () => (apps.value = await getTokenApps());
      const open = async (app, event) => {
        if (event.target.open) {
          selected.value = app.id;
          tokens.value = await getApiTokens(app.id);
        }
      };
      const toggleForm = () => (formOpen.value = !formOpen.value);
      const createApp = async () => {
        const callbacks = newCallback.value
            .split('\n')
            .map((value) => value.trim())
            .filter(Boolean),
          scopes = newApiScopes.value.split(/[\s,]+/).filter(Boolean);
        formError.value = callbacks.some((value) => !value.startsWith('https://')) ? 'Callbacks must use HTTPS.' : '';
        if (formError.value) return;
        try {
          const result = await createOidcClient(newId.value.trim(), callbacks, scopes);
          createdSecret.value = `Secret for ${result.id}: ${result.secret}`;
          formOpen.value = false;
          await load();
        } catch (error) {
          formError.value = error.message;
        }
      };
      const beginEdit = (app) => {
        setEditingApp(app);
        setEditingCallbackText(app.redirectUris.join('\n'));
      };
      const saveEdit = async () => {
        const result = await updateOidcCallbacks(
          editingApp.value.id,
          editingCallbackText.value
            .split('\n')
            .map((value) => value.trim())
            .filter(Boolean),
        );
        editingApp.value.redirectUris = result.redirectUris;
        setEditingApp(null);
      };
      const addScope = async (app) => {
        const result = await addOidcScopes(app.id, [scopeInput.value.trim()]);
        app.scopes = result.scopes;
        setScopeInput('');
      };
      const showTokenForm = (app) => (selected.value = app.id);
      const createToken = async (app) => {
        await createApiToken(app.id, tokenLabel.value, tokenScopes.value.split(/[\s,]+/).filter(Boolean));
        setTokenLabel('');
        setTokenScopes('');
        tokens.value = await getApiTokens(app.id);
      };
      const revokeToken = async (app, token) => {
        if (confirm('Revoke this token?')) {
          await revokeApiToken(app.id, token.label);
          tokens.value = await getApiTokens(app.id);
        }
      };
      load();
      fetch('/oidc/access', { credentials: 'include' })
        .then((response) => (response.ok ? response.json() : null))
        .then((value) => (admin.value = Boolean(value?.admin)));
      return {
        apps,
        selected,
        tokens,
        admin,
        formOpen,
        formError,
        createdSecret,
        newId,
        setNewId,
        newCallback,
        setNewCallback,
        newApiScopes,
        setNewApiScopes,
        scopeInput,
        setScopeInput,
        tokenLabel,
        setTokenLabel,
        tokenScopes,
        setTokenScopes,
        editingApp,
        editingCallbackText,
        setEditingCallbackText,
        open,
        toggleForm,
        createApp,
        beginEdit,
        saveEdit,
        addScope,
        showTokenForm,
        createToken,
        revokeToken,
      };
    }
  </script></template
>
