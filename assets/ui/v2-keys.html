<template component="v2-keys">
  <section class="content-section animate-fade-in">
    <!-- Signing Keys -->
    <div class="mb-10 border-b border-gray-100 pb-8">
      <div class="flex items-center gap-3 mb-2">
        <lucide-icon icon="key-round" size="28" class="text-brand"></lucide-icon>
        <h2 class="text-xl font-bold text-gray-900 tracking-tight">Signing keys</h2>
      </div>
      <p class="text-sm text-gray-500 mb-6">Rotate signing keys without changing OIDC clients.</p>

      <div class="flex items-center justify-between p-4 bg-gray-50 border border-gray-100 rounded-lg mb-4">
        <template for="key of keys">
          <span class="font-mono text-sm text-gray-800">{{ key.kid }}</span>
          <span
            class="text-xs font-semibold uppercase tracking-wider text-green-600 bg-green-100 px-2 py-0.5 rounded-full"
            >{{ key.status }}</span
          >
        </template>
      </div>

      <button
        class="bg-amber-800 hover:bg-amber-900 text-white px-4 py-2.5 rounded-lg text-sm font-semibold transition-colors shadow-sm"
        on-click="rotate()"
      >
        Rotate signing key
      </button>
    </div>

    <!-- Auth API Tokens -->
    <div>
      <h2 class="text-xl font-bold text-gray-900 tracking-tight mb-2">Auth API tokens</h2>
      <p class="text-sm text-gray-500 mb-6">
        Machine tokens for a registered client to call Auth's scoped API. These are not sign-in tokens and do not grant
        dashboard access.
      </p>

      <div class="relative mb-8">
        <select
          class="w-full appearance-none bg-white border border-gray-300 text-gray-700 text-sm rounded-lg focus:ring-brand focus:border-brand block p-3 pr-10 shadow-sm cursor-pointer outline-none"
          bind-value="selectedClient"
          on-change="selectClient($event.target.value)"
        >
          <option value="">Choose an OIDC client</option>
          <template for="app of apps"><option attr-value="app.id">{{ app.id }}</option></template>
        </select>
        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-500">
          <lucide-icon icon="chevron-down" size="16"></lucide-icon>
        </div>
      </div>

      <h3 class="text-sm font-bold text-gray-800 mb-4">Previously minted tokens across all apps</h3>

      <template if="createdToken">
        <v2-copy-value-box
          bind-token="createdToken"
          message="Copy this Auth API token now. It is only shown once."
        ></v2-copy-value-box>
      </template>

      <p class="mt-3 text-sm text-red-600">{{ error }}</p>

      <div
        class="border border-gray-100 rounded-xl p-5 hover:border-gray-200 transition-colors group relative bg-gray-50/50"
      >
        <template if="visibleTokens.length === 0">
          <p class="text-sm text-gray-500 text-center py-4">{{ emptyMessage }}</p>
        </template>
        <template for="entry of visibleTokens">
          <div class="flex justify-between items-start mb-1">
            <h4 class="font-bold text-gray-900">{{ entry.token.label }}</h4>
            <div class="flex items-center gap-4">
              <button
                class="text-red-600 hover:text-red-800 text-sm font-semibold transition-colors"
                type="button"
                on-click="revoke(entry)"
                if="!entry.token.revokedAt"
              >
                Revoke
              </button>
              <span class="text-sm text-gray-400 line-through decoration-gray-300" if="entry.token.revokedAt"
                >revoked</span
              >
            </div>
          </div>
          <div class="text-sm font-medium text-accent mb-1">App: {{ entry.appId }}</div>
          <div class="text-xs text-gray-500 font-mono">
            {{ entry.token.scopes.join(', ') }} · expires {{ entry.token.expiresAt }}
          </div>
        </template>
      </div>

      <template if="selectedClient">
        <form
          class="mt-6 grid gap-3 rounded-xl bg-brand/5 p-4 border border-brand/10"
          on-submit.prevent="createToken()"
        >
          <input
            class="rounded-lg border border-gray-200 px-3 py-2 text-sm"
            bind-value="tokenLabel"
            on-input="setTokenLabel($event.target.value)"
            placeholder="Token label"
            required
          />
          <p class="rounded-lg bg-brand/5 p-3 text-sm text-gray-600">
            This token has one fixed permission: mint scoped API tokens and append downstream scopes for this client.
            Existing scopes cannot be removed with this token; other clients and administrative operations are not
            available to it.
          </p>
          <button
            class="rounded-lg bg-brand hover:bg-brand-hover px-4 py-2 font-bold text-white"
            type="button"
            on-click="createToken()"
          >
            Generate Auth API token
          </button>
        </form>
      </template>
    </div>
  </section>

  <link rel="component" href="/ui/v2-copy-value.html" />
  <script setup>
    import { ref, templateRef } from '@li3/web';
    import {
      getSigningKeys,
      rotateSigningKey,
      getOidcClients,
      getAuthApiTokens,
      createAuthApiToken,
      revokeAuthApiToken,
    } from '/ui/dashboard.mjs';

    const keys = ref([]);
    const apps = ref([]);
    const selectedClient = ref('');
    const allTokens = ref([]);
    const visibleTokens = ref([]);
    const emptyMessage = ref('Loading Auth API tokens…');
    const createdToken = ref('');
    const error = ref('');
    const tokenLabel = ref('');
    let overviewRevision = 0;

    const load = async () => {
      keys.value = await getSigningKeys();
      apps.value = await getOidcClients();
    };

    const rotate = async () => {
      if (confirm('Rotate the JWT signing key?')) {
        await rotateSigningKey();
        await load();
      }
    };

    const selectClient = async (clientId) => {
      selectedClient.value = clientId;
      createdToken.value = '';
      error.value = '';
      visibleTokens.value = [];
      emptyMessage.value = clientId ? 'Loading tokens…' : '';
      await loadTokens();
    };

    const loadTokens = async () => {
      if (!selectedClient.value) {
        visibleTokens.value = allTokens.value;
        emptyMessage.value = visibleTokens.value.length ? '' : 'No Auth API tokens have been minted for your apps.';
        return;
      }
      const clientId = selectedClient.value;
      const clientTokens = await getAuthApiTokens(clientId);
      if (selectedClient.value !== clientId) return;
      visibleTokens.value = clientTokens.map((token) => ({ appId: clientId, token }));
      emptyMessage.value = visibleTokens.value.length ? '' : 'No Auth API tokens exist for this app.';
    };

    const createToken = async () => {
      error.value = '';
      try {
        const result = await createAuthApiToken(selectedClient.value, tokenLabel.value.trim());
        createdToken.value = result.token;
        tokenLabel.value = '';
        await loadTokens();
        await loadOverview();
      } catch (reason) {
        error.value = reason.message || 'Could not create Auth API token.';
      }
    };

    const revoke = async (entry) => {
      if (!confirm(`Revoke token "${entry.token.label}"?`)) return;
      await revokeAuthApiToken(entry.appId, entry.token.tokenId);
      if (selectedClient.value) await loadTokens();
      else await loadOverview();
    };

    const loadOverview = async () => {
      const revision = ++overviewRevision;
      try {
        apps.value = await getOidcClients();
        const results = await Promise.all(
          apps.value.map(async (app) => {
            try {
              return { appId: app.id, tokens: await getAuthApiTokens(app.id) };
            } catch {
              return { appId: app.id, tokens: null };
            }
          }),
        );
        if (revision !== overviewRevision) return;
        allTokens.value = results.flatMap((result) =>
          result.tokens ? result.tokens.map((token) => ({ appId: result.appId, token })) : [],
        );
        if (!selectedClient.value) {
          visibleTokens.value = allTokens.value;
          emptyMessage.value = results.some((result) => result.tokens === null)
            ? "Some apps' tokens could not be loaded. Select an app to retry its token list."
            : visibleTokens.value.length
              ? ''
              : 'No Auth API tokens have been minted for your apps.';
        } else if (results.some((result) => result.tokens === null)) {
          error.value = "Some apps' tokens could not be loaded. Select an app to retry its token list.";
        }
      } catch (reason) {
        if (revision === overviewRevision) {
          error.value = reason.message || 'Could not load apps and their Auth API tokens.';
          if (!selectedClient.value) emptyMessage.value = error.value;
        }
      }
    };

    const setTokenLabel = (value) => {
      tokenLabel.value = value;
    };

    load();
    loadOverview();
    return {
      keys,
      apps,
      selectedClient,
      allTokens,
      visibleTokens,
      emptyMessage,
      createdToken,
      error,
      tokenLabel,
      setTokenLabel,
      rotate,
      selectClient,
      loadTokens,
      createToken,
      revoke,
    };
  </script>
</template>
