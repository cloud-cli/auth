<template component="v2-applications">
  <section class="content-section animate-fade-in">
    <div class="mb-6 flex flex-col sm:flex-row sm:items-start justify-between gap-4">
      <div>
        <h2 class="text-xl font-bold text-gray-900 tracking-tight dark:text-dark-text">Applications</h2>
        <p class="text-sm text-gray-500 mt-1 max-w-2xl dark:text-dark-muted">
          Create OIDC clients for your apps. Client IDs are generated and immutable. New apps are private to you until
          an administrator publishes them.
        </p>
      </div>
      <button
        class="bg-brand hover:bg-brand-hover text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center justify-center gap-2 transition-colors shadow-sm shrink-0 dark:bg-dark-brand"
        on-click="toggleForm()"
      >
        <lucide-icon icon="plus" size="16"></lucide-icon>Add app
      </button>
    </div>

    <template if="formOpen">
      <v2-app-form bind-form-open="formOpen" on-created="load()"></v2-app-form>
    </template>

    <div class="mt-3 border border-gray-100 rounded-xl overflow-hidden shadow-list-soft dark:border-dark-border">
      <ul class="divide-y divide-gray-100 dark:divide-dark-border">
        <template if="apps.length === 0">
          <li class="p-8 text-center text-gray-500 dark:text-dark-muted">No applications configured yet.</li>
        </template>
        <template for="app of apps">
          <li class="p-4 hover:bg-gray-50/80 transition-colors group relative dark:hover:bg-dark-hover">
            <template if="app.secret">
              <v2-copy-value-box
                bind-token="app.secret"
                message="Copy this OIDC client secret now. It is only shown once."
              ></v2-copy-value-box>
            </template>
            <details class="min-w-0" on-toggle="toggleApp(app, $event)">
              <summary
                class="flex cursor-pointer list-none items-center gap-2 rounded-md text-left focus-visible:outline focus-visible:outline-2 focus-visible:outline-brand"
              >
                <lucide-icon
                  icon="chevron-right"
                  size="14"
                  class="text-gray-400 shrink-0 dark:text-dark-muted"
                ></lucide-icon>
                <span class="font-semibold text-gray-900 text-sm truncate dark:text-dark-text">{{ app.name }}</span>
                <span
                  class="rounded-full px-2 py-0.5 text-xxs font-semibold"
                  bind-class="{ 'app-visibility-published': app.availableToUsers, 'app-visibility-private': !app.availableToUsers }"
                >
                  {{ app.availableToUsers ? 'Published' : 'Private' }}
                </span>
                <lucide-icon
                  attr-icon="app.isPublic ? 'smartphone' : 'monitor'"
                  size="16"
                  class="text-gray-500 shrink-0 dark:text-dark-muted"
                  aria-hidden="true"
                  attr-title="app.isPublic ? 'Native app (PKCE)' : 'Browser/server app (client secret)'"
                ></lucide-icon>
                <span class="sr-only"
                  >{{ app.isPublic ? 'Native app (PKCE)' : 'Browser/server app (client secret)' }}</span
                >
              </summary>
              <div class="mt-3 flex flex-wrap items-center gap-2">
                <template if="app.canManage">
                  <template if="!app.isPublic">
                    <button
                      class="p-1.5 text-gray-400 hover:text-brand bg-white border border-gray-200 hover:border-brand rounded-md transition-colors dark:text-dark-muted dark:bg-dark-surface dark:border-dark-border"
                      on-click="regenSecret(app.id, $event)"
                      aria-label="Regenerate secret"
                    >
                      <lucide-icon icon="key-round" size="18"></lucide-icon>
                    </button>
                  </template>
                  <button
                    class="p-1.5 text-gray-400 hover:text-red-600 bg-white border border-gray-200 hover:border-red-300 rounded-md transition-colors dark:text-dark-muted dark:bg-dark-surface dark:border-dark-border"
                    on-click="deleteApp(app.id, $event)"
                    aria-label="Delete application"
                  >
                    <lucide-icon icon="trash" size="18"></lucide-icon>
                  </button>
                </template>
                <template if="admin && !app.availableToUsers">
                  <button
                    class="rounded-md border border-gray-200 bg-white px-2 py-1 text-xs font-semibold dark:border-dark-border dark:bg-dark-surface"
                    on-click="setAvailability(app, true, $event)"
                  >
                    Publish
                  </button>
                </template>
                <template if="admin && app.availableToUsers">
                  <button
                    class="rounded-md border border-gray-200 bg-white px-2 py-1 text-xs font-semibold dark:border-dark-border dark:bg-dark-surface"
                    on-click="setAvailability(app, false, $event)"
                  >
                    Unpublish
                  </button>
                </template>
              </div>
            </details>
            <v2-app-editor
              bind-app="app"
              bind-admin="app.canManage"
              hidden="false"
              bind-hidden.bool="!app.expanded"
            ></v2-app-editor>
          </li>
        </template>
      </ul>
    </div>
  </section>

  <link rel="component" href="/ui/dashboard-app-form.html" />
  <link rel="component" href="/ui/dashboard-copy-value.html" />
  <link rel="component" href="/ui/dashboard-app-editor.html" />
  <script setup>
    import { ref } from '@li3/web';
    import {
      getOidcClients,
      getProfile,
      removeOidcClient,
      regenerateOidcClientSecret,
      setOidcClientAvailability,
    } from '/ui/dashboard.mjs';

    export default function () {
      const apps = ref([]);
      const admin = ref(false);
      const formOpen = ref(false);

      const load = async () => {
        apps.value = (await getOidcClients()).map((app) => ({
          ...app,
          expanded: false,
          secret: '',
        }));
      };

      const toggleApp = (app, event) => {
        app.expanded = event.currentTarget.open;
      };

      const setAvailability = async (app, availableToUsers, event) => {
        event?.stopPropagation();
        const action = availableToUsers ? 'publish' : 'unpublish';
        if (
          !confirm(
            `${availableToUsers ? 'Publish' : 'Unpublish'} "${app.name}" ${availableToUsers ? 'for' : 'from'} other accounts?`,
          )
        )
          return;
        try {
          await setOidcClientAvailability(app.id, availableToUsers);
          app.availableToUsers = availableToUsers;
        } catch (error) {
          alert(`Could not ${action} app: ` + error.message);
        }
      };

      const toggleForm = () => {
        formOpen.value = !formOpen.value;
      };

      const deleteApp = async (id, event) => {
        event?.stopPropagation();
        if (!confirm('Remove this OIDC application? This cannot be undone.')) return;
        try {
          await removeOidcClient(id);
          await load();
        } catch (error) {
          alert('Could not remove app: ' + error.message);
        }
      };

      const regenSecret = async (id, event) => {
        event?.stopPropagation();
        if (!confirm('Regenerate this OIDC client secret? The current secret will stop working.')) return;
        try {
          const result = await regenerateOidcClientSecret(id);
          const app = apps.value.find((item) => item.id === id);
          if (app) app.secret = result.secret;
        } catch (error) {
          alert('Could not regenerate secret: ' + error.message);
        }
      };

      load();
      getProfile()
        .then((profile) => (admin.value = profile.role === 'admin'))
        .catch(() => {});
      return { apps, admin, formOpen, toggleForm, deleteApp, regenSecret, load, toggleApp, setAvailability };
    }
  </script>
</template>
