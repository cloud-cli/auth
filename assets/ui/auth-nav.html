      class-active="current === '/me#security'"
      href="/me#security"
      ><lucide-icon icon="user-round" size="16"></lucide-icon>Security</a
    >
    <a
      class="flex min-h-10 shrink-0 items-center gap-1.5 rounded-xl px-3 py-2 text-xs font-semibold text-slate-500 sm:gap-2 sm:px-4 sm:text-sm"
      class-active="current === '/me#properties'"
      href="/me#properties"
      ><lucide-icon icon="tags" size="16"></lucide-icon>Properties</a
    >
    <template if="admin"
      ><a
        class="flex min-h-10 shrink-0 items-center gap-1.5 rounded-xl px-3 py-2 text-xs font-semibold text-slate-500 sm:gap-2 sm:px-4 sm:text-sm"
        class-active="current === '/me#oidc'"
        href="/me#oidc"
        ><lucide-icon icon="app-window" size="16"></lucide-icon>Applications</a
      ></template
    >
    <a
      class="flex min-h-10 shrink-0 items-center gap-1.5 rounded-xl px-3 py-2 text-xs font-semibold text-slate-500 sm:gap-2 sm:px-4 sm:text-sm"
      class-active="current === '/me#activity'"
      href="/me#activity"

      ><a
        class="flex min-h-10 shrink-0 items-center gap-1.5 rounded-xl px-3 py-2 text-xs font-semibold text-slate-500 sm:gap-2 sm:px-4 sm:text-sm"

        ><lucide-icon icon="key-round" size="16"></lucide-icon>Keys</a

  <style>
    .active {
      background: #f0edff;
      color: #7257f5;
    }
  </style>
  <link rel="component" href="https://sodium.static.apphor.de/lucide-icon.html" />
  <script setup>
    import { ref } from '@li3/web';
    import { getProfile } from '/dashboard.mjs';
    export default function () {
      const current = ref(location.pathname + (location.hash || '#security'));
      const admin = ref(false);
      getProfile()
        .then((profile) => (admin.value = profile.role === 'admin'))
        .catch(() => {});
      addEventListener('hashchange', () => (current.value = location.pathname + (location.hash || '#security')));
      return { current, admin };
    }
  </script>
