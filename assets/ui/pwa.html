<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <script>
      document.documentElement.classList.toggle('dark', window.matchMedia('(prefers-color-scheme: dark)').matches);
    </script>
    <meta name="theme-color" content="#f4f7f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101713" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/ui/manifest.webmanifest" />
    <title>Auth QR</title>
    <link rel="stylesheet" href="/ui/tailwind.generated.css" />
    <script type="importmap">
      { "imports": { "@li3/": "https://cdn.li3.dev/@li3/" } }
    </script>
    <script type="module" src="/ui/pwa.mjs"></script>
  </head>
  <body
    data-page="pwa"
    class="grid min-h-dvh place-items-center bg-legacy-app-bg p-5 text-legacy-brand dark:bg-dark-page dark:text-dark-text-soft"
  >
    <template app
      ><section
        class="grid w-full max-w-md gap-4 rounded-hero border border-white/70 bg-white bg-hero-glow p-7 text-center shadow-card-soft dark:border-dark-border-subtle dark:bg-dark-surface dark:bg-hero-glow-dark"
      >
        <div class="text-5xl text-legacy-brand dark:text-dark-accent">&#10022;</div>
        <span class="text-xs font-extrabold tracking-label text-legacy-brand dark:text-dark-accent">AUTH APPROVAL</span>
        <h1 class="text-3xl font-extrabold tracking-tight">Approve a sign-in</h1>
        <p class="text-slate-500 dark:text-dark-muted-alt">Scan the code on the device you want to unlock.</p>
        <p class="min-h-6 font-semibold text-legacy-brand-focus dark:text-dark-accent">{{ message }}</p>
        <video
          ref="camera"
          class="mx-auto h-camera-height w-2/3 max-w-xs rounded-2xl bg-dark-page object-cover"
          hidden
          playsinline
        ></video
        ><button
          class="rounded-xl bg-legacy-brand px-4 py-3 font-bold text-white transition hover:bg-legacy-brand-hover focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-legacy-brand dark:bg-dark-brand dark:focus-visible:outline-dark-accent"
          on-click="scan()"
        >
          Scan QR code</button
        ><template if="installAvailable"
          ><button class="font-semibold text-legacy-brand hover:underline dark:text-dark-accent" on-click="install()">
            Install Auth QR app
          </button></template
        >
      </section>
      <script setup src="/ui/pwa.mjs"></script
    ></template>
  </body>
</html>
