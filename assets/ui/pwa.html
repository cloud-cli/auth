<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f4f7f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101713" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/ui/manifest.webmanifest" />
    <title>Auth QR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: { extend: { colors: { 'app-bg': '#f4f7f6', brand: '#263d32', accent: '#c8e6a8' } } },
      };
    </script>
    <script type="importmap">
      { "imports": { "@li3/": "https://cdn.li3.dev/@li3/" } }
    </script>
    <script type="module" src="/ui/pwa.mjs"></script>
  </head>
  <body
    data-page="pwa"
    class="grid min-h-dvh place-items-center bg-app-bg p-5 text-brand dark:bg-[#101713] dark:text-[#edf3ee]"
  >
    <template app
      ><section
        class="grid w-full max-w-md gap-4 rounded-[2rem] border border-white/70 bg-white bg-[radial-gradient(circle_at_100%_0%,rgba(200,230,168,0.4),transparent_50%)] p-7 text-center shadow-[0_8px_30px_rgb(0,0,0,0.06)] dark:border-[#2b3a30] dark:bg-[#17211b] dark:bg-[radial-gradient(circle_at_100%_0%,rgba(200,230,168,0.12),transparent_52%)]"
      >
        <div class="text-5xl text-brand dark:text-[#c8e6a8]">&#10022;</div>
        <span class="text-xs font-extrabold tracking-[.18em] text-brand dark:text-[#c8e6a8]">AUTH APPROVAL</span>
        <h1 class="text-3xl font-extrabold tracking-tight">Approve a sign-in</h1>
        <p class="text-slate-500 dark:text-[#aab8ad]">Scan the code on the device you want to unlock.</p>
        <p class="min-h-6 font-semibold text-[#376d46] dark:text-[#c8e6a8]">{{ message }}</p>
        <video
          ref="camera"
          class="mx-auto h-[38dvh] w-2/3 max-w-xs rounded-2xl bg-[#101713] object-cover"
          hidden
          playsinline
        ></video
        ><button
          class="rounded-xl bg-brand px-4 py-3 font-bold text-white transition hover:bg-[#1a2a22] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand dark:bg-[#376d46] dark:focus-visible:outline-[#c8e6a8]"
          on-click="scan()"
        >
          Scan QR code</button
        ><template if="installAvailable"
          ><button class="font-semibold text-brand hover:underline dark:text-[#c8e6a8]" on-click="install()">
            Install Auth QR app
          </button></template
        >
      </section>
      <script setup src="/ui/pwa.mjs"></script
    ></template>
  </body>
</html>
