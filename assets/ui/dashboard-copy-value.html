<template component="v2-copy-value-box">
  <section
    class="mt-3 rounded-2xl border border-emerald-300 bg-emerald-50 p-4 text-emerald-950 animate-fade-in dark:border-[#345a3d] dark:bg-[#1d3022] dark:text-[#c5e8c5]"
  >
    <p class="mb-2 text-sm font-semibold">{{ message }}</p>
    <div class="flex min-w-0 flex-col gap-2 sm:flex-row">
      <button
        class="flex min-h-10 min-w-0 flex-1 select-none items-center rounded-lg border border-emerald-200 bg-white px-3 py-2 text-left font-mono text-sm dark:border-[#345a3d] dark:bg-[#17211b] dark:text-[#edf3ee]"
        type="button"
        aria-label="Copy full value to clipboard"
        title="Tap or click to copy the full value"
        on-click="copy()"
      >
        <span class="min-w-0 flex-1 truncate">{{ tokenPrefix }}…</span><span class="shrink-0">{{ tokenSuffix }}</span>
      </button>
      <button
        class="inline-flex min-h-10 items-center justify-center gap-2 rounded-lg bg-emerald-800 px-4 py-2 text-sm font-bold text-white hover:bg-emerald-900 dark:bg-[#376d46]"
        type="button"
        on-click="copy()"
      >
        <lucide-icon icon="copy" size="16"></lucide-icon>Copy
      </button>
    </div>
    <p class="mt-2 min-h-5 text-sm font-semibold" aria-live="polite">{{ feedback }}</p>
  </section>

  <link rel="component" href="/ui/lucide-icon.html" />
  <script setup>
    import { defineProp, effect, ref } from '@li3/web';

    export default function () {
      const token = defineProp('token', { default: '' });
      const message = defineProp('message', { default: 'Copy this value now. It will not be shown again.' });
      const feedback = ref('');
      const tokenPrefix = ref('');
      const tokenSuffix = ref('');
      let feedbackTimer;

      effect(
        () => token.value,
        () => {
          const value = String(token.value || '');
          const splitAt = Math.max(0, value.length - 3);
          tokenPrefix.value = value.slice(0, splitAt);
          tokenSuffix.value = value.slice(splitAt);
        },
      );

      const showFeedback = (text) => {
        feedback.value = text;
        clearTimeout(feedbackTimer);
        feedbackTimer = setTimeout(() => (feedback.value = ''), 5000);
      };

      const copy = async () => {
        try {
          await navigator.clipboard.writeText(token.value);
          showFeedback('Copied to clipboard.');
        } catch {
          showFeedback('Copy failed. Check clipboard permissions and try again.');
        }
      };

      return { tokenPrefix, tokenSuffix, message, feedback, copy };
    }
  </script>
</template>
