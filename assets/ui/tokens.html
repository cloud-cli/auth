<template component="dashboard-tokens"
  ><section class="rounded-b-lg bg-white p-4 shadow-md shadow-violet/5 sm:p-5">
    <h2 class="text-xl font-extrabold tracking-[-.03em]">API tokens</h2>
    <p class="mt-1 text-slate-500">Create scoped tokens for your connected applications.</p>
    <select
      class="mt-5 w-full rounded-xl border border-slate-200 px-3 py-2"
      bind-value="selected"
      on-change="loadTokens()"
    >
      <option value="">Choose an app</option>
      <template for="app of apps"><option attr-value="app.id">{{ app.id }}</option></template></select
    ><template if="selected"
      ><form class="mt-4 grid gap-3 rounded-2xl bg-violet/5 p-4" on-submit.prevent="create()">
        <input
          ref="label"
          class="rounded-xl border border-slate-200 px-3 py-2"
          placeholder="Token label"
          required
        /><input
          ref="scopes"
          class="rounded-xl border border-slate-200 px-3 py-2"
          placeholder="Scopes, space separated"
          required
        /><button class="rounded-xl bg-violet px-4 py-3 font-bold text-white">Generate token</button>
      </form></template
    ><template if="created"
      ><copy-value-box bind-token="created" message="Copy this downstream API token now. It is only shown once.">
      </copy-value-box
    ></template>
    <div class="mt-5 divide-y divide-slate-100">
      <template for="token of tokens"
        ><article class="flex items-start justify-between gap-4 py-4">
          <div>
            <strong>{{ token.label }}</strong>
            <p class="text-sm text-slate-500">{{ token.scopes.join(', ') }} · expires {{ token.expiresAt }}</p>
          </div>
          <span class="text-sm text-slate-400">{{ token.revokedAt ? 'revoked' : 'active' }}</span>
        </article></template
      >
    </div>
  </section>
  <script setup>
    import { ref, templateRef } from '@li3/web';
    import { createApiToken, getApiTokens, getOidcClients } from '/ui/dashboard.mjs';
    export default function () {
      const apps = ref([]),
        selected = ref(''),
        tokens = ref([]),
        created = ref(''),
        label = templateRef('label'),
        scopes = templateRef('scopes');
      const loadTokens = async () => {
        if (selected.value) tokens.value = await getApiTokens(selected.value);
      };
      const create = async () => {
        const result = await createApiToken(
          selected.value,
          label.value.value.trim(),
          scopes.value.value.split(/\s+/).filter(Boolean),
        );
        created.value = result.token;
        label.value.value = '';
        scopes.value.value = '';
        await loadTokens();
      };
      getOidcClients().then((value) => (apps.value = value));
      return { apps, selected, tokens, created, label, scopes, loadTokens, create };
    }
  </script></template
>

<template component="dashboard-auth-api-tokens"
  ><section class="rounded-b-lg bg-white p-4 shadow-md shadow-violet/5 sm:p-5">
    <h2 class="text-xl font-extrabold tracking-[-.03em]">Auth API tokens</h2>
    <p class="mt-1 text-slate-500">
      Machine tokens for a registered client to call Auth's scoped API. These are not sign-in tokens and do not grant
      dashboard access.
    </p>
    <select
      class="mt-5 w-full rounded-xl border border-slate-200 px-3 py-2"
      ref="clientSelect"
      on-change="selectClient($event.target.value)"
    >
      <option value="">Choose an OIDC client</option>
      <template for="app of apps"><option attr-value="app.id">{{ app.id }}</option></template></select
    ><template if="selected"
      ><form class="mt-4 grid gap-3 rounded-2xl bg-violet/5 p-4" on-submit.prevent="createToken()">
        <input
          class="rounded-xl border border-slate-200 px-3 py-2"
          bind-value="tokenLabel"
          on-input="setTokenLabel($event.target.value)"
          placeholder="Token label"
          required
        />
        <p class="rounded-xl bg-violet/5 p-3 text-sm text-slate-600">
          This token has one fixed permission: mint scoped API tokens for this client. Choose downstream scopes when
          calling the token-issuance API.
        </p>
        <button class="rounded-xl bg-violet px-4 py-3 font-bold text-white" type="button" on-click="createToken()">
          Generate Auth API token
        </button>
      </form></template
    ><template if="created"
      ><copy-value-box
        bind-token="created"
        message="Copy this Auth API token now. It is only shown once."
      ></copy-value-box
    ></template>
    <p class="mt-3 text-sm text-rose-600">{{ error }}</p>
    <p class="mt-5 text-sm font-semibold text-slate-700" hidden="false" bind-hidden.bool="selected.length > 0">
      Previously minted tokens across all apps
    </p>
    <p class="mt-3 text-sm text-slate-500" data-testid="auth-token-empty-state">{{ emptyMessage }}</p>
    <div class="mt-3 divide-y divide-slate-100">
      <template for="entry of visibleTokens"
        ><article class="flex items-start justify-between gap-4 py-4">
          <div>
            <strong>{{ entry.token.label }}</strong>
            <p class="text-sm font-semibold text-violet">App: {{ entry.appId }}</p>
            <p class="text-sm text-slate-500">
              {{ entry.token.scopes.join(', ') }} · expires {{ entry.token.expiresAt }}
            </p>
          </div>
          <button
            class="text-sm font-semibold text-rose-600"
            type="button"
            if="!entry.token.revokedAt"
            on-click="revoke(entry)"
          >
            Revoke
          </button>
          <span class="text-sm text-slate-400" if="entry.token.revokedAt">revoked</span>
        </article></template
      >
    </div>
  </section>
  <script setup>
    import { ref, templateRef } from '@li3/web';
    import { createAuthApiToken, getAuthApiTokens, getOidcClients, revokeAuthApiToken } from '/ui/dashboard.mjs';
    export default function () {
      const apps = ref([]),
        selected = ref(''),
        allTokens = ref([]),
        visibleTokens = ref([]),
        emptyMessage = ref('Loading Auth API tokens…'),
        created = ref(''),
        error = ref('');
      const clientSelect = templateRef('clientSelect'),
        tokenLabel = ref('');
      let overviewRevision = 0;
      const setTokenLabel = (value) => (tokenLabel.value = value);
      const loadTokens = async () => {
        if (!selected.value) {
          visibleTokens.value = allTokens.value;
          emptyMessage.value = visibleTokens.value.length ? '' : 'No Auth API tokens have been minted for your apps.';
          return;
        }
        const clientId = selected.value;
        const clientTokens = await getAuthApiTokens(clientId);
        if (selected.value !== clientId) return;
        visibleTokens.value = clientTokens.map((token) => ({ appId: clientId, token }));
        emptyMessage.value = visibleTokens.value.length ? '' : 'No Auth API tokens exist for this app.';
      };
      const selectClient = async (clientId) => {
        selected.value = clientId;
        created.value = '';
        error.value = '';
        visibleTokens.value = [];
        emptyMessage.value = clientId ? 'Loading tokens…' : '';
        await loadTokens();
      };
      const createToken = async () => {
        error.value = '';
        try {
          const result = await createAuthApiToken(selected.value, tokenLabel.value.trim());
          created.value = result.token;
          setTokenLabel('');
          await loadTokens();
          await loadOverview();
        } catch (reason) {
          error.value = reason.message || 'Could not create Auth API token.';
        }
      };
      const revoke = async (entry) => {
        if (!confirm(`Revoke token “${entry.token.label}”?`)) return;
        await revokeAuthApiToken(entry.appId, entry.token.tokenId);
        if (selected.value) await loadTokens();
        else await loadOverview();
      };
      const loadOverview = async () => {
        const revision = ++overviewRevision;
        try {
          apps.value = await getOidcClients();
          const results = await Promise.all(
            apps.value.map(async (app) => {
              try {
                return { appId: app.id, tokens: await getAuthApiTokens(app.id) };
              } catch {
                return { appId: app.id, tokens: null };
              }
            }),
          );
          if (revision !== overviewRevision) return;
          allTokens.value = results.flatMap((result) =>
            result.tokens ? result.tokens.map((token) => ({ appId: result.appId, token })) : [],
          );
          if (!selected.value) {
            visibleTokens.value = allTokens.value;
            emptyMessage.value = results.some((result) => result.tokens === null)
              ? 'Some apps’ tokens could not be loaded. Select an app to retry its token list.'
              : visibleTokens.value.length
                ? ''
                : 'No Auth API tokens have been minted for your apps.';
          } else if (results.some((result) => result.tokens === null)) {
            error.value = 'Some apps’ tokens could not be loaded. Select an app to retry its token list.';
          }
        } catch (reason) {
          if (revision === overviewRevision) {
            error.value = reason.message || 'Could not load apps and their Auth API tokens.';
            if (!selected.value) emptyMessage.value = error.value;
          }
        }
      };
      loadOverview();
      return {
        apps,
        selected,
        allTokens,
        visibleTokens,
        emptyMessage,
        created,
        error,
        tokenLabel,
        setTokenLabel,
        clientSelect,
        loadTokens,
        selectClient,
        createToken,
        revoke,
      };
    }
  </script></template
>
