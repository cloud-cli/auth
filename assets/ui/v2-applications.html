<template component="v2-applications">
  <section class="content-section animate-fade-in">
    <div class="mb-6 flex flex-col sm:flex-row sm:items-start justify-between gap-4">
      <div>
        <h2 class="text-xl font-bold text-gray-900 tracking-tight">Applications</h2>
        <p class="text-sm text-gray-500 mt-1 max-w-2xl">
          Confidential clients are server-side apps that can keep a client secret. Public/native clients run on phones
          or desktops and use PKCE without a secret.
        </p>
      </div>
      <button
        class="bg-brand hover:bg-brand-hover text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center justify-center gap-2 transition-colors shadow-sm shrink-0"
        on-click="toggleForm()"
      >
        <lucide-icon icon="plus" size="16"></lucide-icon>Add app
      </button>
    </div>

    <template if="formOpen">
      <v2-app-form bind-form-open="formOpen" on-created="load()"></v2-app-form>
    </template>

    <div class="mt-3 border border-gray-100 rounded-xl overflow-hidden shadow-[0_2px_10px_-4px_rgba(0,0,0,0.05)]">
      <ul class="divide-y divide-gray-100">
        <template if="apps.length === 0">
          <li class="p-8 text-center text-gray-500">No applications configured yet.</li>
        </template>
        <template for="app of apps">
          <li class="p-4 hover:bg-gray-50/80 transition-colors flex items-center justify-between group relative">
            <div class="flex items-center gap-2 flex-1 min-w-0">
              <lucide-icon icon="chevron-right" size="14" class="text-gray-400 shrink-0"></lucide-icon>
              <span class="font-semibold text-gray-900 text-sm truncate">{{ app.id }}</span>
              <span class="text-gray-400 text-sm">&middot;</span>
              <span class="text-gray-500 text-sm font-medium"
                >{{ app.isPublic ? 'Public client' : 'Confidential client' }}</span
              >
            </div>
            <div class="flex gap-2">
              <template if="!app.isPublic">
                <button
                  class="p-1.5 text-gray-400 hover:text-brand bg-white border border-gray-200 hover:border-brand rounded-md transition-colors"
                  on-click="regenSecret(app.id)"
                  aria-label="Regenerate secret"
                >
                  <lucide-icon icon="key-round" size="18"></lucide-icon>
                </button>
              </template>
              <button
                class="p-1.5 text-gray-400 hover:text-red-600 bg-white border border-gray-200 hover:border-red-300 rounded-md transition-colors"
                on-click="deleteApp(app.id)"
                aria-label="Delete application"
              >
                <lucide-icon icon="trash" size="18"></lucide-icon>
              </button>
            </div>
            <template if="app.secret">
              <v2-copy-value-box
                bind-token="app.secret"
                message="Copy this OIDC client secret now. It is only shown once."
              ></v2-copy-value-box>
            </template>
          </li>
        </template>
      </ul>
    </div>
  </section>

  <link rel="component" href="/ui/v2-app-form.html" />
  <link rel="component" href="/ui/v2-copy-value.html" />
  <script setup>
    import { ref } from '@li3/web';
    import { getOidcClients, removeOidcClient, regenerateOidcClientSecret, createOidcClient } from '/ui/dashboard.mjs';

    export default function () {
      const apps = ref([]);
      const formOpen = ref(false);

      const load = async () => {
        apps.value = (await getOidcClients()).map((app) => ({
          ...app,
          secret: '',
        }));
      };

      const toggleForm = () => {
        formOpen.value = !formOpen.value;
      };

      const deleteApp = async (id) => {
        if (!confirm('Remove this OIDC application? This cannot be undone.')) return;
        try {
          await removeOidcClient(id);
          await load();
        } catch (error) {
          alert('Could not remove app: ' + error.message);
        }
      };

      const regenSecret = async (id) => {
        if (!confirm('Regenerate this OIDC client secret? The current secret will stop working.')) return;
        try {
          const result = await regenerateOidcClientSecret(id);
          const app = apps.value.find((item) => item.id === id);
          if (app) app.secret = result.secret;
        } catch (error) {
          alert('Could not regenerate secret: ' + error.message);
        }
      };

      load();
      return { apps, formOpen, toggleForm, deleteApp, regenSecret, load };
    }
  </script>
</template>
