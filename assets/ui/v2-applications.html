<template component="v2-applications">
  <section class="content-section animate-fade-in">
    <div class="mb-6 flex flex-col sm:flex-row sm:items-start justify-between gap-4">
      <div>
        <h2 class="text-xl font-bold text-gray-900 tracking-tight dark:text-[#eef3ef]">Applications</h2>
        <p class="text-sm text-gray-500 mt-1 max-w-2xl dark:text-[#aab7ad]">
          Confidential clients are server-side apps that can keep a client secret. Public/native clients run on phones
          or desktops and use PKCE without a secret.
        </p>
      </div>
      <template if="admin">
        <button
          class="bg-brand hover:bg-brand-hover text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center justify-center gap-2 transition-colors shadow-sm shrink-0 dark:bg-[#376d46]"
          on-click="toggleForm()"
        >
          <lucide-icon icon="plus" size="16"></lucide-icon>Add app
        </button>
      </template>
    </div>

    <template if="admin && formOpen">
      <v2-app-form bind-form-open="formOpen" on-created="load()"></v2-app-form>
    </template>

    <div
      class="mt-3 border border-gray-100 rounded-xl overflow-hidden shadow-[0_2px_10px_-4px_rgba(0,0,0,0.05)] dark:border-[#2d3a31]"
    >
      <ul class="divide-y divide-gray-100 dark:divide-[#2d3a31]">
        <template if="apps.length === 0">
          <li class="p-8 text-center text-gray-500 dark:text-[#aab7ad]">No applications configured yet.</li>
        </template>
        <template for="app of apps">
          <li class="p-4 hover:bg-gray-50/80 transition-colors group relative dark:hover:bg-[#243128]">
            <div class="flex items-center justify-between gap-3">
              <details class="min-w-0 flex-1" on-toggle="loadTokens(app)">
                <summary
                  class="flex cursor-pointer list-none items-center gap-2 rounded-md text-left focus-visible:outline focus-visible:outline-2 focus-visible:outline-brand"
                >
                  <lucide-icon
                    icon="chevron-right"
                    size="14"
                    class="text-gray-400 shrink-0 dark:text-[#aab7ad]"
                  ></lucide-icon>
                  <span class="font-semibold text-gray-900 text-sm truncate dark:text-[#eef3ef]">{{ app.id }}</span>
                  <span class="text-gray-400 text-sm dark:text-[#aab7ad]">&middot;</span>
                  <span class="text-gray-500 text-sm font-medium dark:text-[#aab7ad]"
                    >{{ app.isPublic ? 'Public client' : 'Confidential client' }}</span
                  >
                </summary>
              </details>
              <div class="flex gap-2 shrink-0">
                <template if="admin">
                  <template if="!app.isPublic">
                    <button
                      class="p-1.5 text-gray-400 hover:text-brand bg-white border border-gray-200 hover:border-brand rounded-md transition-colors dark:text-[#aab7ad] dark:bg-[#17211b] dark:border-[#2d3a31]"
                      on-click="regenSecret(app.id, $event)"
                      aria-label="Regenerate secret"
                    >
                      <lucide-icon icon="key-round" size="18"></lucide-icon>
                    </button>
                  </template>
                  <button
                    class="p-1.5 text-gray-400 hover:text-red-600 bg-white border border-gray-200 hover:border-red-300 rounded-md transition-colors dark:text-[#aab7ad] dark:bg-[#17211b] dark:border-[#2d3a31]"
                    on-click="deleteApp(app.id, $event)"
                    aria-label="Delete application"
                  >
                    <lucide-icon icon="trash" size="18"></lucide-icon>
                  </button>
                </template>
              </div>
            </div>
            <v2-app-editor
              bind-app="app"
              bind-admin="admin"
              hidden="false"
              bind-hidden.bool="!app.expanded"
            ></v2-app-editor>
            <template if="app.secret">
              <v2-copy-value-box
                bind-token="app.secret"
                message="Copy this OIDC client secret now. It is only shown once."
              ></v2-copy-value-box>
            </template>
          </li>
        </template>
      </ul>
    </div>
  </section>

  <link rel="component" href="/ui/v2-app-form.html" />
  <link rel="component" href="/ui/v2-copy-value.html" />
  <link rel="component" href="/ui/v2-app-editor.html" />
  <script setup>
    import { ref } from '@li3/web';
    import {
      getApiTokens,
      getOidcClients,
      getProfile,
      removeOidcClient,
      regenerateOidcClientSecret,
    } from '/ui/dashboard.mjs';

    export default function () {
      const apps = ref([]);
      const admin = ref(false);
      const formOpen = ref(false);

      const load = async () => {
        apps.value = (await getOidcClients()).map((app) => ({
          ...app,
          expanded: false,
          tokens: [],
          tokensLoaded: false,
          secret: '',
        }));
      };

      const loadTokens = async (app) => {
        app.expanded = !app.expanded;
        if (!app.expanded || app.tokensLoaded) return;
        try {
          app.tokens = await getApiTokens(app.id);
          app.tokensLoaded = true;
        } catch (error) {
          alert('Could not load tokens: ' + error.message);
        }
      };

      const toggleForm = () => {
        formOpen.value = !formOpen.value;
      };

      const deleteApp = async (id, event) => {
        event?.stopPropagation();
        if (!confirm('Remove this OIDC application? This cannot be undone.')) return;
        try {
          await removeOidcClient(id);
          await load();
        } catch (error) {
          alert('Could not remove app: ' + error.message);
        }
      };

      const regenSecret = async (id, event) => {
        event?.stopPropagation();
        if (!confirm('Regenerate this OIDC client secret? The current secret will stop working.')) return;
        try {
          const result = await regenerateOidcClientSecret(id);
          const app = apps.value.find((item) => item.id === id);
          if (app) app.secret = result.secret;
        } catch (error) {
          alert('Could not regenerate secret: ' + error.message);
        }
      };

      load();
      getProfile()
        .then((profile) => (admin.value = profile.role === 'admin'))
        .catch(() => {});
      return { apps, admin, formOpen, toggleForm, deleteApp, regenSecret, load, loadTokens };
    }
  </script>
</template>
