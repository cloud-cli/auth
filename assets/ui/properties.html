<template component="dashboard-properties"><section class="mt-5 rounded-3xl bg-white p-6 shadow-xl shadow-violet/5"><h2 class="flex items-center gap-2 text-xl font-extrabold"><lucide-icon icon="tags" size="20" icon-classes="text-violet"></lucide-icon>Properties</h2><p class="mt-1 text-slate-500">Private metadata shared with your connected apps.</p><div class="mt-4 grid gap-1"><template for="property of properties"><div class="grid grid-cols-[minmax(0,1fr)_auto] gap-1 sm:grid-cols-[minmax(7rem,.8fr)_minmax(0,2fr)_auto] sm:gap-2"><input class="col-span-2 min-w-0 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-slate-500 sm:col-span-1" bind-value="property.key" disabled><input class="min-w-0 rounded-xl border border-slate-200 px-3 py-2" bind-value="property.value" on-change="save(property)"><button class="grid h-10 w-10 place-items-center rounded-xl text-rose-600 hover:bg-rose-50" on-click="remove(property)"><lucide-icon icon="trash" size="18"></lucide-icon><span class="sr-only">Remove property</span></button></div></template><form class="grid grid-cols-[minmax(0,1fr)_auto] gap-1 sm:grid-cols-[minmax(7rem,.8fr)_minmax(0,2fr)_auto] sm:gap-2" on-submit.prevent="add()"><input ref="key" class="col-span-2 min-w-0 rounded-xl border border-slate-200 px-3 py-2 sm:col-span-1" placeholder="Key"><input ref="value" class="min-w-0 rounded-xl border border-slate-200 px-3 py-2" placeholder="Value"><button class="rounded-xl bg-violet px-3 py-2 font-semibold text-white" type="submit">Add</button></form></div></section><script setup>import { ref,templateRef } from '@li3/web';import { deleteProperty,getProperties,setProperty } from '/dashboard.mjs';export default function(){const properties=ref([]),key=templateRef('key'),value=templateRef('value');const load=async()=>properties.value=await getProperties();const save=(property)=>setProperty(property.key,property.value);const remove=async(property)=>{if(confirm('Remove '+property.key+'?')){await deleteProperty(property.key);properties.value=properties.value.filter((item)=>item!==property)}};const add=async()=>{const name=key.value.value.trim();if(!name)return;await setProperty(name,value.value.value);key.value.value='';value.value.value='';await load()};load();return{properties,key,value,save,remove,add}}</script></template>
