<template component="dashboard-properties"
  ><section class="mt-3 rounded-2xl border border-violet/10 bg-white p-3 sm:p-4">
    <h2 class="flex items-center gap-2 text-xl font-extrabold">
      <lucide-icon icon="tags" size="20" icon-classes="text-violet"></lucide-icon>Properties
    </h2>
    <p class="mt-1 text-sm text-slate-500">Private metadata shared with your connected apps.</p>
    <div class="mt-3 grid gap-2">
      <template for="property of properties"
        ><div
          class="grid grid-cols-[minmax(0,1fr)_auto] gap-2 rounded-xl border border-slate-100 p-2 sm:grid-cols-[minmax(7rem,.8fr)_minmax(0,2fr)_auto]"
        >
          <span class="col-span-2 truncate px-1 text-sm font-semibold text-slate-600 sm:col-span-1 sm:self-center">
            {{ property.key }}
          </span>
          <input
            class="min-w-0 rounded-lg border border-slate-200 px-3 py-2 text-sm"
            bind-value="property.value"
            on-change="save(property)"
          /><button
            class="grid h-10 w-10 place-items-center rounded-lg text-rose-600 hover:bg-rose-50"
            type="button"
            on-click="remove(property)"
          >
            <lucide-icon icon="trash" size="18"></lucide-icon><span class="sr-only">Remove property</span>
          </button>
        </div></template
      >
      <form
        class="grid grid-cols-[minmax(0,1fr)_auto] gap-2 rounded-xl bg-violet/5 p-2 sm:grid-cols-[minmax(7rem,.8fr)_minmax(0,2fr)_auto]"
        on-submit.prevent="add()"
      >
        <input
          ref="key"
          class="col-span-2 min-w-0 rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm sm:col-span-1"
          placeholder="Key"
        /><input
          ref="value"
          class="min-w-0 rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm"
          placeholder="Value"
        /><button class="rounded-lg bg-violet px-3 py-2 text-sm font-semibold text-white" type="submit">Add</button>
      </form>
    </div>
  </section>
  <script setup>
    import { ref, templateRef } from '@li3/web';
    import { deleteProperty, getProperties, setProperty } from '/dashboard.mjs';
    export default function () {
      const properties = ref([]),
        key = templateRef('key'),
        value = templateRef('value');
      const load = async () => (properties.value = await getProperties());
      const save = (property) => setProperty(property.key, property.value);
      const remove = async (property) => {
        if (confirm('Remove ' + property.key + '?')) {
          await deleteProperty(property.key);
          properties.value = properties.value.filter((item) => item !== property);
        }
      };
      const add = async () => {
        const name = key.value.value.trim();
        if (!name) return;
        await setProperty(name, value.value.value);
        key.value.value = '';
        value.value.value = '';
        await load();
      };
      load();
      return { properties, key, value, save, remove, add };
    }
  </script></template
>
