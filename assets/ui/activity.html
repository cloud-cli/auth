<template component="dashboard-activity"><section class="mt-5 rounded-3xl bg-white p-6 shadow-xl shadow-violet/5"><h2 class="flex items-center gap-2 text-xl font-extrabold tracking-[-.03em]"><lucide-icon icon="'timeline'" size="22" icon-classes="text-violet"></lucide-icon>Authentication history</h2><p class="mt-1 text-slate-500">Recent sign-ins and OIDC activity for your account.</p><div class="mt-5 divide-y divide-slate-100"><template for="entry of audit"><article class="grid gap-2 py-4 sm:grid-cols-[1fr_auto] sm:items-center"><div><strong>{{ entry.app }}</strong><p class="text-sm text-slate-500">{{ entry.event }}<template if="entry.redirectUri"> · {{ entry.redirectUri }}</template></p></div><div class="text-sm sm:text-right"><span>{{ entry.result }}</span><time class="mt-1 block text-slate-400">{{ entry.timestamp }}</time></div></article></template><template if="!audit.length"><p class="py-8 text-center text-slate-500">No authentication activity yet.</p></template></div></section><script setup>import { ref } from '@li3/web';import { getAuditEvents } from '/dashboard.mjs';export default function(){const audit=ref([]);getAuditEvents().then((value)=>audit.value=value);return{audit}}</script></template>
