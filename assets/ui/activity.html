<template component="dashboard-activity"
  ><section class="mt-5 rounded-3xl bg-white p-6 shadow-xl shadow-violet/5">
    <h2 class="flex items-center gap-2 text-xl font-extrabold tracking-[-.03em]">
      <lucide-icon icon="'timeline'" size="22" icon-classes="text-violet"></lucide-icon>Authentication history
    </h2>
    <div class="mt-4 grid gap-2 sm:grid-cols-[1fr_1fr_auto]">
      <select ref="app" class="rounded-xl border border-slate-200 px-3 py-2" on-change="filter()">
        <option value="">All apps</option>
        <template for="name of apps"><option attr-value="name">{{ name }}</option></template></select
      ><select ref="event" class="rounded-xl border border-slate-200 px-3 py-2" on-change="filter()">
        <option value="">All events</option>
        <template for="name of events"><option attr-value="name">{{ name }}</option></template></select
      ><button class="rounded-xl bg-violet px-4 py-2 font-semibold text-white" on-click="filter()">Filter</button>
    </div>
    <div class="mt-5 divide-y divide-slate-100">
      <template for="entry of audit"
        ><article class="grid gap-2 py-4 sm:grid-cols-[1fr_auto] sm:items-center">
          <div>
            <strong>{{ entry.app }}</strong>
            <p class="text-sm text-slate-500">
              {{ entry.event }}<template if="entry.redirectUri"> · {{ entry.redirectUri }}</template>
            </p>
          </div>
          <div class="text-sm sm:text-right">
            <span>{{ entry.result }}</span><time class="mt-1 block text-slate-400">{{ entry.timestamp }}</time>
          </div>
        </article></template
      ><template if="!audit.length"
        ><p class="py-8 text-center text-slate-500">No authentication activity yet.</p></template
      >
    </div>
    <div class="mt-5 flex items-center justify-between border-t border-slate-100 pt-4">
      <button
        class="rounded-xl border border-slate-200 px-3 py-2 text-sm font-semibold disabled:border-transparent disabled:bg-gray-100 disabled:text-gray-400"
        on-click="previous()"
        bind-disabled.bool="offset === 0"
      >
        Previous</button
      ><span class="text-sm text-slate-500">{{ offset / 20 + 1 }} / {{ pages }}</span
      ><button
        class="rounded-xl border border-slate-200 px-3 py-2 text-sm font-semibold disabled:border-transparent disabled:bg-gray-100 disabled:text-gray-400"
        on-click="next()"
        bind-disabled.bool="offset + 20 >= total"
      >
        Next
      </button>
    </div>
  </section>
  <script setup>
    import { ref, templateRef } from '@li3/web';
    import { getAuditEvents, getAuditOptions } from '@apphor/dashboard.mjs';
    export default function () {
      const audit = ref([]),
        apps = ref([]),
        events = ref([]),
        total = ref(0),
        offset = ref(0),
        pages = ref(1),
        app = templateRef('app'),
        event = templateRef('event');
      const load = async (nextOffset = 0) => {
        const result = await getAuditEvents({ app: app.value?.value, event: event.value?.value, offset: nextOffset });
        audit.value = result.items;
        total.value = result.total;
        offset.value = result.offset;
        pages.value = Math.max(1, Math.ceil(result.total / 20));
      };
      const filter = () => load(0);
      const previous = () => load(Math.max(0, offset.value - 20));
      const next = () => load(offset.value + 20);
      getAuditOptions().then((value) => {
        apps.value = value.apps;
        events.value = value.events;
      });
      load();
      return { audit, apps, events, total, offset, pages, app, event, filter, previous, next };
    }
  </script></template
>
