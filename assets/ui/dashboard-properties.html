<template component="v2-properties">
  <section class="content-section animate-fade-in">
    <div class="mb-6 flex items-center gap-3">
      <lucide-icon icon="tag" size="28" class="text-brand dark:text-dark-accent"></lucide-icon>
      <div>
        <h2 class="text-xl font-bold text-gray-900 tracking-tight dark:text-dark-text">Properties</h2>
        <p class="text-sm text-gray-500 dark:text-dark-muted">Private metadata shared with your connected apps.</p>
      </div>
    </div>

    <div class="space-y-3">
      <template if="properties.length === 0">
        <div class="py-8 text-center text-gray-500 dark:text-dark-muted">No properties set yet.</div>
      </template>
      <template for="property of properties">
        <div class="flex items-center gap-3">
          <div
            class="w-1/3 min-w-property-field bg-gray-50 border border-gray-200 text-gray-700 text-sm font-medium px-4 py-2.5 rounded-lg truncate dark:bg-dark-surface-raised dark:border-dark-border dark:text-dark-muted"
          >
            {{ property.key }}
          </div>
          <div class="relative min-w-0 flex-1">
            <input
              type="text"
              class="w-full border border-gray-200 text-gray-500 text-sm font-mono px-4 py-2.5 rounded-lg focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand bg-white dark:border-dark-border dark:bg-dark-surface dark:text-dark-text-soft dark:placeholder:text-dark-placeholder"
              bind-value="property.value"
              on-change="save(property)"
              readonly
            />
          </div>
          <button
            class="text-red-400 hover:text-red-600 hover:bg-red-50 p-2.5 rounded-lg border border-transparent hover:border-red-100 transition-colors shrink-0 dark:text-dark-danger"
            on-click="remove(property)"
            aria-label="Remove property"
          >
            <lucide-icon icon="trash" size="20"></lucide-icon>
          </button>
        </div>
      </template>

      <!-- Add new property form -->
      <form
        class="flex items-center gap-3 pt-2 border-t border-gray-100 dark:border-dark-border"
        on-submit.prevent="add()"
      >
        <input
          ref="keyInput"
          class="w-1/3 min-w-property-field border border-gray-200 bg-white text-gray-700 text-sm font-medium px-4 py-2.5 rounded-lg focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand dark:border-dark-border dark:bg-dark-surface dark:text-dark-text-soft dark:placeholder:text-dark-placeholder"
          placeholder="Key"
          required
        />
        <input
          ref="valueInput"
          class="flex-1 border border-gray-200 bg-white text-gray-700 text-sm px-4 py-2.5 rounded-lg focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand dark:border-dark-border dark:bg-dark-surface dark:text-dark-text-soft dark:placeholder:text-dark-placeholder"
          placeholder="Value"
        />
        <button
          class="bg-brand hover:bg-brand-hover text-white px-4 py-2.5 rounded-lg text-sm font-semibold transition-colors shadow-sm shrink-0 dark:bg-dark-brand"
          type="submit"
        >
          Add
        </button>
      </form>
    </div>
  </section>

  <script setup>
    import { ref, templateRef } from '@li3/web';
    import { deleteProperty, getProperties, setProperty } from '/ui/dashboard.mjs';

    export default function () {
      const properties = ref([]);
      const keyInput = templateRef('keyInput');
      const valueInput = templateRef('valueInput');

      const load = async () => {
        properties.value = await getProperties();
      };

      const save = async (property) => {
        await setProperty(property.key, property.value);
      };

      const remove = async (property) => {
        if (confirm('Remove ' + property.key + '?')) {
          await deleteProperty(property.key);
          properties.value = properties.value.filter((item) => item !== property);
        }
      };

      const add = async () => {
        const name = keyInput.value?.value.trim();
        if (!name) return;
        await setProperty(name, valueInput.value?.value || '');
        keyInput.value.value = '';
        valueInput.value.value = '';
        await load();
      };

      load();
      return { properties, keyInput, valueInput, save, remove, add };
    }
  </script>
</template>
