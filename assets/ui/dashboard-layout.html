<template component="v2-layout">
  <div class="h-full w-full flex overflow-hidden">
    <!-- Sidebar -->
    <aside
      id="sidebar"
      class="w-64 flex-col justify-between p-4 shrink-0 h-full absolute md:relative z-40 bg-app-bg dark:bg-transparent shadow-xl md:shadow-none transition-transform -translate-x-full md:translate-x-0 flex"
    >
      <div class="flex flex-col gap-6">
        <!-- Brand Logo -->
        <div class="flex items-center justify-between mt-2 px-2">
          <div class="flex items-center gap-2.5">
            <svg class="w-7 h-7" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path
                d="M16 4 L26 8 V15 C26 21 16 28 16 28 C16 28 6 21 6 15 V8 L16 4 Z"
                fill="#c8e6a8"
                stroke="#263d32"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M16 10 V18 M16 22 H16.01"
                stroke="#263d32"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span class="text-2xl font-black tracking-tight text-brand dark:text-dark-accent"
              >auth<span class="text-legacy-accent">.</span></span
            >
          </div>
          <button
            id="close-menu-btn"
            type="button"
            class="md:hidden inline-flex min-h-11 min-w-11 items-center justify-center rounded-lg p-2 text-gray-500 hover:bg-gray-200/50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand dark:text-dark-muted dark:hover:bg-dark-hover-subtle"
            aria-label="Close menu"
            aria-controls="sidebar"
            aria-expanded="true"
            on-click="closeMenu()"
          >
            <lucide-icon icon="x" size="20" aria-hidden="true"></lucide-icon>
          </button>
        </div>

        <!-- Navigation Links -->
        <nav class="flex flex-col gap-1" id="nav-menu" role="navigation" aria-label="Main navigation">
          <template if="user.role && user.role !== 'agent'">
            <button
              data-target="security"
              class="dashboard-link"
              bind-class="{ 'dashboard-link-active': section === 'security' }"
              on-click="navigate('security')"
            >
              <lucide-icon icon="shield-check" size="20"></lucide-icon><span>Security</span>
            </button>
          </template>
          <button
            data-target="profile"
            class="dashboard-link"
            bind-class="{ 'dashboard-link-active': section === 'profile' }"
            on-click="navigate('profile')"
          >
            <lucide-icon icon="user-round" size="20"></lucide-icon><span>Profile</span>
          </button>
          <button
            data-target="properties"
            class="dashboard-link"
            bind-class="{ 'dashboard-link-active': section === 'properties' }"
            on-click="navigate('properties')"
          >
            <lucide-icon icon="tag" size="20"></lucide-icon><span>Properties</span>
          </button>
          <button
            data-target="applications"
            class="dashboard-link"
            bind-class="{ 'dashboard-link-active': section === 'applications' }"
            on-click="navigate('applications')"
          >
            <lucide-icon icon="app-window" size="20"></lucide-icon><span>Applications</span>
          </button>
          <button
            data-target="agents"
            class="dashboard-link"
            bind-class="{ 'dashboard-link-active': section === 'agents' }"
            on-click="navigate('agents')"
          >
            <lucide-icon icon="bot" size="20"></lucide-icon><span>Agents</span>
          </button>
          <button
            data-target="tokens"
            class="dashboard-link"
            bind-class="{ 'dashboard-link-active': section === 'tokens' }"
            on-click="navigate('tokens')"
          >
            <lucide-icon icon="key-round" size="20"></lucide-icon><span>Tokens</span>
          </button>
          <template if="admin">
            <button
              data-target="users"
              class="dashboard-link"
              bind-class="{ 'dashboard-link-active': section === 'users' }"
              on-click="navigate('users')"
            >
              <lucide-icon
                icon="users"
                size="20"
                bind-class="{ 'dark:text-nav-active-dark-icon' : section === 'users' }"
              ></lucide-icon>
              <span>Users</span>
            </button>
          </template>
          <template if="user.role && user.role !== 'agent'"
            ><button
              data-target="activity"
              class="dashboard-link"
              bind-class="{ 'dashboard-link-active': section === 'activity' }"
              on-click="navigate('activity')"
            >
              <lucide-icon icon="list-ordered" size="20"></lucide-icon><span>Activity</span>
            </button></template
          >
        </nav>
      </div>
    </aside>

    <!-- Mobile Menu Overlay Background -->
    <div
      id="mobile-overlay"
      class="fixed inset-0 bg-gray-900/40 z-30 hidden md:hidden backdrop-blur-sm transition-opacity opacity-0"
      on-click="closeMenu()"
      aria-hidden="true"
    ></div>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full overflow-hidden w-full relative pt-4">
      <!-- Topbar -->
      <header class="h-16 flex items-center justify-between px-4 md:px-6 shrink-0 dark:bg-transparent">
        <div class="flex items-center gap-3">
          <button
            id="mobile-menu-btn"
            type="button"
            class="md:hidden inline-flex min-h-11 min-w-11 -ml-2 items-center justify-center rounded-md p-1.5 text-gray-700 transition-colors hover:bg-gray-200/50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand dark:text-dark-muted dark:hover:bg-dark-hover-subtle"
            aria-label="Open menu"
            aria-controls="sidebar"
            attr-aria-expanded="mobileMenuOpen"
            on-click="openMenu()"
          >
            <lucide-icon icon="menu" size="24" aria-hidden="true"></lucide-icon>
          </button>
        </div>

        <div class="flex items-center gap-2">
          <button
            type="button"
            id="theme-toggle"
            class="w-10 h-10 flex items-center justify-center rounded-full border border-gray-200 bg-white text-gray-700 hover:bg-gray-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand dark:border-dark-border dark:bg-dark-surface dark:text-dark-muted dark:hover:bg-dark-hover"
            aria-label="Switch to dark theme"
            attr-aria-label="darkTheme ? 'Switch to light theme' : 'Switch to dark theme'"
            title="Switch theme"
            on-click="toggleTheme()"
          >
            <template if="darkTheme"><lucide-icon icon="sun" size="18" aria-hidden="true"></lucide-icon></template>
            <template if="!darkTheme"><lucide-icon icon="moon" size="18" aria-hidden="true"></lucide-icon></template>
          </button>
          <!-- User Profile -->
          <button
            type="button"
            on-click="navigate('profile')"
            aria-label="Open profile"
            title="Open profile"
            class="flex items-center gap-4 rounded-full border border-gray-200 bg-white py-1.5 pl-1.5 pr-4 text-left shadow-sm transition-colors hover:bg-gray-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand dark:border-dark-border dark:bg-dark-surface dark:hover:bg-dark-hover dark:focus-visible:outline-dark-accent"
          >
            <div
              class="w-8 h-8 rounded-full bg-brand text-white flex items-center justify-center font-bold text-sm shrink-0 dark:bg-dark-brand"
              aria-hidden="true"
            >
              {{ userInitial }}
            </div>
            <div class="flex flex-col justify-center hidden sm:flex">
              <span class="text-sm font-semibold text-gray-900 leading-tight dark:text-dark-text"
                >{{ user.name || 'User' }}</span
              >
              <span class="text-xxs text-gray-500 leading-tight dark:text-dark-muted">{{ user.email }}</span>
            </div>
            <template if="user.role === 'admin'">
              <div
                class="flex items-center gap-1 ml-2 text-yellow-500 bg-yellow-50 px-1.5 py-0.5 rounded-md border border-yellow-100 dark:text-dark-warning dark:bg-dark-surface-warning dark:border-dark-border-warning"
                aria-label="Administrator"
              >
                <lucide-icon icon="crown" size="12" class="fill-current"></lucide-icon>
              </div>
            </template>
          </button>
        </div>
      </header>

      <!-- White Canvas Card -->
      <div
        class="bg-white border border-gray-200 rounded-2xl shadow-sm flex-1 overflow-y-auto m-4 sm:ml-4 md:m-6 md:mt-0 p-6 pb-12 md:p-10 md:pb-16 relative dark:bg-dark-surface dark:border-dark-border"
      >
        <!-- Section Components -->
        <template if="section === 'security' && user.role !== 'agent'"><v2-security></v2-security></template>
        <template if="section === 'profile'"><v2-profile></v2-profile></template>
        <template if="section === 'properties'"><v2-properties></v2-properties></template>
        <template if="section === 'applications'"><v2-applications></v2-applications></template>
        <template if="section === 'agents'"><v2-agents></v2-agents></template>
        <template if="section === 'tokens'"><v2-api-tokens></v2-api-tokens></template>
        <template if="section === 'users' && admin"><v2-users></v2-users></template>
        <template if="section === 'activity' && user.role !== 'agent'"><v2-activity></v2-activity></template>
      </div>
    </main>
  </div>

  <link rel="component" href="/ui/lucide-icon.html" />
  <style>
    #nav-menu > .dashboard-link {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 0.75rem;
      border: 1px solid transparent;
      border-radius: 0.5rem;
      padding: 0.625rem 0.75rem;
      color: #4b5563;
      font-size: 0.875rem;
      font-weight: 600;
      text-align: left;
      transition: all 150ms ease;
    }
    #nav-menu > .dashboard-link:hover {
      background: #fff;
      color: #1f2937;
    }
    #nav-menu > .dashboard-link-active {
      border-color: #cdd9cd !important;
      background: #fff;
      color: #1e3a2f;
      box-shadow: 0 1px 2px rgb(0 0 0 / 0.05);
    }
    .dark #nav-menu > .dashboard-link {
      color: #aab7ad;
    }
    .dark #nav-menu > .dashboard-link:hover {
      background: #1b2720;
      color: #edf3ee;
    }
    .dark #nav-menu > .dashboard-link-active {
      border-color: #416b48 !important;
      background: #1c2a20;
      color: #d7edc8;
    }
    .animate-fade-in {
      animation: fadeIn 200ms ease-out;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
  <script setup>
    import { ref } from '@li3/web';
    import { getProfile } from '/ui/dashboard.mjs';

    export default function () {
      const sectionForHash = (hash) =>
        ({ oidc: 'applications', keys: 'security', 'auth-api-tokens': 'security' })[hash] || hash || 'security';
      const section = ref(sectionForHash(location.hash.slice(1)));
      const admin = ref(false);
      const user = ref({ name: '', email: '', photo: '', role: '' });
      const mobileMenuOpen = ref(false);
      const darkTheme = ref(document.documentElement.dataset.theme === 'dark');
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (event) => {
        const savedPreference = localStorage.getItem('auth-theme');
        if (savedPreference !== 'dark' && savedPreference !== 'light') {
          darkTheme.value = event.matches;
        }
      });

      const userInitial = ref('U');

      async function loadProfile() {
        try {
          const profile = await getProfile();
          user.value = profile;
          admin.value = profile.role === 'admin';
          userInitial.value = (profile.name || 'U').slice(0, 1).toUpperCase();
          if (!sectionAllowed(section.value, profile.role)) {
            section.value = 'profile';
            location.hash = 'profile';
          }
        } catch (reason) {
          console.error('Failed to load profile', reason);
        }
      }

      function sectionAllowed(target, role) {
        if (role === 'agent') return ['profile', 'properties', 'applications', 'agents', 'tokens'].includes(target);
        if (target === 'users') return role === 'admin';
        return ['profile', 'properties', 'applications', 'agents', 'tokens', 'security', 'activity'].includes(target);
      }

      function navigate(target) {
        const allowedTarget = sectionAllowed(target, user.value.role) ? target : 'profile';
        section.value = allowedTarget;
        location.hash = allowedTarget;
        if (mobileMenuOpen.value) closeMenu();
      }

      function openMenu() {
        mobileMenuOpen.value = true;
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('mobile-overlay');
        sidebar.classList.remove('-translate-x-full');
        sidebar.classList.add('translate-x-0');
        overlay.classList.remove('hidden');
        setTimeout(() => {
          overlay.classList.remove('opacity-0');
          overlay.classList.add('opacity-100');
        }, 10);
      }

      function closeMenu() {
        mobileMenuOpen.value = false;
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('mobile-overlay');
        sidebar.classList.remove('translate-x-0');
        sidebar.classList.add('-translate-x-full');
        overlay.classList.remove('opacity-100');
        overlay.classList.add('opacity-0');
        setTimeout(() => overlay.classList.add('hidden'), 300);
      }

      function toggleTheme() {
        darkTheme.value = !darkTheme.value;
        const theme = darkTheme.value ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle('dark', darkTheme.value);
        localStorage.setItem('auth-theme', theme);
      }

      // Initialize
      loadProfile().catch(console.error);
      addEventListener('hashchange', () => {
        const target = sectionForHash(location.hash.slice(1));
        section.value = sectionAllowed(target, user.value.role) ? target : 'profile';
      });

      return {
        section,
        admin,
        user,
        mobileMenuOpen,
        darkTheme,
        userInitial,
        navigate,
        openMenu,
        closeMenu,
        toggleTheme,
      };
    }
  </script>
</template>
