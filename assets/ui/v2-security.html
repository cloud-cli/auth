<template component="v2-security">
  <section class="content-section animate-fade-in">
    <div class="mb-8 border-b border-gray-100 pb-8 dark:border-[#2d3a31]">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-2">
        <div class="flex items-center gap-3">
          <lucide-icon icon="key-round" size="28" class="text-brand dark:text-[#768863]"></lucide-icon>
          <div>
            <h2 class="text-xl font-bold text-brand tracking-tight dark:text-[#eef3ef]">Passkeys</h2>
            <p class="text-sm text-gray-500 dark:text-[#aab7ad]">Add a passkey to sign in without passwords.</p>
          </div>
        </div>
        <button
          class="bg-brand hover:bg-brand-hover text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center justify-center gap-2 transition-colors shadow-sm shrink-0 dark:bg-[#376d46] dark:hover:bg-[#2f563b]"
          on-click="addPasskey()"
        >
          <lucide-icon icon="plus" size="16"></lucide-icon>Add passkey
        </button>
      </div>

      <div class="mt-6 space-y-0 divide-y divide-gray-100 dark:divide-[#2d3a31]">
        <template if="passkeys.length === 0">
          <div class="py-4 text-center text-gray-500 dark:text-[#aab7ad]">No passkeys registered yet.</div>
        </template>
        <template for="key of passkeys">
          <div class="py-4 flex items-center justify-between group">
            <div>
              <h3 class="text-sm font-semibold text-brand dark:text-[#eef3ef]">{{ key.label }}</h3>
              <p class="text-xs text-gray-500 mt-0.5 font-mono dark:text-[#aab7ad]">
                Last used {{ formatLastUsed(key.lastUsedAt) }}
              </p>
            </div>
            <button
              class="text-red-400 hover:text-red-600 hover:bg-red-50 p-2 rounded-md transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-500 dark:text-[#ffb8ae]"
              on-click="revoke(key.credentialId)"
              aria-label="Revoke passkey"
            >
              <lucide-icon icon="trash" size="20"></lucide-icon>
            </button>
          </div>
        </template>
      </div>

      <button
        class="mt-4 text-brand font-semibold text-sm flex items-center gap-2 hover:text-brand-hover transition-colors dark:text-[#768863]"
        on-click="openPwa()"
      >
        <lucide-icon icon="smartphone" size="18"></lucide-icon>Open phone approval app
      </button>
    </div>

    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <lucide-icon icon="life-buoy" size="28" class="text-brand dark:text-[#768863]"></lucide-icon>
        <div>
          <h2 class="text-xl font-bold text-brand tracking-tight dark:text-[#eef3ef]">Recovery codes</h2>
          <p class="text-sm text-gray-500 dark:text-[#aab7ad]">
            Generate ten offline backup codes. New codes replace the old set.
          </p>
        </div>
      </div>
      <button
        class="bg-white border border-gray-300 hover:bg-gray-50 text-brand px-4 py-2 rounded-lg text-sm font-semibold flex items-center justify-center gap-2 transition-colors shadow-sm shrink-0 dark:bg-[#17211b] dark:border-[#2d3a31] dark:hover:bg-[#243128] dark:text-[#aab7ad]"
        on-click="recoveryCodes()"
      >
        Generate
      </button>
    </div>

    <template if="codes">
      <div class="mt-4 p-4 bg-gray-50 border border-gray-200 rounded-lg dark:bg-[#1c2820] dark:border-[#2d3a31]">
        <pre class="whitespace-pre-wrap break-words text-sm font-bold text-brand dark:text-[#768863]">{{ codes }}</pre>
      </div>
    </template>
  </section>

  <script setup>
    import { ref } from '@li3/web';
    import { getPasskeys, registerPasskey, revokePasskey, generateRecoveryCodes } from '/ui/dashboard.mjs';

    export default function () {
      const passkeys = ref([]);
      const codes = ref('');

      const load = async () => {
        const keys = await getPasskeys();
        passkeys.value = keys.filter((key) => !key.revokedAt);
      };

      const addPasskey = async () => {
        const label = prompt('Name this passkey', 'My device');
        if (label) {
          await registerPasskey(label);
          await load();
        }
      };

      const revoke = async (id) => {
        if (confirm('Revoke this passkey?')) {
          await revokePasskey(id);
          await load();
        }
      };

      const recoveryCodes = async () => {
        if (confirm('This invalidates any existing recovery codes. Continue?')) {
          codes.value = (await generateRecoveryCodes()).join('\n');
        }
      };

      const openPwa = () => window.open('/pwa/', '_blank');

      const formatLastUsed = (dateStr) => {
        if (!dateStr || dateStr === 'null') return 'never';
        try {
          const parsed = new Date(dateStr);
          return Number.isNaN(parsed.getTime()) ? 'never' : parsed.toISOString().replace('T', ' ').slice(0, 19);
        } catch {
          return 'never';
        }
      };

      load();
      return { passkeys, codes, addPasskey, revoke, recoveryCodes, openPwa, formatLastUsed };
    }
  </script>
</template>
