<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <script>
      document.documentElement.classList.toggle('dark', window.matchMedia('(prefers-color-scheme: dark)').matches);
    </script>
    <meta name="theme-color" content="#f4f7f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101713" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/ui/manifest.webmanifest" />
    <title>Approve on phone</title>
    <link rel="stylesheet" href="/ui/tailwind.generated.css" />
    <script type="importmap">
      { "imports": { "@li3/": "https://cdn.li3.dev/@li3/" } }
    </script>
    <script type="module" src="/ui/app.mjs"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/ui/sw.js', { scope: '/' }).catch(() => {});
      }
    </script>
  </head>
  <body
    data-page="qr"
    class="grid min-h-dvh place-items-center bg-legacy-app-bg p-5 text-legacy-brand dark:bg-dark-page dark:text-dark-text-soft"
  >
    <template app
      ><section
        class="grid w-full max-w-md gap-4 rounded-hero border border-white/70 bg-white bg-hero-glow p-8 text-center shadow-card-soft dark:border-dark-border-subtle dark:bg-dark-surface dark:bg-hero-glow-dark"
      >
        <span class="text-xs font-extrabold tracking-label text-legacy-brand dark:text-dark-accent"
          >PHONE APPROVAL</span
        >
        <h1 class="text-3xl font-extrabold tracking-heading">Scan to unlock</h1>
        <p class="text-slate-500 dark:text-dark-muted-alt">Open Auth on your phone and scan this one-time code.</p>
        <div
          class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-legacy-accent/40 to-legacy-brand/5 p-4 dark:from-dark-accent/12 dark:to-dark-accent/3"
        >
          <img class="w-full rounded-2xl" attr-src="qr" alt="Login QR code" />
          <div
            class="absolute inset-x-4 top-4 h-1 animate-qr-scan bg-legacy-brand shadow-lg shadow-legacy-brand dark:bg-dark-accent dark:shadow-dark-accent"
          ></div>
        </div>
        <p class="font-semibold text-legacy-brand-focus dark:text-dark-accent">{{ status }}</p>
        <a class="font-semibold text-legacy-brand hover:underline dark:text-dark-accent" attr-href="pwaUrl"
          >Open Auth PWA</a
        >
      </section>
      <script setup src="/ui/app.mjs"></script
    ></template>
  </body>
</html>
