<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Authentication history</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{colors:{ink:'#18213b',violet:'#7257f5'}}}}</script><script type="importmap">{"imports":{"@li3/":"https://cdn.li3.dev/@li3/"}}</script><link rel="component" href="https://sodium.static.apphor.de/lucide-icon.html"><script type="module" src="/ui/app.mjs"></script></head><body data-page="audit" class="min-h-dvh bg-violet/5 p-5 text-ink"><template app><main class="mx-auto max-w-4xl"><header class="flex items-center justify-between py-6"><a class="text-xl font-black" href="/me">auth</a><a class="font-semibold text-violet" href="/me">Back to account</a></header><section class="rounded-3xl bg-white p-6 shadow-xl shadow-violet/5"><h1 class="flex items-center gap-2 text-3xl font-extrabold tracking-[-.03em]"><lucide-icon icon="history" size="26" icon-classes="text-violet"></lucide-icon>Authentication history</h1><p class="mt-2 text-slate-500">Recent sign-ins and OIDC activity for your account.</p><div class="mt-6 divide-y divide-slate-100"><template for="entry of audit"><article class="grid gap-2 py-4 sm:grid-cols-[1fr_auto] sm:items-center"><div><strong>{{ entry.app }}</strong><p class="text-sm text-slate-500">{{ entry.event }}<template if="entry.redirectUri"> · {{ entry.redirectUri }}</template></p></div><div class="text-left text-sm sm:text-right"><span class="font-semibold" class-success="entry.result === 'success'" class-failure="entry.result === 'failure'">{{ entry.result }}</span><time class="mt-1 block text-slate-400">{{ entry.timestamp }}</time></div></article></template><p class="py-8 text-center text-slate-500" class-empty="!audit.length">No authentication activity yet.</p></div></section></main><script setup src="/ui/app.mjs"></script></template></body></html>
