<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Welcome back</title>
    <link rel="stylesheet" href="/ui/styles.css" />
    <link rel="stylesheet" href="/ui/login.css" />
    <script type="importmap">
      { "imports": { "@li3/": "https://cdn.li3.dev/@li3/" } }
    </script>
    <script type="module" src="/ui/app.mjs"></script>
  </head>
  <body data-page="login">
    <template app
      ><main class="shell">
        <section class="hero">
          <span class="eyebrow">auth</span>
          <h1>A single auth for every app.</h1>
          <p>Simple, cross-device and secure. Keep things moving.</p>
        </section>
        <section class="card">
          <span class="orb"></span>
          <h2>Welcome back</h2>
          <p class="muted">Choose how to continue:</p>
          <a class="button google" href="/auth/google"><img src="/ui/google.svg" alt="" />Continue with Google</a
          ><a class="button dark" attr-href="passkeyUrl">Use a passkey</a
          ><a class="button light" attr-href="qrUrl">Approve on phone</a
          ><a class="text-link" attr-href="recoveryUrl">Use a recovery code</a>
        </section>
      </main>
      <script setup src="/ui/app.mjs"></script>
    </template>
  </body>
</html>
