<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <script>
      document.documentElement.classList.toggle('dark', window.matchMedia('(prefers-color-scheme: dark)').matches);
    </script>
    <meta name="theme-color" content="#f4f7f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101713" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/ui/manifest.webmanifest" />
    <title>Welcome back</title>
    <link rel="stylesheet" href="/ui/tailwind.generated.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap"
      rel="stylesheet"
    />
    <script type="importmap">
      { "imports": { "@li3/": "https://cdn.li3.dev/@li3/" } }
    </script>
    <script type="module" src="/ui/app.mjs"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/ui/sw.js', { scope: '/' }).catch(() => {});
      }
    </script>
    <style>
      body {
        background: #f4f7f6;
        color: #263d32;
        font-family: Inter, system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #101713 !important;
          color: #edf3ee;
          color-scheme: dark;
        }
        .text-legacy-brand {
          color: #d5edc2 !important;
        }
        .text-gray-500,
        .text-gray-400 {
          color: #a5b1a8 !important;
        }
        .text-gray-700,
        .text-gray-800 {
          color: #e4ebe5 !important;
        }
        .border-gray-100,
        .border-slate-100,
        .border-slate-200 {
          border-color: #344239 !important;
        }
        .bg-legacy-brand {
          background-color: #376d46 !important;
        }
        .text-legacy-accent {
          color: #e0f4cf !important;
        }
        .bg-red-50 {
          background-color: #382322 !important;
          color: #ffd1cc !important;
        }
      }
    </style>
  </head>
  <body data-page="login" class="min-h-dvh bg-legacy-app-bg text-legacy-brand">
    <template app
      ><div class="absolute left-6 top-6 flex items-center gap-2.5 md:left-10 md:top-10">
        <svg
          class="h-7 w-7"
          viewBox="0 0 24 24"
          fill="#c8e6a8"
          stroke="#263d32"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          <path d="M12 8v4" />
          <path d="M12 16h.01" stroke-width="2.5" />
        </svg>
        <span class="text-2xl font-black tracking-tight">auth<span class="text-legacy-accent">.</span></span>
      </div>
      <main class="mx-auto grid min-h-dvh max-w-6xl items-center gap-12 px-5 py-24 md:grid-cols-2 md:px-10 lg:gap-24">
        <section class="text-center md:text-left">
          <h1 class="max-w-xl text-5xl font-black leading-display tracking-display sm:text-6xl lg:text-7xl">
            A single auth for every app.
          </h1>
          <p
            class="mx-auto mt-6 max-w-lg text-lg font-medium leading-relaxed text-legacy-brand-muted md:mx-0 md:text-xl dark:text-dark-muted-alt"
          >
            Simple, cross-device and secure. Keep things moving.
          </p>
        </section>
        <div class="mx-auto w-full max-w-md">
          <section
            data-testid="login-card"
            class="relative grid gap-3 overflow-hidden rounded-hero border border-white/70 bg-white bg-hero-glow p-8 shadow-card-soft sm:p-10 dark:border-dark-border-subtle dark:bg-dark-surface dark:bg-hero-glow-dark"
          >
            <div class="mb-2">
              <h2 class="text-2xl font-extrabold tracking-tight">Welcome back</h2>
              <p class="mt-2 text-sm font-medium text-gray-500">Choose how to continue:</p>
            </div>
            <div data-auth-error></div>
            <div class="grid gap-3">
              <a
                class="group flex min-h-12 items-center justify-center gap-3 rounded-xl border border-gray-200 bg-white px-4 font-bold text-gray-700 shadow-sm transition hover:border-gray-300 hover:bg-gray-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-legacy-brand dark:border-dark-border-strong dark:bg-dark-surface-input dark:text-dark-text-soft dark:hover:bg-dark-hover-strong dark:focus-visible:outline-dark-accent"
                href="/auth/google"
                ><img class="h-5 w-5 transition-transform group-hover:scale-105" src="/ui/google.svg" alt="" />Continue
                with Google</a
              ><a
                class="flex min-h-12 items-center justify-center gap-2 rounded-xl bg-legacy-brand px-4 font-bold text-legacy-accent transition hover:bg-legacy-brand-hover hover:shadow-md focus-visible:bg-legacy-brand-focus focus-visible:text-white focus-visible:outline focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-legacy-accent focus-visible:ring-2 focus-visible:ring-legacy-accent dark:focus-visible:outline-dark-accent"
                attr-href="passkeyUrl"
                ><svg
                  class="h-5 w-5"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M12 18v-3" />
                  <circle cx="12" cy="10" r="2.5" />
                  <path d="M5.6 16.5a9 9 0 1 1 12.8 0M8.3 13.7a5.2 5.2 0 1 1 7.4 0" />
                </svg>
                Use a passkey</a
              >
            </div>
            <div class="flex items-center gap-3 py-1">
              <span class="h-px flex-1 bg-gray-200 dark:bg-dark-border" aria-hidden="true"></span>
              <span class="text-xs font-semibold uppercase tracking-wider text-gray-400">or</span>
              <span class="h-px flex-1 bg-gray-200 dark:bg-dark-border" aria-hidden="true"></span>
            </div>
            <details>
              <summary
                class="group flex min-h-12 cursor-pointer list-none items-center justify-center gap-2 rounded-xl border border-gray-200 bg-white px-4 text-sm font-bold text-gray-700 shadow-sm transition hover:bg-gray-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-legacy-brand dark:border-dark-border-strong dark:bg-dark-surface-input dark:text-dark-text-soft dark:hover:bg-dark-hover-strong"
              >
                Sign in as an Agent
                <svg
                  class="h-4 w-4 transition-transform group-open:rotate-180"
                  viewBox="0 0 20 20"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  aria-hidden="true"
                >
                  <path d="m5 7.5 5 5 5-5" />
                </svg>
              </summary>
              <form class="mt-3 grid gap-3" on-submit.prevent="agentLogin()">
                <p class="text-xs text-gray-500">
                  Use the generated Agent ID shown when the Agent was created. Its name is only a display label.
                </p>
                <label class="grid gap-1 text-sm font-semibold" for="agent-id">Agent ID</label>
                <input
                  id="agent-id"
                  type="text"
                  autocomplete="username"
                  required
                  bind-value="agentId"
                  on-input="setAgentId($event.target.value)"
                  class="min-h-12 rounded-xl border border-slate-200 px-4 outline-none focus:border-legacy-brand dark:border-dark-border-input dark:bg-dark-surface-input"
                />
                <label class="grid gap-1 text-sm font-semibold" for="agent-token">Sign-in token</label>
                <input
                  id="agent-token"
                  type="password"
                  autocomplete="current-password"
                  required
                  bind-value="agentToken"
                  on-input="setAgentToken($event.target.value)"
                  class="min-h-12 rounded-xl border border-slate-200 px-4 outline-none focus:border-legacy-brand dark:border-dark-border-input dark:bg-dark-surface-input"
                />
                <button
                  type="submit"
                  bind-disabled.bool="busy"
                  class="flex min-h-12 items-center justify-center rounded-xl bg-legacy-brand px-4 font-bold text-legacy-accent shadow-lg disabled:opacity-60"
                >
                  {{ busy ? 'Signing in…' : 'Sign in' }}
                </button>
                <p if="message" class="text-sm" role="status" attr-class="error ? 'text-rose-600' : 'text-emerald-700'">
                  {{ message }}
                </p>
              </form>
            </details>
            <div class="grid gap-2">
              <a
                class="group flex items-center gap-3 rounded-xl border border-transparent p-3 text-left transition hover:border-gray-200 hover:bg-gray-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-legacy-brand"
                attr-href="qrUrl"
                ><span
                  class="grid h-10 w-10 shrink-0 place-items-center rounded-full bg-legacy-accent/30 text-legacy-brand transition-transform group-hover:scale-105 dark:bg-dark-surface-brand dark:text-dark-accent-bright"
                  ><svg
                    class="h-5 w-5"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    aria-hidden="true"
                  >
                    <rect x="3" y="3" width="7" height="7" rx="1" />
                    <rect x="14" y="3" width="7" height="7" rx="1" />
                    <rect x="3" y="14" width="7" height="7" rx="1" />
                    <path d="M14 14h3v3h-3zM20 14v2m-3 2h4v3h-4z" /></svg></span
                ><span
                  ><span class="block text-sm font-bold text-gray-800">Scan QR code</span
                  ><span class="block text-xs font-medium text-gray-500">Approve from another device</span></span
                ></a
              ><a
                class="group flex items-center gap-3 rounded-xl border border-transparent p-3 text-left transition hover:border-gray-200 hover:bg-gray-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-legacy-brand"
                attr-href="recoveryUrl"
                ><span
                  class="grid h-10 w-10 shrink-0 place-items-center rounded-full bg-gray-100 text-gray-600 transition-transform group-hover:scale-105 dark:bg-dark-surface-option dark:text-dark-text-dim"
                  ><svg
                    class="h-5 w-5"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    aria-hidden="true"
                  >
                    <rect x="4" y="3" width="16" height="18" rx="2" />
                    <path d="M8 7h8M8 11h8M8 15h2m3 0h3" /></svg></span
                ><span
                  ><span class="block text-sm font-bold text-gray-800">Use a recovery code</span
                  ><span class="block text-xs font-medium text-gray-500">Enter an offline backup code</span></span
                ></a
              >
            </div>
          </section>
          <p class="mt-6 flex items-center justify-center gap-2 text-xs font-semibold text-gray-400">
            <svg
              class="h-4 w-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <rect x="4" y="10" width="16" height="11" rx="2" />
              <path d="M8 10V7a4 4 0 0 1 8 0v3" />
            </svg>
            Private, secure identity
          </p>
        </div>
      </main>
      <script setup src="/ui/app.mjs"></script
    ></template>
  </body>
</html>
