<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <script>
      document.documentElement.classList.toggle('dark', window.matchMedia('(prefers-color-scheme: dark)').matches);
    </script>
    <meta name="theme-color" content="#f4f7f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101713" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/ui/manifest.webmanifest" />
    <title>Use a passkey</title>
    <link rel="stylesheet" href="/ui/tailwind.generated.css" />
    <script type="importmap">
      { "imports": { "@li3/": "https://cdn.li3.dev/@li3/" } }
    </script>
    <script type="module" src="/ui/app.mjs"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/ui/sw.js', { scope: '/' }).catch(() => {});
      }
    </script>
  </head>
  <body
    data-page="passkey"
    class="grid min-h-dvh place-items-center bg-legacy-app-bg p-5 text-legacy-brand dark:bg-dark-page dark:text-dark-text-soft"
  >
    <template app
      ><section
        class="grid w-full max-w-md gap-4 rounded-hero border border-white/70 bg-white bg-hero-glow p-8 text-center shadow-card-soft dark:border-dark-border-subtle dark:bg-dark-surface dark:bg-hero-glow-dark"
      >
        <div class="text-5xl text-legacy-brand dark:text-dark-accent">&#10022;</div>
        <span class="text-xs font-extrabold tracking-label text-legacy-brand dark:text-dark-accent"
          >SECURE SIGN-IN</span
        >
        <h1 class="text-3xl font-extrabold tracking-heading">Unlock with a passkey</h1>
        <p class="text-slate-500 dark:text-dark-muted-alt">Use your phone, security key, or saved passkey.</p>
        <button
          class="rounded-xl bg-legacy-brand px-4 py-3 font-bold text-white transition hover:bg-legacy-brand-hover focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-legacy-brand dark:bg-dark-brand dark:focus-visible:outline-dark-accent"
          on-click="signIn()"
          bind-disabled.bool="busy"
        >
          {{ busy ? 'Checking your passkey...' : 'Continue' }}
        </button>
        <p class="min-h-6 text-sm text-rose-600 dark:text-dark-danger">{{ message }}</p>
        <a class="font-semibold text-legacy-brand hover:underline dark:text-dark-accent" href="/login"
          >Choose another way</a
        >
      </section>
      <script setup src="/ui/app.mjs"></script
    ></template>
  </body>
</html>
