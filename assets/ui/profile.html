<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your account</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{colors:{ink:'#18213b',violet:'#7257f5'}}}}</script><script type="importmap">{"imports":{"@li3/":"https://cdn.li3.dev/@li3/"}}</script><link rel="component" href="https://sodium.static.apphor.de/lucide-icon.html"><script type="module" src="/ui/app.mjs"></script></head><body data-page="profile" class="min-h-dvh bg-violet/5 p-5 text-ink"><template app><main class="mx-auto max-w-4xl"><header class="flex items-center justify-between py-6"><a class="flex items-center gap-2 text-xl font-black" href="/me"><lucide-icon icon="shield-check" size="22" icon-classes="text-violet"></lucide-icon>auth</a><button class="flex items-center gap-2 font-semibold text-violet" on-click="signOut()"><lucide-icon icon="log-out" size="17"></lucide-icon>Sign out</button></header><section class="mb-8 flex items-center gap-5 rounded-3xl bg-white p-6 shadow-xl shadow-violet/5"><img attr-src="user.photo" alt="" class="h-16 w-16 rounded-full bg-violet/10 object-cover"><div><span class="text-xs font-extrabold tracking-[.18em] text-violet">ACCOUNT SECURITY</span><h1 class="mt-1 text-3xl font-extrabold tracking-[-.03em]">Hello, {{ user.name }}</h1><p class="text-slate-500">{{ user.email }}</p><button class="mt-2 inline-flex items-center gap-1 font-mono text-xs text-slate-400" on-click="copyUserId()"><span>{{ user.id }}</span><lucide-icon icon="copy" size="14"></lucide-icon><span class="sr-only">Copy user ID</span></button></div></section><section class="mb-4 rounded-3xl bg-white p-6 shadow-xl shadow-violet/5"><div class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between"><div><h2 class="flex items-center gap-2 text-xl font-extrabold"><lucide-icon icon="key-round" size="20" icon-classes="text-violet"></lucide-icon>Passkeys</h2><p class="mt-1 text-slate-500">Add a passkey to sign in without Google.</p></div><button class="flex items-center justify-center gap-2 rounded-xl bg-violet px-4 py-2 font-bold text-white" on-click="addPasskey()"><lucide-icon icon="plus" size="17"></lucide-icon>Add passkey</button></div><div class="mt-5 divide-y divide-slate-100"><template for="key of passkeys"><article class="flex items-center justify-between gap-4 py-4"><div><strong>{{ key.label }}</strong><span class="mt-1 block text-sm text-slate-500">Last used {{ key.lastUsedAt || 'never' }}</span></div><button class="font-semibold text-rose-600" on-click="revoke(key.credentialId)">Revoke</button></article></template></div><a class="mt-4 inline-flex items-center gap-2 font-semibold text-violet" href="/pwa/"><lucide-icon icon="scan-line" size="18"></lucide-icon>Install Auth QR app</a></section><section class="mb-4 rounded-3xl bg-white p-6 shadow-xl shadow-violet/5"><div><h2 class="flex items-center gap-2 text-xl font-extrabold"><lucide-icon icon="tags" size="20" icon-classes="text-violet"></lucide-icon>Properties</h2><p class="mt-1 text-slate-500">Private metadata shared with your connected apps.</p></div><div class="mt-4 grid gap-1"><template for="property of properties"><div class="grid grid-cols-[minmax(0,1fr)_auto] gap-1 sm:grid-cols-[minmax(7rem,.8fr)_minmax(0,2fr)_auto] sm:gap-2"><input class="col-span-2 min-w-0 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-slate-500 sm:col-span-1" bind-value="property.key" disabled><input class="min-w-0 rounded-xl border border-slate-200 px-3 py-2" bind-value="property.value" on-change="saveProperty(property)"><button class="grid h-10 w-10 place-items-center rounded-xl text-rose-600 hover:bg-rose-50" on-click="removeProperty(property)"><lucide-icon icon="trash" size="18"></lucide-icon><span class="sr-only">Remove property</span></button></div></template><form class="grid grid-cols-[minmax(0,1fr)_auto] gap-1 sm:grid-cols-[minmax(7rem,.8fr)_minmax(0,2fr)_auto] sm:gap-2" on-submit.prevent="addProperty()"><input ref="propertyKey" class="col-span-2 min-w-0 rounded-xl border border-slate-200 px-3 py-2 sm:col-span-1" placeholder="Key"><input ref="propertyValue" class="min-w-0 rounded-xl border border-slate-200 px-3 py-2" placeholder="Value"><button class="rounded-xl bg-violet px-3 py-2 font-semibold text-white" type="submit">Add</button></form></div></section><section class="rounded-3xl bg-white p-6 shadow-xl shadow-violet/5"><div class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between"><div><h2 class="flex items-center gap-2 text-xl font-extrabold"><lucide-icon icon="life-buoy" size="20" icon-classes="text-violet"></lucide-icon>Recovery codes</h2><p class="mt-1 text-slate-500">Generate ten offline backup codes. New codes replace the old set.</p></div><button class="rounded-xl border border-violet px-4 py-2 font-bold text-violet" on-click="recoveryCodes()">Generate codes</button></div><pre class="mt-5 whitespace-pre-wrap font-bold text-violet">{{ codes }}</pre></section></main><script setup src="/ui/app.mjs"></script></template></body></html>
