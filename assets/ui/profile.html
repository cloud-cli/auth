<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your account</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{colors:{ink:'#18213b',violet:'#7257f5'}}}}</script><script type="importmap">{"imports":{"@li3/":"https://cdn.li3.dev/@li3/"}}</script><link rel="component" href="/ui/auth-nav.html"><link rel="component" href="/ui/security.html"><link rel="component" href="/ui/properties.html"><link rel="component" href="/ui/activity.html"><link rel="component" href="/ui/oidc-apps.html"><script type="module" src="/ui/app.mjs"></script></head><body data-page="profile" class="min-h-dvh bg-violet/5 p-5 text-ink"><template app><main class="mx-auto max-w-4xl"><header class="flex items-center justify-between py-6"><a class="flex items-center gap-2 text-xl font-black" href="/me"><lucide-icon icon="shield-check" size="22" icon-classes="text-violet"></lucide-icon>auth</a><button class="flex items-center gap-2 font-semibold text-violet" on-click="signOut()"><lucide-icon icon="log-out" size="17"></lucide-icon>Sign out</button></header><section class="mb-5 flex items-center gap-5 rounded-3xl bg-white p-6 shadow-xl shadow-violet/5"><img attr-src="user.photo" alt="" class="h-16 w-16 rounded-full bg-violet/10 object-cover"><div><span class="text-xs font-extrabold tracking-[.18em] text-violet">ACCOUNT SECURITY</span><h1 class="mt-1 text-3xl font-extrabold tracking-[-.03em]">Hello, {{ user.name }}</h1><p class="text-slate-500">{{ user.email }}</p><button class="mt-2 inline-flex items-center gap-1 font-mono text-xs text-slate-400" on-click="copyUserId()"><span>{{ user.id }}</span><lucide-icon icon="copy" size="14"></lucide-icon><span class="sr-only">Copy user ID</span></button></div></section><auth-nav></auth-nav><template if="section === 'security'"><dashboard-security></dashboard-security></template><template if="section === 'properties'"><dashboard-properties
