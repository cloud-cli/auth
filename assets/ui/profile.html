<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#7257f5" />
    <link rel="manifest" href="/pwa/manifest.webmanifest" />
    <title>Your account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { theme: { extend: { colors: { ink: '#18213b', violet: '#7257f5' } } } };
    </script>
    <script type="importmap">
      { "imports": { "@li3/": "https://cdn.li3.dev/@li3/" } }
    </script>
    <link rel="component" href="/ui/auth-nav.html" />
    <link rel="component" href="/ui/security.html" />
    <link rel="component" href="/ui/properties.html" />
    <link rel="component" href="/ui/activity.html" />
    <link rel="component" href="/ui/oidc-apps.html" />
    <link rel="component" href="/ui/keys.html" />
    <link rel="component" href="/ui/tokens.html" />
    <script type="module" src="/ui/app.mjs"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/pwa/sw.js', { scope: '/' }).catch(() => {});
      }
    </script>
  </head>
  <body data-page="profile" class="min-h-dvh bg-violet/5 p-5 text-ink">
    <template app
      ><main class="mx-auto max-w-4xl">
        <header class="flex items-center gap-2 border-b border-violet/10 pb-3 mb-3">
          <a class="flex items-center gap-2 text-sm font-black" href="/me"
            ><lucide-icon icon="shield-check" size="16" icon-classes="text-violet"></lucide-icon>auth</a
          >
          <div class="flex items-center gap-2">
            <button class="rounded-lg bg-violet/10 px-3 py-1 text-xs font-semibold text-violet" on-click="signOut()">
              <lucide-icon icon="log-out" size="14"></lucide-icon>Sign out
            </button>
          </div>
        </header>
        <section class="mb-3 flex items-center gap-3 rounded-3xl bg-white p-4 shadow-sm shadow-violet/5">
          <img
            attr-src="user.photo"
            alt=""
            class="h-12 w-12 rounded-full bg-violet/10 object-cover relative"
            style="transform: rotate(-15deg); transform-origin: center center"
          />
          <div class="relative">
            <span class="text-xs font-extrabold tracking-[.18em] text-violet">ACCOUNT SECURITY</span>
            <h1 class="mt-0 text-xl font-extrabold tracking-[-.03em]">Hello, {{ user.name }}</h1>
            <p class="text-slate-500">{{ user.email }}</p>
            <template if="user.role === 'admin'">
              <span class="absolute top-1 right-1 text-xl" style="transform: rotate(15deg)">👑</span>
            </template>
            <button
              class="mt-1 inline-flex items-center gap-1 font-mono text-xs text-slate-400"
              on-click="copyUserId()"
              title="Copy OIDC subject"
            >
              <lucide-icon icon="copy" size="12"></lucide-icon>
              <span class="sr-only">Copy OIDC subject</span>
            </button>
          </div>
        </section>
        <auth-nav></auth-nav><template if="section === 'security'"><dashboard-security></dashboard-security></template
        ><template if="section === 'properties'"><dashboard-properties></dashboard-properties></template
        ><template if="section === 'activity'"><dashboard-activity></dashboard-activity></template
        ><template if="section === 'oidc'"><dashboard-oidc></dashboard-oidc></template
        ><template if="section === 'keys'"><signing-key-manager></signing-key-manager></template
        ><template if="section === 'tokens'"><dashboard-tokens></dashboard-tokens></template>
        <script setup src="/ui/app.mjs"></script></main
    ></template>
  </body>
</html>
